<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f7d4f">
<title>Paula's Vocabulary Trainer</title>
<style>
  :root {
    --gruen: #2f7d4f;
    --gruen-hell: #e3f3e8;
    --blau: #2563a8;
    --blau-hell: #e5eef9;
    --rot: #c0392b;
    --rot-hell: #fbe9e7;
    --gelb: #b7791f;
    --gelb-hell: #fdf3dc;
    --text: #1f2933;
    --grau: #6b7785;
    --linie: #d9dee4;
    --hinter: #f5f7f4;
    --karte: #ffffff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    color: var(--text);
    background: var(--hinter);
    line-height: 1.4;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; color: var(--gruen); }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .unterzeile { color: var(--grau); margin: 0; }
  .titelkopf { display: flex; align-items: center; gap: 16px; margin: 4px 0 18px; }
  .titelkopf .foto {
    width: 92px; height: 92px; flex: none; object-fit: cover;
    border-radius: 22px; border: 3px solid #fff;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .15); transform: rotate(-3deg);
  }
  .titelkopf h1 { margin-top: 0; }
  .box {
    background: var(--karte);
    border: 1px solid var(--linie);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  button {
    font: inherit;
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    background: var(--blau-hell);
    color: var(--blau);
    font-weight: 600;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.haupt { background: var(--gruen); color: #fff; width: 100%; font-size: 1.1rem; padding: 15px; }
  button.leise { background: transparent; color: var(--grau); padding: 8px 10px; font-weight: 500; }
  button.klein { padding: 7px 12px; font-size: .9rem; }
  button:focus-visible, input:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }

  /* Auswahl */
  .kapitel { border-top: 1px solid var(--linie); padding: 10px 0 4px; }
  .kapitel:first-of-type { border-top: 0; padding-top: 0; }
  .kapitel > label { font-weight: 700; }
  .abschnitte { margin: 6px 0 0 4px; }
  label.zeile {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 4px; cursor: pointer;
  }
  label.zeile input { width: 20px; height: 20px; flex: none; accent-color: var(--gruen); }
  .zeile .name { flex: 1; }
  .zeile .anzahl { color: var(--grau); font-size: .85rem; white-space: nowrap; }
  .balken { width: 70px; height: 8px; border-radius: 4px; background: var(--linie); overflow: hidden; flex: none; }
  .balken > span { display: block; height: 100%; background: var(--gruen); }

  .umschalter { display: flex; gap: 6px; flex-wrap: wrap; }
  .umschalter button { flex: 1; min-width: 120px; background: #eef1f4; color: var(--text); font-weight: 500; }
  .umschalter button[aria-pressed="true"] { background: var(--gruen); color: #fff; font-weight: 700; }
  .optionen { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }

  .faecher { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; text-align: center; }
  .fach { background: #eef1f4; border-radius: 10px; padding: 8px 2px; }
  .fach b { display: block; font-size: 1.2rem; }
  .fach small { color: var(--grau); font-size: .75rem; }
  .fach.f5 { background: var(--gruen-hell); }
  .erklaerung { color: var(--grau); font-size: .85rem; margin: 10px 0 0; }

  .fusszeile { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }

  /* Abfrage */
  .kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .fortschritt { flex: 1; height: 10px; background: var(--linie); border-radius: 5px; overflow: hidden; }
  .fortschritt > span { display: block; height: 100%; background: var(--gruen); transition: width .3s; }
  .zaehler { color: var(--grau); font-size: .9rem; white-space: nowrap; }
  .karte { text-align: center; padding: 22px 16px; }
  .richtung { color: var(--grau); font-size: .85rem; text-transform: uppercase; letter-spacing: .04em; }
  .frage { font-size: 1.7rem; font-weight: 700; margin: 10px 0 4px; word-break: break-word; }
  .herkunft { color: var(--grau); font-size: .8rem; }
  .fachmarke { display: inline-block; background: #eef1f4; border-radius: 8px; padding: 2px 8px; font-size: .75rem; color: var(--grau); margin-top: 8px; }
  .laut { background: transparent; padding: 4px 8px; font-size: 1.3rem; vertical-align: middle; }
  .eingabe { display: flex; gap: 8px; margin-top: 18px; }
  .eingabe input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.2rem;
    padding: 12px 14px; border: 2px solid var(--linie); border-radius: 10px;
  }
  .eingabe input:disabled { background: #f3f4f6; color: var(--text); }
  .nebenknoepfe { display: flex; justify-content: center; margin-top: 6px; }

  .rueckmeldung { border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; text-align: left; }
  .rueckmeldung.richtig { background: var(--gruen-hell); }
  .rueckmeldung.fast { background: var(--gelb-hell); }
  .rueckmeldung.falsch { background: var(--rot-hell); }
  .rueckmeldung .titel { font-weight: 700; font-size: 1.1rem; }
  .richtig .titel { color: var(--gruen); }
  .fast .titel { color: var(--gelb); }
  .falsch .titel { color: var(--rot); }
  .loesung { font-size: 1.2rem; font-weight: 700; margin: 6px 0; }
  .zusatz { font-size: .95rem; margin-top: 6px; }
  .zusatz .etikett { color: var(--grau); font-size: .8rem; display: block; }
  .tipp { font-size: .95rem; margin-top: 6px; }
  .knopfreihe { display: flex; gap: 8px; margin-top: 14px; }
  .knopfreihe button { flex: 1; }
  .knopfreihe button.weiter { background: var(--gruen); color: #fff; }

  /* Ende */
  .ergebnis { text-align: center; }
  .ergebnis .gross { font-size: 3rem; margin: 4px 0; }
  .ergebnis .zahl { font-size: 1.3rem; font-weight: 700; }
  .fehlerliste { list-style: none; padding: 0; margin: 0; }
  .fehlerliste li { padding: 8px 0; border-top: 1px solid var(--linie); display: flex; gap: 10px; }
  .fehlerliste li:first-child { border-top: 0; }
  .fehlerliste .en { font-weight: 700; flex: 1; }
  .fehlerliste .de { flex: 1; color: var(--grau); }

  [hidden] { display: none !important; }
</style>
</head>

    <div class="box">
      <h2>Kapitel</h2>
      <div id="kapitelliste"></div>
    </div>

    <div class="box">
      <h2>Richtung</h2>
      <div class="umschalter" id="richtung">
        <button type="button" data-wert="en-de">Englisch → Deutsch</button>
        <button type="button" data-wert="de-en">Deutsch → Englisch</button>
        <button type="button" data-wert="beide">Gemischt</button>
      </div>
      <div class="optionen">
        <label class="zeile">
          <span class="name">Wörter pro Runde</span>
          <select id="anzahl">
            <option>10</option><option>15</option><option>20</option><option>30</option>
          </select>
        </label>
        <label class="zeile"><input type="checkbox" id="vorlesen"><span class="name">Englische Wörter vorlesen</span></label>
        <label class="zeile"><input type="checkbox" id="nurPunkt"><span class="name">Nur Wörter mit Punkt (•) aus dem Buch</span></label>
      </div>
    </div>

    <div class="box">
      <h2>Dein Karteikasten</h2>
      <div class="faecher" id="faecher"></div>
      <p class="erklaerung">Richtig beantwortet rückt ein Wort ein Fach weiter und kommt seltener dran. Falsch beantwortet geht es zurück in Fach 1.</p>
    </div>

    <button type="button" class="haupt" id="los">Los geht's</button>

    <div class="fusszeile">
      <button type="button" class="leise klein" id="sichern">Fortschritt sichern</button>
      <button type="button" class="leise klein" id="laden">Fortschritt laden</button>
      <button type="button" class="leise klein" id="zuruecksetzen">Alles zurücksetzen</button>
      <input type="file" id="datei" accept=".json,application/json" hidden>
    </div>
  </section>

  <!-- Abfrage -->
  <section id="abfrage" hidden>
    <div class="kopf">
      <button type="button" class="leise klein" id="beenden">✕ Beenden</button>
      <div class="fortschritt"><span id="fortschrittsbalken"></span></div>
      <span class="zaehler" id="zaehler"></span>
    </div>

    <div class="box karte">
      <div class="richtung" id="richtungstext"></div>
      <div class="frage"><span id="frage"></span><button type="button" class="laut" id="frageLaut" title="Vorlesen" hidden>🔊</button></div>
      <div class="herkunft" id="herkunft"></div>
      <div class="fachmarke" id="fachmarke"></div>

      <form class="eingabe" id="formular" autocomplete="off">
        <input id="antwort" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Deine Antwort">
        <button type="submit" id="pruefen">Prüfen</button>
      </form>
      <div class="nebenknoepfe"><button type="button" class="leise klein" id="weissNicht">Weiß ich nicht</button></div>

      <div class="rueckmeldung" id="rueckmeldung" hidden>
        <div class="titel" id="rmTitel"></div>
        <div class="loesung"><span id="rmLoesung"></span><button type="button" class="laut" id="loesungLaut" title="Vorlesen" hidden>🔊</button></div>
        <div class="tipp" id="rmTipp" hidden></div>
        <div class="zusatz" id="rmBeispiel" hidden><span class="etikett">Beispiel</span><span id="rmBeispielText"></span><button type="button" class="laut" id="beispielLaut" title="Vorlesen">🔊</button></div>
        <div class="zusatz" id="rmHinweis" hidden><span class="etikett">Hinweis</span><span id="rmHinweisText"></span></div>
        <div class="knopfreihe">
          <button type="button" id="dochRichtig" hidden>Ich hatte doch recht</button>
          <button type="button" class="weiter" id="weiter">Weiter</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Ende einer Runde -->
  <section id="ende" hidden>
    <div class="box ergebnis">
      <div class="gross" id="endeBild"></div>
      <div class="zahl" id="endeZahl"></div>
      <p id="endeText"></p>
    </div>
    <div class="box" id="endeFehlerBox" hidden>
      <h2>Diese Wörter üben wir nochmal</h2>
      <ul class="fehlerliste" id="endeFehler"></ul>
    </div>
    <div class="knopfreihe">
      <button type="button" id="nurFehler" hidden>Fehler nochmal üben</button>
      <button type="button" class="weiter" id="zumStart">Zum Start</button>
    </div>
  </section>

const SPEICHER = "vokabeltest.v1";
// Tage bis zur nächsten Abfrage je Fach (Index = Fach 1..5)
const FACH_TAGE = [0, 0, 1, 3, 7, 14];

// ---------- Speicher ----------

function leererStand() {
  return {
    karten: {},
    einstellungen: { auswahl: [], richtung: "beide", anzahl: 15, vorlesen: true, nurPunkt: false },
  };
}

function ladeStand() {
  try {
    const roh = JSON.parse(localStorage.getItem(SPEICHER));
    if (roh && roh.karten && roh.einstellungen) {
      return { karten: roh.karten, einstellungen: { ...leererStand().einstellungen, ...roh.einstellungen } };
    }
  } catch (e) { /* kaputter Stand -> neu anfangen */ }
  return leererStand();
}

let stand = ladeStand();

function speichere() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (e) { /* z. B. privater Modus */ }
}

function heute() {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

// ---------- Hilfen ----------

const $ = id => document.getElementById(id);

function mische(liste) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function abschnittKey(v) { return v.k + "|" + v.a; }

function kapitelListe() {
  const kapitel = [];
  for (const v of VOKABELN) {
    let k = kapitel.find(x => x.name === v.k);
    if (!k) kapitel.push(k = { name: v.k, abschnitte: [] });
    let a = k.abschnitte.find(x => x.name === v.a);
    if (!a) k.abschnitte.push(a = { name: v.a, key: abschnittKey(v), vokabeln: [] });
    a.vokabeln.push(v);
  }
  return kapitel;
}

// ---------- Antwort prüfen ----------

function norm(s, grossKlein) {
  s = s.normalize("NFC")
    .replace(/[’‘`´]/g, "'")
    .replace(/…/g, " ")
    .replace(/\.{2,}/g, " ")
    .replace(/\./g, "")
    .replace(/[=!?,;:"„“”]/g, " ")
    .replace(/-+(?=\s|$)/g, "")
    .replace(/\s+/g, " ")
    .trim();
  return grossKlein ? s : s.toLowerCase();
}

function falte(s) {
  return norm(s).replace(/'/g, "").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
}

// „Freund/-in“ -> Freund, Freundin; „Komm/Kommt“ -> Komm, Kommt; „der-/die-/dasselbe“ -> derselbe …
function wortFormen(wort) {
  if (!wort.includes("/")) return [wort];
  const teile = wort.split("/");
  const formen = new Set([wort]);
  if (teile.slice(1).every(t => t.startsWith("-"))) {
    formen.add(teile[0]);
    teile.slice(1).forEach(t => formen.add(teile[0] + t.slice(1)));
  } else if (teile.slice(0, -1).every(t => t.endsWith("-"))) {
    const letztes = teile[teile.length - 1];
    const stamm = letztes.slice(3);
    formen.add(letztes);
    teile.slice(0, -1).forEach(t => formen.add(t.slice(0, -1) + stamm));
  } else {
    teile.forEach(t => formen.add(t));
  }
  return [...formen];
}

function kombiniere(text) {
  let ergebnisse = [""];
  for (const wort of text.split(" ").filter(Boolean)) {
    const formen = wortFormen(wort);
    const neu = [];
    for (const anfang of ergebnisse) for (const f of formen) neu.push(anfang ? anfang + " " + f : f);
    ergebnisse = neu.slice(0, 64);
  }
  return ergebnisse;
}

const variantenCache = new Map();

// Alle Schreibweisen, die für ein Feld als richtig gelten
function varianten(feld) {
  if (variantenCache.has(feld)) return variantenCache.get(feld);
  const aus = new Set();
  const mitPlural = /\(pl\)/i.test(feld);
  for (const alt of feld.split(";")) {
    for (let a of alt.split(" / ")) {
      a = a.trim();
      if (!a) continue;
      const formen = new Set([a, a.replace(/\([^)]*\)/g, " "), a.replace(/[()]/g, "")]);
      for (const f of formen) {
        const stuecke = mitPlural ? [f, ...f.split(",")] : [f];
        for (const s of stuecke) for (const k of kombiniere(s.replace(/\s+/g, " ").trim())) if (k) aus.add(k);
      }
    }
  }
  const liste = [...aus];
  variantenCache.set(feld, liste);
  return liste;
}

function abstand(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 3;
  const z = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let vorher = z[0];
    z[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = z[j];
      z[j] = Math.min(z[j] + 1, z[j - 1] + 1, vorher + (a[i - 1] === b[j - 1] ? 0 : 1));
      vorher = tmp;
    }
  }
  return z[b.length];
}

// Deutsche Bedeutung -> alle englischen Einträge damit (für „klein“ = small und little)
const nachDeutsch = new Map();
for (const v of VOKABELN) {
  for (const d of varianten(v.de)) {
    const n = norm(d);
    if (!nachDeutsch.has(n)) nachDeutsch.set(n, new Set());
    nachDeutsch.get(n).add(v);
  }
}

function pruefeAntwort(karte, eingabe) {
  const v = karte.v;
  const zielFeld = karte.richtung === "en-de" ? v.de : v.en;
  const loesung = zielFeld;
  const a = norm(eingabe);
  if (!a) return { status: "falsch", loesung };

  const ziele = varianten(zielFeld);
  const zieleNorm = ziele.map(z => norm(z));

  if (zieleNorm.includes(a)) {
    let tipp = "";
    const exakt = norm(eingabe, true);
    const passt = karte.richtung === "en-de"
      ? ziele.some(z => norm(z, true) === exakt)
      : ziele.some(z => norm(z, true).slice(1) === exakt.slice(1));
    if (!passt) tipp = "Achte auf die Groß- und Kleinschreibung.";
    return { status: "richtig", loesung, tipp };
  }

  if (karte.richtung === "de-en") {
    const ohneTo = zieleNorm.filter(z => z.startsWith("to ")).map(z => z.slice(3));
    if (ohneTo.includes(a)) {
      return { status: "richtig", loesung, tipp: "Bei Verben gehört das „to“ dazu: " + v.en };
    }
  }

  const f = falte(eingabe);
  if (ziele.some(z => falte(z) === f)) {
    return { status: "richtig", loesung, tipp: "Achte auf die Schreibweise: " + loesung };
  }

  if (karte.richtung === "de-en") {
    const andere = new Set();
    for (const d of varianten(v.de)) for (const w of nachDeutsch.get(norm(d)) || []) if (w !== v) andere.add(w);
    for (const w of andere) {
      if (varianten(w.en).some(z => norm(z) === a)) {
        return { status: "richtig", loesung, tipp: "Auch richtig! Hier im Buch gemeint ist aber: " + v.en };
      }
    }
  }

  const grenze = a.length >= 8 ? 2 : a.length >= 4 ? 1 : 0;
  if (grenze && zieleNorm.some(z => abstand(a, z) <= grenze)) {
    return { status: "fast", loesung };
  }
  return { status: "falsch", loesung };
}

// ---------- Vorlesen ----------

let englischeStimme = null;
function waehleStimme() {
  if (!("speechSynthesis" in window)) return;
  const stimmen = speechSynthesis.getVoices();
  englischeStimme = stimmen.find(s => s.lang === "en-GB") || stimmen.find(s => s.lang.startsWith("en")) || null;
}
if ("speechSynthesis" in window) {
  waehleStimme();
  speechSynthesis.onvoiceschanged = waehleStimme;
}

function sprich(text) {
  if (!("speechSynthesis" in window) || !text) return;
  const sauber = text.replace(/\([^)]*\)/g, " ").replace(/\.\.\.|…/g, " ").replace(/\s+/g, " ").trim();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(sauber);
  u.lang = "en-GB";
  if (englischeStimme) u.voice = englischeStimme;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

// ---------- Karteikasten ----------

function kartenKey(v, richtung) { return v.id + "|" + richtung; }

function fachVon(key) {
  const k = stand.karten[key];
  return k ? k.fach : 0;
}

function ausgewaehlteVokabeln() {
  const e = stand.einstellungen;
  return VOKABELN.filter(v => e.auswahl.includes(abschnittKey(v)) && (!e.nurPunkt || v.p));
}

function richtungen() {
  const r = stand.einstellungen.richtung;
  return r === "beide" ? ["en-de", "de-en"] : [r];
}

function alleKarten() {
  const karten = [];
  for (const v of ausgewaehlteVokabeln()) {
    for (const r of richtungen()) karten.push({ v, richtung: r, key: kartenKey(v, r) });
  }
  return karten;
}

function istFaellig(karte) {
  const k = stand.karten[karte.key];
  return !k || k.faellig <= heute();
}

function baueRunde(karten, anzahl) {
  const sortiert = mische(karten).sort((a, b) => fachVon(a.key) - fachVon(b.key));
  // bei „Gemischt“ ein Wort nur einmal pro Runde
  const gesehen = new Set();
  const runde = [];
  for (const k of sortiert) {
    if (gesehen.has(k.v.id)) continue;
    gesehen.add(k.v.id);
    runde.push(k);
    if (runde.length >= anzahl) break;
  }
  return mische(runde);
}

// ---------- Startseite ----------

const KAPITEL = kapitelListe();

function zeichneStart() {
  const e = stand.einstellungen;
  const liste = $("kapitelliste");
  liste.innerHTML = "";
  for (const k of KAPITEL) {
    const block = document.createElement("div");
    block.className = "kapitel";
    const alle = k.abschnitte.every(a => e.auswahl.includes(a.key));
    const einige = k.abschnitte.some(a => e.auswahl.includes(a.key));
    const kopf = document.createElement("label");
    kopf.className = "zeile";
    kopf.innerHTML = `<input type="checkbox"><span class="name"></span><span class="anzahl"></span>`;
    const kb = kopf.querySelector("input");
    kb.checked = alle;
    kb.indeterminate = einige && !alle;
    kopf.querySelector(".name").textContent = k.name;
    kopf.querySelector(".anzahl").textContent = k.abschnitte.reduce((n, a) => n + a.vokabeln.length, 0) + " Wörter";
    kb.addEventListener("change", () => {
      for (const a of k.abschnitte) setzeAuswahl(a.key, kb.checked);
      zeichneStart();
    });
    block.appendChild(kopf);

    const unter = document.createElement("div");
    unter.className = "abschnitte";
    for (const a of k.abschnitte) {
      const z = document.createElement("label");
      z.className = "zeile";
      z.innerHTML = `<input type="checkbox"><span class="name"></span><span class="balken" title="Anteil in Fach 3 bis 5"><span></span></span><span class="anzahl"></span>`;
      const cb = z.querySelector("input");
      cb.checked = e.auswahl.includes(a.key);
      cb.addEventListener("change", () => { setzeAuswahl(a.key, cb.checked); zeichneStart(); });
      z.querySelector(".name").textContent = a.name;
      z.querySelector(".anzahl").textContent = a.vokabeln.length;
      z.querySelector(".balken > span").style.width = Math.round(gelerntAnteil(a.vokabeln) * 100) + "%";
      unter.appendChild(z);
    }
    block.appendChild(unter);
    liste.appendChild(block);
  }

  for (const b of $("richtung").querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b.dataset.wert === e.richtung));
  }
  $("anzahl").value = String(e.anzahl);
  $("vorlesen").checked = e.vorlesen;
  $("nurPunkt").checked = e.nurPunkt;

  const karten = alleKarten();
  const zaehler = [0, 0, 0, 0, 0, 0];
  for (const k of karten) zaehler[fachVon(k.key)]++;
  $("faecher").innerHTML = zaehler.map((n, i) =>
    `<div class="fach f${i}"><b>${n}</b><small>${i === 0 ? "neu" : "Fach " + i}</small></div>`).join("");

  const faellig = karten.filter(istFaellig).length;
  const los = $("los");
  if (!karten.length) {
    los.textContent = "Wähle mindestens einen Abschnitt";
    los.disabled = true;
  } else if (faellig) {
    los.textContent = `Los geht's (${Math.min(faellig, e.anzahl)} Wörter)`;
    los.disabled = false;
  } else {
    los.textContent = "Heute ist nichts fällig – trotzdem üben";
    los.disabled = false;
  }
}

function gelerntAnteil(vokabeln) {
  let gelernt = 0, gesamt = 0;
  for (const v of vokabeln) for (const r of richtungen()) {
    gesamt++;
    if (fachVon(kartenKey(v, r)) >= 3) gelernt++;
  }
  return gesamt ? gelernt / gesamt : 0;
}

function setzeAuswahl(key, an) {
  const a = stand.einstellungen.auswahl.filter(x => x !== key);
  if (an) a.push(key);
  stand.einstellungen.auswahl = a;
  speichere();
}

$("richtung").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  stand.einstellungen.richtung = b.dataset.wert;
  speichere();
  zeichneStart();
});
$("anzahl").addEventListener("change", ev => { stand.einstellungen.anzahl = Number(ev.target.value); speichere(); zeichneStart(); });
$("vorlesen").addEventListener("change", ev => { stand.einstellungen.vorlesen = ev.target.checked; speichere(); });
$("nurPunkt").addEventListener("change", ev => { stand.einstellungen.nurPunkt = ev.target.checked; speichere(); zeichneStart(); });

$("los").addEventListener("click", () => {
  const karten = alleKarten();
  const faellig = karten.filter(istFaellig);
  starteRunde(baueRunde(faellig.length ? faellig : karten, stand.einstellungen.anzahl));
});

// ---------- Abfrage ----------

let runde = null;

function zeige(bereich) {
  for (const id of ["start", "abfrage", "ende"]) $(id).hidden = id !== bereich;
  window.scrollTo(0, 0);
}

function starteRunde(karten) {
  if (!karten.length) return;
  runde = {
    schlange: karten.slice(),
    gesamt: karten.length,
    fertig: 0,
    ersterVersuch: new Map(),  // key -> true/false
    aktuell: null,
    ergebnis: null,
  };
  zeige("abfrage");
  naechsteKarte();
}

function naechsteKarte() {
  if (!runde.schlange.length) return zeigeEnde();
  const karte = runde.schlange.shift();
  runde.aktuell = karte;
  runde.ergebnis = null;
  const v = karte.v;
  const enDe = karte.richtung === "en-de";

  $("richtungstext").textContent = enDe ? "Englisch → Deutsch" : "Deutsch → Englisch";
  $("frage").textContent = enDe ? v.en : v.de;
  $("frageLaut").hidden = !enDe;
  $("herkunft").textContent = `${v.k} · ${v.a} · S. ${v.s}`;
  const fach = fachVon(karte.key);
  $("fachmarke").textContent = runde.ersterVersuch.has(karte.key) ? "Wiederholung" : fach ? "Fach " + fach : "neues Wort";

  const feld = $("antwort");
  feld.value = "";
  feld.disabled = false;
  feld.placeholder = enDe ? "auf Deutsch" : "auf Englisch";
  $("pruefen").disabled = false;
  $("weissNicht").hidden = false;
  $("rueckmeldung").hidden = true;
  zeichneFortschritt();
  feld.focus();
  if (enDe && stand.einstellungen.vorlesen) sprich(v.en);
}

function zeichneFortschritt() {
  $("fortschrittsbalken").style.width = Math.round(runde.fertig / runde.gesamt * 100) + "%";
  $("zaehler").textContent = `${runde.fertig} / ${runde.gesamt}`;
}

function werteAus(eingabe) {
  if (runde.ergebnis) return;
  const karte = runde.aktuell;
  const e = pruefeAntwort(karte, eingabe);
  runde.ergebnis = e;
  $("antwort").disabled = true;
  $("pruefen").disabled = true;
  $("weissNicht").hidden = true;
  zeigeRueckmeldung();
  if (karte.richtung === "de-en" && stand.einstellungen.vorlesen) sprich(karte.v.en);
}

const LOB = ["Richtig!", "Super!", "Klasse!", "Genau!", "Stark!", "Perfekt!"];

function zeigeRueckmeldung() {
  const e = runde.ergebnis;
  const v = runde.aktuell.v;
  const rm = $("rueckmeldung");
  rm.className = "rueckmeldung " + e.status;
  $("rmTitel").textContent = e.status === "richtig" ? LOB[Math.floor(Math.random() * LOB.length)]
    : e.status === "fast" ? "Fast! Schau dir die Schreibweise an:" : "Leider nicht. Richtig ist:";
  $("rmLoesung").textContent = e.loesung;
  $("loesungLaut").hidden = runde.aktuell.richtung !== "de-en";
  $("rmTipp").hidden = !e.tipp;
  $("rmTipp").textContent = e.tipp || "";
  $("rmBeispiel").hidden = !v.bsp;
  $("rmBeispielText").textContent = v.bsp;
  $("rmHinweis").hidden = !v.hw;
  $("rmHinweisText").textContent = v.hw;
  $("dochRichtig").hidden = e.status === "richtig" || !norm($("antwort").value);
  rm.hidden = false;
  $("weiter").focus();
}

function buche() {
  const karte = runde.aktuell;
  const richtig = runde.ergebnis.status === "richtig";
  if (!runde.ersterVersuch.has(karte.key)) {
    runde.ersterVersuch.set(karte.key, richtig);
    const alt = stand.karten[karte.key] || { fach: 0, richtig: 0, falsch: 0 };
    // neue Wörter, die auf Anhieb sitzen, rücken gleich in Fach 2
    const fach = richtig ? Math.min(5, Math.max(alt.fach, 1) + 1) : 1;
    stand.karten[karte.key] = {
      fach,
      faellig: heute() + FACH_TAGE[fach],
      richtig: alt.richtig + (richtig ? 1 : 0),
      falsch: alt.falsch + (richtig ? 0 : 1),
    };
    speichere();
  }
  if (richtig) {
    runde.fertig++;
  } else {
    // falsch beantwortete Wörter kommen in dieser Runde noch einmal
    runde.schlange.splice(Math.min(3, runde.schlange.length), 0, karte);
  }
}

$("formular").addEventListener("submit", ev => { ev.preventDefault(); werteAus($("antwort").value); });
$("weissNicht").addEventListener("click", () => werteAus(""));
$("weiter").addEventListener("click", () => { buche(); naechsteKarte(); });
$("dochRichtig").addEventListener("click", () => {
  runde.ergebnis = { ...runde.ergebnis, status: "richtig", tipp: "" };
  zeigeRueckmeldung();
});
$("frageLaut").addEventListener("click", () => sprich(runde.aktuell.v.en));
$("loesungLaut").addEventListener("click", () => sprich(runde.aktuell.v.en));
$("beispielLaut").addEventListener("click", () => sprich(runde.aktuell.v.bsp));
$("beenden").addEventListener("click", () => {
  if (runde.fertig === 0 || confirm("Runde beenden? Was du schon beantwortet hast, bleibt gespeichert.")) {
    zeigeEnde();
  }
});

// ---------- Ende ----------

function zeigeEnde() {
  const versuche = [...runde.ersterVersuch.values()];
  const richtig = versuche.filter(Boolean).length;
  const gesamt = versuche.length;
  const quote = gesamt ? richtig / gesamt : 0;
  $("endeBild").textContent = !gesamt ? "👋" : quote === 1 ? "🏆" : quote >= 0.8 ? "🎉" : quote >= 0.5 ? "👍" : "💪";
  $("endeZahl").textContent = gesamt ? `${richtig} von ${gesamt} beim ersten Versuch richtig` : "Keine Wörter beantwortet";
  $("endeText").textContent = !gesamt ? "" : quote === 1 ? "Alles gewusst – großartig!"
    : quote >= 0.8 ? "Sehr gut gemacht!" : quote >= 0.5 ? "Gut! Die restlichen Wörter kommen bald wieder dran."
    : "Dranbleiben – mit jeder Runde bleibt mehr hängen.";

  const falsche = [];
  for (const [key, ok] of runde.ersterVersuch) {
    if (!ok) falsche.push(alleKartenNachKey(key));
  }
  runde.falsche = falsche.filter(Boolean);
  const ul = $("endeFehler");
  ul.innerHTML = "";
  for (const k of runde.falsche) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="en"></span><span class="de"></span>`;
    li.querySelector(".en").textContent = k.v.en;
    li.querySelector(".de").textContent = k.v.de;
    ul.appendChild(li);
  }
  $("endeFehlerBox").hidden = !runde.falsche.length;
  $("nurFehler").hidden = !runde.falsche.length;
  zeige("ende");
  $("zumStart").focus();
}

function alleKartenNachKey(key) {
  const trenner = key.lastIndexOf("|");
  const id = key.slice(0, trenner);
  const richtung = key.slice(trenner + 1);
  const v = VOKABELN.find(x => x.id === id);
  return v ? { v, richtung, key } : null;
}

$("nurFehler").addEventListener("click", () => starteRunde(mische(runde.falsche)));
$("zumStart").addEventListener("click", () => { zeichneStart(); zeige("start"); });

// ---------- Fortschritt sichern / laden ----------

$("sichern").addEventListener("click", () => {
  const d = new Date();
  const datum = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const inhalt = JSON.stringify({ app: "vokabeltest", version: 1, gesichert: datum, stand }, null, 1);
  const url = URL.createObjectURL(new Blob([inhalt], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `vokabeltest-fortschritt-${datum}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

$("laden").addEventListener("click", () => $("datei").click());
$("datei").addEventListener("change", async ev => {
  const datei = ev.target.files[0];
  ev.target.value = "";
  if (!datei) return;
  try {
    const d = JSON.parse(await datei.text());
    if (d.app !== "vokabeltest" || !d.stand || !d.stand.karten) throw new Error();
    if (!confirm(`Fortschritt vom ${d.gesichert || "?"} laden? Der jetzige Stand wird ersetzt.`)) return;
    stand = { karten: d.stand.karten, einstellungen: { ...leererStand().einstellungen, ...d.stand.einstellungen } };
    speichere();
    zeichneStart();
  } catch (e) {
    alert("Diese Datei ist keine Fortschritts-Sicherung vom Vokabeltrainer.");
  }
});

$("zuruecksetzen").addEventListener("click", () => {
  if (!confirm("Wirklich den ganzen Fortschritt löschen? Alle Wörter fangen wieder bei „neu“ an.")) return;
  stand = { ...leererStand(), einstellungen: stand.einstellungen };
  speichere();
  zeichneStart();
});

// ---------- Start ----------

if (!stand.einstellungen.auswahl.length && KAPITEL.length) {
  stand.einstellungen.auswahl = KAPITEL[0].abschnitte.map(a => a.key);
}
zeichneStart();
</script>
