<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b3f9e">
<title>Reismann 5d Politik Trainer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<style>
  :root {
    --haupt: #5b3f9e;
    --haupt-hell: #eee8fa;
    --gruen: #2f7d4f;
    --gruen-hell: #e3f3e8;
    --blau: #2563a8;
    --blau-hell: #e5eef9;
    --rot: #c0392b;
    --rot-hell: #fbe9e7;
    --gelb: #b7791f;
    --gelb-hell: #fdf3dc;
    --text: #1f2933;
    --grau: #6b7785;
    --linie: #d9dee4;
    --hinter: #f6f5f9;
    --karte: #ffffff;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    color: var(--text);
    background: var(--hinter);
    line-height: 1.4;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 2px; color: var(--haupt); }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .unterzeile { color: var(--grau); margin: 0; }
  .titelkopf { display: flex; align-items: center; gap: 14px; margin: 4px 0 18px; }
  .titelkopf .symbol {
    width: 64px; height: 64px; flex: none; border-radius: 18px;
    background: var(--haupt); display: grid; place-items: center; font-size: 2.1rem;
    box-shadow: 0 2px 10px rgba(0, 0, 0, .15);
  }
  .box {
    background: var(--karte);
    border: 1px solid var(--linie);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  button {
    font: inherit;
    border: 0;
    border-radius: 10px;
    padding: 12px 18px;
    cursor: pointer;
    background: var(--blau-hell);
    color: var(--blau);
    font-weight: 600;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.haupt { background: var(--haupt); color: #fff; width: 100%; font-size: 1.1rem; padding: 15px; }
  button.leise { background: transparent; color: var(--grau); padding: 8px 10px; font-weight: 500; }
  button.klein { padding: 7px 12px; font-size: .9rem; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }

  /* Modus-Kacheln */
  .modi { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .modus {
    background: var(--karte); border: 2px solid var(--linie); border-radius: var(--radius);
    padding: 14px 12px; text-align: left; color: var(--text); font-weight: 400;
  }
  .modus b { display: block; font-size: 1.05rem; margin: 4px 0 2px; }
  .modus .ico { font-size: 1.6rem; }
  .modus small { color: var(--grau); display: block; }
  .modus[aria-pressed="true"] { border-color: var(--haupt); background: var(--haupt-hell); }

  /* Auswahl */
  .kapitel { border-top: 1px solid var(--linie); padding: 10px 0 4px; }
  .kapitel:first-of-type { border-top: 0; padding-top: 0; }
  .abschnitte { margin: 6px 0 0 4px; }
  label.zeile { display: flex; align-items: center; gap: 10px; padding: 6px 4px; cursor: pointer; }
  label.zeile input { width: 20px; height: 20px; flex: none; accent-color: var(--haupt); }
  .kapitel > label .name { font-weight: 700; }
  .zeile .name { flex: 1; }
  .zeile .anzahl { color: var(--grau); font-size: .85rem; white-space: nowrap; min-width: 24px; text-align: right; }
  .balken { width: 70px; height: 8px; border-radius: 4px; background: var(--linie); overflow: hidden; flex: none; }
  .balken > span { display: block; height: 100%; background: var(--gruen); }

  .umschalter { display: flex; gap: 6px; flex-wrap: wrap; }
  .umschalter button { flex: 1; min-width: 110px; background: #eef1f4; color: var(--text); font-weight: 500; }
  .umschalter button[aria-pressed="true"] { background: var(--haupt); color: #fff; font-weight: 700; }
  .optionen { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .optionen select { font: inherit; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--linie); }

  .faecher { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; text-align: center; }
  .fach { background: #eef1f4; border-radius: 10px; padding: 8px 2px; }
  .fach b { display: block; font-size: 1.2rem; }
  .fach small { color: var(--grau); font-size: .75rem; }
  .fach.f5 { background: var(--gruen-hell); }
  .erklaerung { color: var(--grau); font-size: .85rem; margin: 10px 0 0; }
  .verlauf { list-style: none; padding: 0; margin: 0; font-size: .9rem; }
  .verlauf li { display: flex; gap: 10px; padding: 5px 0; border-top: 1px solid var(--linie); }
  .verlauf li:first-child { border-top: 0; }
  .verlauf .datum { color: var(--grau); width: 86px; flex: none; }
  .verlauf .themen { flex: 1; color: var(--grau); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .verlauf .pkt { font-weight: 700; white-space: nowrap; }

  .fusszeile { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }

  /* Abfrage */
  .kopf { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .fortschritt { flex: 1; height: 10px; background: var(--linie); border-radius: 5px; overflow: hidden; }
  .fortschritt > span { display: block; height: 100%; background: var(--haupt); transition: width .3s; }
  .zaehler { color: var(--grau); font-size: .9rem; white-space: nowrap; }
  .karte { padding: 20px 16px; }
  .richtung { color: var(--grau); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; text-align: center; }
  .frage { font-size: 1.3rem; font-weight: 700; margin: 10px 0 4px; text-align: center; word-break: break-word; }
  .frage.gross { font-size: 1.8rem; }
  .herkunft { color: var(--grau); font-size: .8rem; text-align: center; }
  .marke { text-align: center; }
  .fachmarke { display: inline-block; background: #eef1f4; border-radius: 8px; padding: 2px 8px; font-size: .75rem; color: var(--grau); margin-top: 8px; }

  .eingabe { display: flex; gap: 8px; margin-top: 18px; }
  .eingabe input {
    flex: 1; min-width: 0; font: inherit; font-size: 1.2rem;
    padding: 12px 14px; border: 2px solid var(--linie); border-radius: 10px;
  }
  .eingabe input:disabled { background: #f3f4f6; color: var(--text); }
  .nebenknoepfe { display: flex; justify-content: center; margin-top: 6px; }

  .auswahl { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .auswahl button {
    display: flex; gap: 12px; align-items: flex-start; text-align: left;
    background: #fff; border: 2px solid var(--linie); color: var(--text); font-weight: 500; padding: 12px 14px;
  }
  .auswahl button .bst {
    flex: none; width: 26px; height: 26px; border-radius: 50%; background: #eef1f4;
    display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: var(--grau);
  }
  .auswahl button:not(:disabled):hover { border-color: var(--haupt); }
  .auswahl button.gewaehlt { border-color: var(--haupt); background: var(--haupt-hell); }
  .auswahl button.ist-richtig { border-color: var(--gruen); background: var(--gruen-hell); opacity: 1; }
  .auswahl button.ist-falsch { border-color: var(--rot); background: var(--rot-hell); opacity: 1; }
  .auswahl button:disabled { cursor: default; opacity: .7; }

  .aufdecken { margin-top: 18px; }
  .aufdecken button { width: 100%; }

  .rueckmeldung { border-radius: var(--radius); padding: 14px 16px; margin-top: 14px; }
  .rueckmeldung.richtig { background: var(--gruen-hell); }
  .rueckmeldung.fast { background: var(--gelb-hell); }
  .rueckmeldung.falsch { background: var(--rot-hell); }
  .rueckmeldung.neutral { background: var(--haupt-hell); }
  .rueckmeldung .titel { font-weight: 700; font-size: 1.1rem; }
  .richtig .titel { color: var(--gruen); }
  .fast .titel { color: var(--gelb); }
  .falsch .titel { color: var(--rot); }
  .neutral .titel { color: var(--haupt); }
  .loesung { font-size: 1.15rem; font-weight: 700; margin: 6px 0; }
  .zusatz { font-size: .95rem; margin-top: 6px; }
  .zusatz .etikett { color: var(--grau); font-size: .8rem; display: block; }
  .tipp { font-size: .95rem; margin-top: 6px; }
  .knopfreihe { display: flex; gap: 8px; margin-top: 14px; }
  .knopfreihe button { flex: 1; }
  .knopfreihe button.weiter { background: var(--haupt); color: #fff; }
  .knopfreihe button.ja { background: var(--gruen); color: #fff; }
  .knopfreihe button.nein { background: var(--rot-hell); color: var(--rot); }

  /* Ende */
  .ergebnis { text-align: center; }
  .ergebnis .gross { font-size: 3rem; margin: 4px 0; }
  .ergebnis .zahl { font-size: 1.3rem; font-weight: 700; }
  .fehlerliste { list-style: none; padding: 0; margin: 0; }
  .fehlerliste li { padding: 10px 0; border-top: 1px solid var(--linie); }
  .fehlerliste li:first-child { border-top: 0; }
  .fehlerliste .f { font-weight: 700; }
  .fehlerliste .r { color: var(--gruen); }
  .fehlerliste .d { color: var(--rot); text-decoration: line-through; }
  .fehlerliste .e { color: var(--grau); font-size: .9rem; }
  .fehlerliste .ok::before { content: "✓ "; color: var(--gruen); }
  .fehlerliste .nok::before { content: "✗ "; color: var(--rot); }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>

  <!-- Startseite -->
  <section id="start">
    <header class="titelkopf">
      <div class="symbol" aria-hidden="true">🏛️</div>
      <div>
        <h1>Reismann 5d Politik Trainer</h1>
        <p class="unterzeile">Wähle aus, was du üben möchtest.</p>
      </div>
    </header>

    <div class="modi" id="modi">
      <button type="button" class="modus" data-wert="begriffe">
        <span class="ico">📖</span><b>Begriffe lernen</b><small id="infoBegriffe"></small>
      </button>
      <button type="button" class="modus" data-wert="fragen">
        <span class="ico">✅</span><b>Wissenstest</b><small id="infoFragen"></small>
      </button>
    </div>

    <div class="box">
      <h2>Themen</h2>
      <div id="kapitelliste"></div>
    </div>

    <!-- Einstellungen Begriffe -->
    <div class="box" id="optBegriffe">
      <h2>Abfrage</h2>
      <div class="umschalter" id="richtung">
        <button type="button" data-wert="e-b">Erklärung → Begriff</button>
        <button type="button" data-wert="b-e">Begriff → Erklärung</button>
        <button type="button" data-wert="beide">Gemischt</button>
      </div>
      <p class="erklaerung" id="richtungsHilfe"></p>
      <div class="optionen">
        <label class="zeile"><span class="name">Begriffe pro Runde</span>
          <select id="anzahlB"><option>10</option><option>15</option><option>20</option><option>30</option></select>
        </label>
      </div>
    </div>

    <!-- Einstellungen Fragen -->
    <div class="box" id="optFragen">
      <h2>Art</h2>
      <div class="umschalter" id="testart">
        <button type="button" data-wert="ueben">Üben</button>
        <button type="button" data-wert="probe">Probetest</button>
      </div>
      <p class="erklaerung" id="testartHilfe"></p>
      <div class="optionen">
        <label class="zeile"><span class="name">Fragen pro Runde</span>
          <select id="anzahlF"><option>10</option><option>15</option><option>20</option><option value="0">alle</option></select>
        </label>
      </div>
    </div>

    <div class="box" id="kastenBox">
      <h2>Dein Karteikasten</h2>
      <div class="faecher" id="faecher"></div>
      <p class="erklaerung">Richtig beantwortet rückt eine Karte ein Fach weiter und kommt seltener dran. Falsch beantwortet geht sie zurück in Fach 1.</p>
    </div>

    <div class="box" id="verlaufBox" hidden>
      <h2>Letzte Probetests</h2>
      <ul class="verlauf" id="verlauf"></ul>
    </div>

    <button type="button" class="haupt" id="los">Los geht's</button>

    <div class="fusszeile">
      <button type="button" class="leise klein" id="sichern">Fortschritt sichern</button>
      <button type="button" class="leise klein" id="laden">Fortschritt laden</button>
      <button type="button" class="leise klein" id="zuruecksetzen">Alles zurücksetzen</button>
      <input type="file" id="datei" accept=".json,application/json" hidden>
    </div>
  </section>

  <!-- Abfrage -->
  <section id="abfrage" hidden>
    <div class="kopf">
      <button type="button" class="leise klein" id="beenden">✕ Beenden</button>
      <div class="fortschritt"><span id="fortschrittsbalken"></span></div>
      <span class="zaehler" id="zaehler"></span>
    </div>

    <div class="box karte">
      <div class="richtung" id="richtungstext"></div>
      <div class="frage" id="frage"></div>
      <div class="herkunft" id="herkunft"></div>
      <div class="marke"><span class="fachmarke" id="fachmarke"></span></div>

      <!-- Begriff eintippen -->
      <div id="bereichTippen" hidden>
        <form class="eingabe" id="formular" autocomplete="off">
          <input id="antwort" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Begriff eintippen">
          <button type="submit" id="pruefen">Prüfen</button>
        </form>
        <div class="nebenknoepfe"><button type="button" class="leise klein" id="weissNicht">Weiß ich nicht</button></div>
      </div>

      <!-- Karteikarte aufdecken -->
      <div class="aufdecken" id="bereichAufdecken" hidden>
        <button type="button" id="aufdecken">Erklärung aufdecken</button>
      </div>

      <!-- Multiple Choice -->
      <div class="auswahl" id="bereichAuswahl" hidden></div>

      <div class="rueckmeldung" id="rueckmeldung" hidden>
        <div class="titel" id="rmTitel"></div>
        <div class="loesung" id="rmLoesung"></div>
        <div class="tipp" id="rmTipp" hidden></div>
        <div class="zusatz" id="rmErkl" hidden><span class="etikett" id="rmErklEtikett">Erklärung</span><span id="rmErklText"></span></div>
        <div class="knopfreihe" id="reiheWeiter">
          <button type="button" id="dochRichtig" hidden>Ich hatte doch recht</button>
          <button type="button" class="weiter" id="weiter">Weiter</button>
        </div>
        <div class="knopfreihe" id="reiheSelbst" hidden>
          <button type="button" class="nein" id="nichtGewusst">✗ Nicht gewusst</button>
          <button type="button" class="ja" id="gewusst">✓ Gewusst</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Ende einer Runde -->
  <section id="ende" hidden>
    <div class="box ergebnis">
      <div class="gross" id="endeBild"></div>
      <div class="zahl" id="endeZahl"></div>
      <p id="endeText"></p>
    </div>
    <div class="box" id="endeListeBox" hidden>
      <h2 id="endeListeTitel"></h2>
      <ul class="fehlerliste" id="endeListe"></ul>
    </div>
    <div class="knopfreihe">
      <button type="button" id="nurFehler" hidden>Fehler nochmal üben</button>
      <button type="button" class="weiter" id="zumStart">Zum Start</button>
    </div>
  </section>

</main>

 Wahlgrundsatz ist gemeint? „Die Wählerstimmen werden direkt für die Zuteilung der Abgeordnetensitze verwendet. Es gibt keine Zwischeninstanz.“","r":"unmittelbar","x":["allgemein","frei","geheim"],"e":"","q":"Arbeitsblatt Wahlgrundsätze"},{"id":"f|Wahlen|Welcher Wahlgrundsatz ist gemeint? „Die Stimme kann ohne staatlichen Zwang oder sonstige unzulässige Beeinflussung abgegeben werden.“","t":"Wahlen","a":"Die Wahlgrundsätze","f":"Welcher Wahlgrundsatz ist gemeint? „Die Stimme kann ohne staatlichen Zwang oder sonstige unzulässige Beeinflussung abgegeben werden.“","r":"frei","x":["gleich","geheim","unmittelbar"],"e":"Wichtig, weil dich keiner zwingen kann.","q":"Arbeitsblatt Wahlgrundsätze"},{"id":"f|Wahlen|Welcher Wahlgrundsatz ist gemeint? „Alle Wahlberechtigten haben gleich viele Stimmen. Alle Stimmen haben das gleiche Gewicht.“","t":"Wahlen","a":"Die Wahlgrundsätze","f":"Welcher Wahlgrundsatz ist gemeint? „Alle Wahlberechtigten haben gleich viele Stimmen. Alle Stimmen haben das gleiche Gewicht.“","r":"gleich","x":["allgemein","frei","unmittelbar"],"e":"Wichtig, damit keiner mehr oder weniger zu sagen hat.","q":"Arbeitsblatt Wahlgrundsätze"},{"id":"f|Wahlen|Welcher Wahlgrundsatz ist gemeint? „Es darf nicht feststellbar sein, wie der einzelne Bürger gewählt hat.“","t":"Wahlen","a":"Die Wahlgrundsätze","f":"Welcher Wahlgrundsatz ist gemeint? „Es darf nicht feststellbar sein, wie der einzelne Bürger gewählt hat.“","r":"geheim","x":["frei","gleich","allgemein"],"e":"Wichtig, weil dich dann keiner dafür ärgern kann, wen du gewählt hast.","q":"Arbeitsblatt Wahlgrundsätze"},{"id":"f|Wahlen|Welcher Wahlgrundsatz ist gemeint? „Alle Bürger sind wahlberechtigt. Keine Gruppe ist aus sozialen, politischen oder wirtschaftlichen Gründen von der Wahl ausgeschlossen.“","t":"Wahlen","a":"Die Wahlgrundsätze","f":"Welcher Wahlgrundsatz ist gemeint? „Alle Bürger sind wahlberechtigt. Keine Gruppe ist aus sozialen, politischen oder wirtschaftlichen Gründen von der Wahl ausgeschlossen.“"," const SPEICHER = "politiktrainer.v1";
const APP = "politiktrainer";
// Tage bis zur nächsten Abfrage je Fach (Index = Fach 1..5)
const FACH_TAGE = [0, 0, 1, 3, 7, 14];

// ---------- Speicher ----------

function leererStand() {
  return {
    karten: {},
    tests: [],
    einstellungen: { modus: "fragen", auswahl: [], richtung: "beide", anzahlB: 15, testart: "ueben", anzahlF: 10 },
  };
}

function ladeStand() {
  try {
    const roh = JSON.parse(localStorage.getItem(SPEICHER));
    if (roh && roh.karten && roh.einstellungen) {
      return { karten: roh.karten, tests: roh.tests || [], einstellungen: { ...leererStand().einstellungen, ...roh.einstellungen } };
    }
  } catch (e) { /* kaputter Stand -> neu anfangen */ }
  return leererStand();
}

let stand = ladeStand();

function speichere() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (e) { /* z. B. privater Modus */ }
}

function heute() {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

// ---------- Hilfen ----------

const $ = id => document.getElementById(id);

function mische(liste) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function abschnittKey(v) { return v.t + "|" + v.a; }

// Themen und Abschnitte in Reihenfolge der Dateien – aus Begriffen und Fragen zusammen
function themenListe() {
  const themen = [];
  for (const v of [...FRAGEN, ...BEGRIFFE]) {
    let t = themen.find(x => x.name === v.t);
    if (!t) themen.push(t = { name: v.t, abschnitte: [] });
    let a = t.abschnitte.find(x => x.name === v.a);
    if (!a) t.abschnitte.push(a = { name: v.a, key: abschnittKey(v), begriffe: [], fragen: [] });
    (v.f ? a.fragen : a.begriffe).push(v);
  }
  return themen;
}

const THEMEN = themenListe();

function istBegriffe() { return stand.einstellungen.modus === "begriffe"; }
function eintraegeVon(a) { return istBegriffe() ? a.begriffe : a.fragen; }

// ---------- Begriff prüfen ----------

function norm(s) {
  return s.normalize("NFC").toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[.,;:!?"„“”()]/g, " ")
    .replace(/-/g, " ")
    .replace(/^(der|die|das|ein|eine) /, "")
    .replace(/\s+/g, " ")
    .trim();
}

function falte(s) {
  return norm(s).replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/ /g, "");
}

function abstand(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 3;
  const z = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let vorher = z[0];
    z[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = z[j];
      z[j] = Math.min(z[j] + 1, z[j - 1] + 1, vorher + (a[i - 1] === b[j - 1] ? 0 : 1));
      vorher = tmp;
    }
  }
  return z[b.length];
}

// „Fachausschuss|Ausschuss“: erste Schreibweise wird gezeigt, alle zählen als richtig
function begriffAnzeige(b) { return b.b.split("|")[0]; }
function begriffVarianten(b) { return b.b.split("|").map(s => s.trim()).filter(Boolean); }

function pruefeBegriff(b, eingabe) {
  const loesung = begriffAnzeige(b);
  const a = norm(eingabe);
  if (!a) return { status: "falsch", loesung };
  const ziele = begriffVarianten(b);
  const passend = ziele.find(z => norm(z) === a);
  if (passend) {
    const tipp = passend !== loesung ? "Auch richtig! Im Heft steht: " + loesung : "";
    return { status: "richtig", loesung, tipp };
  }
  const f = falte(eingabe);
  if (ziele.some(z => falte(z) === f)) {
    return { status: "richtig", loesung, tipp: "Achte auf die Schreibweise: " + loesung };
  }
  const grenze = f.length >= 8 ? 2 : f.length >= 4 ? 1 : 0;
  if (grenze && ziele.some(z => abstand(f, falte(z)) <= grenze)) {
    return { status: "fast", loesung };
  }
  return { status: "falsch", loesung };
}

// ---------- Karteikasten ----------

function fachVon(key) {
  const k = stand.karten[key];
  return k ? k.fach : 0;
}

function ausgewaehlt(liste) {
  return liste.filter(v => stand.einstellungen.auswahl.includes(abschnittKey(v)));
}

function richtungen() {
  const r = stand.einstellungen.richtung;
  return r === "beide" ? ["e-b", "b-e"] : [r];
}

// Eine Karte = ein Eintrag in einer Abfrageart
function alleKarten() {
  if (istBegriffe()) {
    const karten = [];
    for (const v of ausgewaehlt(BEGRIFFE)) for (const r of richtungen()) karten.push({ v, art: r, key: v.id + "|" + r });
    return karten;
  }
  return ausgewaehlt(FRAGEN).map(v => ({ v, art: "mc", key: v.id }));
}

function istFaellig(karte) {
  const k = stand.karten[karte.key];
  return !k || k.faellig <= heute();
}

function baueRunde(karten, anzahl) {
  const sortiert = mische(karten).sort((a, b) => fachVon(a.key) - fachVon(b.key));
  const gesehen = new Set();
  const runde = [];
  for (const k of sortiert) {
    if (gesehen.has(k.v.id)) continue;   // bei „Gemischt“ jeder Begriff nur einmal pro Runde
    gesehen.add(k.v.id);
    runde.push(k);
    if (anzahl && runde.length >= anzahl) break;
  }
  return mische(runde);
}

// ---------- Startseite ----------

function zeichneStart() {
  const e = stand.einstellungen;
  const begriffe = istBegriffe();
  const probe = !begriffe && e.testart === "probe";

  for (const b of $("modi").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.wert === e.modus));
  $("infoBegriffe").textContent = BEGRIFFE.length + " Begriffe";
  $("infoFragen").textContent = FRAGEN.length + " Fragen";

  const liste = $("kapitelliste");
  liste.innerHTML = "";
  for (const t of THEMEN) {
    const abschnitte = t.abschnitte.filter(a => eintraegeVon(a).length);
    if (!abschnitte.length) continue;
    const block = document.createElement("div");
    block.className = "kapitel";
    const alle = abschnitte.every(a => e.auswahl.includes(a.key));
    const einige = abschnitte.some(a => e.auswahl.includes(a.key));
    const kopf = document.createElement("label");
    kopf.className = "zeile";
    kopf.innerHTML = `<input type="checkbox"><span class="name"></span><span class="anzahl"></span>`;
    const kb = kopf.querySelector("input");
    kb.checked = alle;
    kb.indeterminate = einige && !alle;
    kopf.querySelector(".name").textContent = t.name;
    kopf.querySelector(".anzahl").textContent = abschnitte.reduce((n, a) => n + eintraegeVon(a).length, 0) + (begriffe ? " Begriffe" : " Fragen");
    kb.addEventListener("change", () => {
      for (const a of t.abschnitte) setzeAuswahl(a.key, kb.checked);
      zeichneStart();
    });
    block.appendChild(kopf);

    const unter = document.createElement("div");
    unter.className = "abschnitte";
    for (const a of abschnitte) {
      const z = document.createElement("label");
      z.className = "zeile";
      z.innerHTML = `<input type="checkbox"><span class="name"></span><span class="balken" title="Anteil in Fach 3 bis 5"><span></span></span><span class="anzahl"></span>`;
      const cb = z.querySelector("input");
      cb.checked = e.auswahl.includes(a.key);
      cb.addEventListener("change", () => { setzeAuswahl(a.key, cb.checked); zeichneStart(); });
      z.querySelector(".name").textContent = a.name;
      z.querySelector(".anzahl").textContent = eintraegeVon(a).length;
      z.querySelector(".balken > span").style.width = Math.round(gelerntAnteil(eintraegeVon(a)) * 100) + "%";
      unter.appendChild(z);
    }
    block.appendChild(unter);
    liste.appendChild(block);
  }

  $("optBegriffe").hidden = !begriffe;
  $("optFragen").hidden = begriffe;
  for (const b of $("richtung").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.wert === e.richtung));
  for (const b of $("testart").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.wert === e.testart));
  $("richtungsHilfe").textContent = {
    "e-b": "Die Erklärung steht da – du tippst den Begriff ein.",
    "b-e": "Der Begriff steht da – du überlegst die Erklärung, deckst auf und sagst selbst, ob du es wusstest.",
    "beide": "Mal so, mal so.",
  }[e.richtung];
  $("testartHilfe").textContent = probe
    ? "Wie eine Klassenarbeit: Du siehst erst am Ende, was richtig war. Der Karteikasten bleibt unverändert."
    : "Nach jeder Frage siehst du sofort, ob es stimmt. Falsche Fragen kommen in der Runde nochmal.";
  $("anzahlB").value = String(e.anzahlB);
  $("anzahlF").value = String(e.anzahlF);

  const karten = alleKarten();
  $("kastenBox").hidden = probe;
  const zaehler = [0, 0, 0, 0, 0, 0];
  for (const k of karten) zaehler[fachVon(k.key)]++;
  $("faecher").innerHTML = zaehler.map((n, i) =>
    `<div class="fach f${i}"><b>${n}</b><small>${i === 0 ? "neu" : "Fach " + i}</small></div>`).join("");

  zeichneVerlauf(!begriffe);

  const faellig = karten.filter(istFaellig).length;
  const wort = begriffe ? "Begriffe" : "Fragen";
  const anzahl = begriffe ? e.anzahlB : e.anzahlF;
  const los = $("los");
  if (!karten.length) {
    los.textContent = "Wähle mindestens einen Abschnitt";
    los.disabled = true;
  } else if (probe) {
    los.textContent = `Probetest starten (${anzahl ? Math.min(anzahl, karten.length) : karten.length} Fragen)`;
    los.disabled = false;
  } else if (faellig) {
    los.textContent = `Los geht's (${anzahl ? Math.min(faellig, anzahl) : faellig} ${wort})`;
    los.disabled = false;
  } else {
    los.textContent = "Heute ist nichts fällig – trotzdem üben";
    los.disabled = false;
  }
}

function zeichneVerlauf(zeigen) {
  const tests = stand.tests.slice(-5).reverse();
  $("verlaufBox").hidden = !zeigen || !tests.length;
  $("verlauf").innerHTML = "";
  for (const t of tests) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="datum"></span><span class="themen"></span><span class="pkt"></span>`;
    li.querySelector(".datum").textContent = t.datum;
    li.querySelector(".themen").textContent = t.themen;
    li.querySelector(".pkt").textContent = `${t.richtig}/${t.gesamt} (${Math.round(t.richtig / t.gesamt * 100)} %)`;
    $("verlauf").appendChild(li);
  }
}

function gelerntAnteil(eintraege) {
  let gelernt = 0, gesamt = 0;
  for (const v of eintraege) {
    const keys = v.f ? [v.id] : richtungen().map(r => v.id + "|" + r);
    for (const k of keys) { gesamt++; if (fachVon(k) >= 3) gelernt++; }
  }
  return gesamt ? gelernt / gesamt : 0;
}

function setzeAuswahl(key, an) {
  const a = stand.einstellungen.auswahl.filter(x => x !== key);
  if (an) a.push(key);
  stand.einstellungen.auswahl = a;
  speichere();
}

function umschalter(id, feld) {
  $(id).addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    stand.einstellungen[feld] = b.dataset.wert;
    speichere();
    zeichneStart();
  });
}
umschalter("modi", "modus");
umschalter("richtung", "richtung");
umschalter("testart", "testart");
$("anzahlB").addEventListener("change", ev => { stand.einstellungen.anzahlB = Number(ev.target.value); speichere(); zeichneStart(); });
$("anzahlF").addEventListener("change", ev => { stand.einstellungen.anzahlF = Number(ev.target.value); speichere(); zeichneStart(); });

$("los").addEventListener("click", () => {
  const e = stand.einstellungen;
  const karten = alleKarten();
  if (!istBegriffe() && e.testart === "probe") return starteRunde(baueRunde(mische(karten), e.anzahlF), true);
  const faellig = karten.filter(istFaellig);
  starteRunde(baueRunde(faellig.length ? faellig : karten, istBegriffe() ? e.anzahlB : e.anzahlF), false);
});

// ---------- Abfrage ----------

let runde = null;

function zeige(bereich) {
  for (const id of ["start", "abfrage", "ende"]) $(id).hidden = id !== bereich;
  window.scrollTo(0, 0);
}

function starteRunde(karten, probe) {
  if (!karten.length) return;
  runde = {
    probe,
    schlange: karten.slice(),
    gesamt: karten.length,
    fertig: 0,
    ersterVersuch: new Map(),   // key -> true/false
    antworten: [],              // nur Probetest: { karte, gewaehlt }
    aktuell: null,
    ergebnis: null,
    optionen: [],
  };
  zeige("abfrage");
  naechsteKarte();
}

function naechsteKarte() {
  if (!runde.schlange.length) return zeigeEnde();
  const karte = runde.schlange.shift();
  runde.aktuell = karte;
  runde.ergebnis = null;
  const v = karte.v;

  $("bereichTippen").hidden = karte.art !== "e-b";
  $("bereichAufdecken").hidden = karte.art !== "b-e";
  $("bereichAuswahl").hidden = karte.art !== "mc";
  $("rueckmeldung").hidden = true;

  const frage = $("frage");
  frage.classList.toggle("gross", karte.art === "b-e");
  if (karte.art === "e-b") {
    $("richtungstext").textContent = "Wie heißt der Begriff?";
    frage.textContent = v.e;
  } else if (karte.art === "b-e") {
    $("richtungstext").textContent = "Was bedeutet …";
    frage.textContent = begriffAnzeige(v);
  } else {
    $("richtungstext").textContent = runde.probe ? "Probetest" : "Wissensfrage";
    frage.textContent = v.f;
  }
  $("herkunft").textContent = [v.t, v.a].join(" · ");
  const fach = fachVon(karte.key);
  $("fachmarke").hidden = runde.probe;
  $("fachmarke").textContent = runde.ersterVersuch.has(karte.key) ? "Wiederholung" : fach ? "Fach " + fach : "neu";

  if (karte.art === "e-b") {
    const feld = $("antwort");
    feld.value = "";
    feld.disabled = false;
    $("pruefen").disabled = false;
    $("weissNicht").hidden = false;
    feld.focus();
  } else if (karte.art === "b-e") {
    $("aufdecken").focus();
  } else {
    zeichneAuswahl(v);
  }
  zeichneFortschritt();
}

const BUCHSTABEN = ["A", "B", "C", "D"];

function zeichneAuswahl(v) {
  runde.optionen = mische([v.r, ...v.x]);
  const box = $("bereichAuswahl");
  box.innerHTML = "";
  runde.optionen.forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="bst">${BUCHSTABEN[i]}</span><span></span>`;
    b.lastChild.textContent = text;
    b.addEventListener("click", () => waehle(i));
    box.appendChild(b);
  });
}

function waehle(i) {
  if (runde.ergebnis || runde.aktuell.art !== "mc") return;
  const karte = runde.aktuell;
  const text = runde.optionen[i];
  const richtig = text === karte.v.r;
  const knoepfe = [...$("bereichAuswahl").children];
  knoepfe.forEach(b => { b.disabled = true; });

  if (runde.probe) {
    // keine Rückmeldung – kurz markieren, dann weiter
    knoepfe[i].classList.add("gewaehlt");
    runde.ergebnis = { status: richtig ? "richtig" : "falsch" };
    runde.antworten.push({ karte, gewaehlt: text });
    runde.ersterVersuch.set(karte.key, richtig);
    runde.fertig++;
    setTimeout(naechsteKarte, 350);
    return;
  }

  knoepfe.forEach((b, j) => {
    if (runde.optionen[j] === karte.v.r) b.classList.add("ist-richtig");
    else if (j === i) b.classList.add("ist-falsch");
  });
  runde.ergebnis = { status: richtig ? "richtig" : "falsch", loesung: karte.v.r };
  zeigeRueckmeldung();
}

function zeichneFortschritt() {
  $("fortschrittsbalken").style.width = Math.round(runde.fertig / runde.gesamt * 100) + "%";
  $("zaehler").textContent = `${runde.fertig} / ${runde.gesamt}`;
}

function werteAusTippen(eingabe) {
  if (runde.ergebnis) return;
  runde.ergebnis = pruefeBegriff(runde.aktuell.v, eingabe);
  $("antwort").disabled = true;
  $("pruefen").disabled = true;
  $("weissNicht").hidden = true;
  zeigeRueckmeldung();
}

const LOB = ["Richtig!", "Super!", "Klasse!", "Genau!", "Stark!", "Perfekt!"];

function zeigeRueckmeldung() {
  const karte = runde.aktuell;
  const v = karte.v;
  const e = runde.ergebnis;
  const rm = $("rueckmeldung");
  const selbst = karte.art === "b-e";

  rm.className = "rueckmeldung " + (selbst ? "neutral" : e.status);
  if (selbst) {
    $("rmTitel").textContent = "Bedeutung:";
    $("rmLoesung").textContent = v.e;
  } else if (karte.art === "mc") {
    $("rmTitel").textContent = e.status === "richtig" ? LOB[Math.floor(Math.random() * LOB.length)] : "Leider nicht. Richtig ist:";
    $("rmLoesung").textContent = e.status === "richtig" ? "" : v.r;
  } else {
    $("rmTitel").textContent = e.status === "richtig" ? LOB[Math.floor(Math.random() * LOB.length)]
      : e.status === "fast" ? "Fast! Schau dir die Schreibweise an:" : "Leider nicht. Gesucht war:";
    $("rmLoesung").textContent = e.loesung;
  }
  $("rmLoesung").hidden = !$("rmLoesung").textContent;
  $("rmTipp").hidden = !e || !e.tipp;
  $("rmTipp").textContent = (e && e.tipp) || "";

  const zusatz = karte.art === "mc" ? v.e : v.bsp;
  $("rmErkl").hidden = !zusatz;
  $("rmErklEtikett").textContent = karte.art === "mc" ? "Erklärung" : "Beispiel";
  $("rmErklText").textContent = zusatz || "";

  $("reiheWeiter").hidden = selbst;
  $("reiheSelbst").hidden = !selbst;
  $("dochRichtig").hidden = karte.art !== "e-b" || e.status === "richtig" || !norm($("antwort").value);
  rm.hidden = false;
  (selbst ? $("gewusst") : $("weiter")).focus();
}

function buche(richtig) {
  const karte = runde.aktuell;
  if (!runde.ersterVersuch.has(karte.key)) {
    runde.ersterVersuch.set(karte.key, richtig);
    const alt = stand.karten[karte.key] || { fach: 0, richtig: 0, falsch: 0 };
    // neue Karten, die auf Anhieb sitzen, rücken gleich in Fach 2
    const fach = richtig ? Math.min(5, Math.max(alt.fach, 1) + 1) : 1;
    stand.karten[karte.key] = {
      fach,
      faellig: heute() + FACH_TAGE[fach],
      richtig: alt.richtig + (richtig ? 1 : 0),
      falsch: alt.falsch + (richtig ? 0 : 1),
    };
    speichere();
  }
  if (richtig) {
    runde.fertig++;
  } else {
    // falsch beantwortete Karten kommen in dieser Runde noch einmal
    runde.schlange.splice(Math.min(3, runde.schlange.length), 0, karte);
  }
}

$("formular").addEventListener("submit", ev => { ev.preventDefault(); werteAusTippen($("antwort").value); });
$("weissNicht").addEventListener("click", () => werteAusTippen(""));
$("aufdecken").addEventListener("click", () => { runde.ergebnis = { status: "neutral" }; zeigeRueckmeldung(); });
$("weiter").addEventListener("click", () => { buche(runde.ergebnis.status === "richtig"); naechsteKarte(); });
$("gewusst").addEventListener("click", () => { buche(true); naechsteKarte(); });
$("nichtGewusst").addEventListener("click", () => { buche(false); naechsteKarte(); });
$("dochRichtig").addEventListener("click", () => {
  runde.ergebnis = { ...runde.ergebnis, status: "richtig", tipp: "" };
  zeigeRueckmeldung();
});
$("beenden").addEventListener("click", () => {
  const frage = runde.probe
    ? "Probetest abbrechen? Das Ergebnis wird nicht gespeichert."
    : "Runde beenden? Was du schon beantwortet hast, bleibt gespeichert.";
  if (runde.fertig === 0 || confirm(frage)) {
    if (runde.probe) { zeichneStart(); zeige("start"); } else zeigeEnde();
  }
});

// Tastatur: 1–4 bzw. A–D für Multiple Choice, Enter für „Weiter“
document.addEventListener("keydown", ev => {
  if ($("abfrage").hidden || !runde || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (runde.aktuell && runde.aktuell.art === "mc" && !runde.ergebnis) {
    const i = "1234".indexOf(ev.key) >= 0 ? "1234".indexOf(ev.key) : "abcd".indexOf(ev.key.toLowerCase());
    if (i >= 0 && i < runde.optionen.length) { ev.preventDefault(); waehle(i); }
  }
});

// ---------- Ende ----------

function zeigeEnde() {
  const versuche = [...runde.ersterVersuch.values()];
  const richtig = versuche.filter(Boolean).length;
  const gesamt = versuche.length;
  const quote = gesamt ? richtig / gesamt : 0;
  $("endeBild").textContent = !gesamt ? "👋" : quote === 1 ? "🏆" : quote >= 0.8 ? "🎉" : quote >= 0.5 ? "👍" : "💪";
  $("endeZahl").textContent = !gesamt ? "Nichts beantwortet"
    : runde.probe ? `${richtig} von ${gesamt} Punkten (${Math.round(quote * 100)} %)`
    : `${richtig} von ${gesamt} beim ersten Versuch richtig`;
  $("endeText").textContent = !gesamt ? "" : quote === 1 ? "Alles gewusst – großartig!"
    : quote >= 0.8 ? "Sehr gut gemacht!" : quote >= 0.5 ? "Gut! Den Rest schaffst du auch noch."
    : "Dranbleiben – mit jeder Runde bleibt mehr hängen.";

  const ul = $("endeListe");
  ul.innerHTML = "";
  runde.falsche = [];
  if (runde.probe) {
    // Probetest: alle Fragen mit Auflösung
    if (gesamt) {
      stand.tests.push({ datum: new Date().toLocaleDateString("de-DE"), themen: themenText(runde.antworten), richtig, gesamt });
      stand.tests = stand.tests.slice(-20);
      speichere();
    }
    for (const { karte, gewaehlt } of runde.antworten) {
      const ok = gewaehlt === karte.v.r;
      if (!ok) runde.falsche.push(karte);
      ul.appendChild(eintrag(karte.v.f, ok, karte.v.r, ok ? "" : gewaehlt, karte.v.e));
    }
    $("endeListeTitel").textContent = "Auflösung";
  } else {
    for (const [key, ok] of runde.ersterVersuch) {
      if (ok) continue;
      const karte = kartenNachKey(key);
      if (!karte) continue;
      runde.falsche.push(karte);
      const v = karte.v;
      if (karte.art === "mc") ul.appendChild(eintrag(v.f, null, v.r, "", ""));
      else ul.appendChild(eintrag(begriffAnzeige(v), null, v.e, "", ""));
    }
    $("endeListeTitel").textContent = "Das üben wir nochmal";
  }
  $("endeListeBox").hidden = !ul.children.length;
  $("nurFehler").hidden = !runde.falsche.length;
  zeige("ende");
  $("zumStart").focus();
}

function eintrag(frage, ok, richtig, falsch, erkl) {
  const li = document.createElement("li");
  const f = document.createElement("div");
  f.className = "f" + (ok === true ? " ok" : ok === false ? " nok" : "");
  f.textContent = frage;
  li.appendChild(f);
  if (falsch) { const d = document.createElement("div"); d.className = "d"; d.textContent = falsch; li.appendChild(d); }
  const r = document.createElement("div"); r.className = "r"; r.textContent = richtig; li.appendChild(r);
  if (erkl) { const e = document.createElement("div"); e.className = "e"; e.textContent = erkl; li.appendChild(e); }
  return li;
}

function themenText(antworten) {
  return [...new Set(antworten.map(a => a.karte.v.t))].join(", ");
}

function kartenNachKey(key) {
  const f = FRAGEN.find(x => x.id === key);
  if (f) return { v: f, art: "mc", key };
  const trenner = key.lastIndexOf("|");
  const v = BEGRIFFE.find(x => x.id === key.slice(0, trenner));
  return v ? { v, art: key.slice(trenner + 1), key } : null;
}

// „Fehler nochmal üben“ ist immer eine Übungsrunde, auch nach einem Probetest
$("nurFehler").addEventListener("click", () => starteRunde(mische(runde.falsche), false));
$("zumStart").addEventListener("click", () => { zeichneStart(); zeige("start"); });

// ---------- Fortschritt sichern / laden ----------

$("sichern").addEventListener("click", () => {
  const d = new Date();
  const datum = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const inhalt = JSON.stringify({ app: APP, version: 1, gesichert: datum, stand }, null, 1);
  const url = URL.createObjectURL(new Blob([inhalt], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `politik-fortschritt-${datum}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

$("laden").addEventListener("click", () => $("datei").click());
$("datei").addEventListener("change", async ev => {
  const datei = ev.target.files[0];
  ev.target.value = "";
  if (!datei) return;
  try {
    const d = JSON.parse(await datei.text());
    if (d.app !== APP || !d.stand || !d.stand.karten) throw new Error();
    if (!confirm(`Fortschritt vom ${d.gesichert || "?"} laden? Der jetzige Stand wird ersetzt.`)) return;
    stand = { karten: d.stand.karten, tests: d.stand.tests || [], einstellungen: { ...leererStand().einstellungen, ...d.stand.einstellungen } };
    speichere();
    zeichneStart();
  } catch (e) {
    alert("Diese Datei ist keine Fortschritts-Sicherung vom Politik-Trainer.");
  }
});

$("zuruecksetzen").addEventListener("click", () => {
  if (!confirm("Wirklich den ganzen Fortschritt löschen? Karteikasten und Probetest-Ergebnisse fangen wieder bei null an.")) return;
  stand = { ...leererStand(), einstellungen: stand.einstellungen };
  speichere();
  zeichneStart();
});

// ---------- Start ----------

if (!stand.einstellungen.auswahl.length) {
  stand.einstellungen.auswahl = THEMEN.flatMap(t => t.abschnitte.map(a => a.key));
}
zeichneStart();
</script>
