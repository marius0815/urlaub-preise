"nur Aufgabe der Schülersprecher","Aufgabe der Lehrkräfte"],"e":"Die SV ist nicht nur Sache der Gewählten – alle können mitmachen."},{"id":"f|Was gehört zu den Zielen der Mitwirkung in der SV?","ab":11,"s":50,"f":"Was gehört zu den Zielen der Mitwirkung in der SV?","r":"Urteilsfähigkeit fördern und zu eigenverantwortlichem Handeln befähigen","x":["möglichst viele Unterrichtsstunden ausfallen lassen","die Schulleitung bei allen Entscheidungen ersetzen","dafür sorgen, dass alle Schüler bessere Noten bekommen"],"e":""},{"id":"f|Mit wem soll die SV partnerschaftlich zusammenarbeiten?","ab":11,"s":50,"f":"Mit wem soll die SV partnerschaftlich zusammenarbeiten?","r":"mit den Lehrkräften und der Schulleitung","x":["mit dem Bürgermeister und dem Stadtrat","mit den Schülerzeitungen anderer Schulen","mit dem Landesparlament"],"e":"Die SV-Vertreter sind in ihren Entscheidungen frei, aber der Schülerschaft verantwortlich."},{"id":"f|Wo sind die Rechte der SV verankert?","ab":11,"s":50,"f":"Wo sind die Rechte der SV verankert?","r":"im Schulgesetz und in einem Erlass des Schulministeriums","x":["nur in der Hausordnung der jeweiligen Schule","in den Klassenregeln jeder einzelnen Klasse","in einem Vertrag zwischen Eltern und Schule"],"e":"Schulgesetz und SV-Erlass sind leicht im Internet zu finden."},{"id":"f|Wer beruft die SV-Verfügungsstunden einer Klasse ein?","ab":11,"s":50,"f":"Wer beruft die SV-Verfügungsstunden einer Klasse ein?","r":"die Klassensprecherinnen und Klassensprecher","x":["die Schulleiterin oder der Schulleiter","die Elternvertreter der Klasse","die Schulkonferenz"],"e":"Klassensprecher kümmern sich um die Wünsche, Anregungen und Sorgen ihrer Klasse."},{"id":"f|Wer beruft den Schülerrat ein und leitet seine Sitzungen?","ab":11,"s":50,"f":"Wer beruft den Schülerrat ein und leitet seine Sitzungen?","r":"die Schülersprecherin oder der Schülersprecher","x":["die Klassenlehrerin oder der Klassenlehrer","die Schulleiterin oder der Schulleiter","die Elternvertreterin oder der Elternvertreter"],"e":"Schülersprecher vertreten die Interessen aller Schüler ihrer Schule."},{"id":"f|Wer gehört zum Schülerrat?","ab":11,"s":50,"f":"Wer gehört zum Schülerrat?","r":"die Klassensprecherinnen und Klassensprecher","x":["alle Lehrerinnen und Lehrer der Schule","die Eltern aller Schülerinnen und Schüler","nur die Schülerinnen und Schüler der Oberstufe"],"e":"Der Schülerrat ist für alle Fragen der SV zuständig."},{"id":"f|Welches ist das oberste Mitwirkungsgremium in der Schule?","ab":11,"s":50,"f":"Welches ist das oberste Mitwirkungsgremium in der Schule?","r":"die Schulkonferenz","x":["der Schülerrat","die Klassenversammlung","die Elternversammlung"],"e":"Sie berät und entscheidet über alle wichtigen Angelegenheiten, z. B. die Schulordnung."},{"id":"f|Wie viele Vertreter haben die Schüler in der Schulkonferenz?","ab":11,"s":50,"f":"Wie viele Vertreter haben die Schüler in der Schulkonferenz?","r":"genauso viele wie die Eltern und die Lehrerschaft","x":["nur halb so viele wie die Lehrerschaft","doppelt so viele wie die Eltern","nur einen einzigen Vertreter"],"e":""},{"id":"f|Wie sieht das Schulministerium die Mitarbeit möglichst vieler Schüler in der SV?","ab":11,"s":51,"f":"Wie sieht das Schulministerium die Mitarbeit möglichst vieler Schüler in der SV?","r":"als unverzichtbaren Teil der Erziehung zur Demokratie","x":["als unnötige Zeitverschwendung im Schulalltag","als Aufgabe nur für die besten Schüler einer Klasse","als Ablenkung vom eigentlichen Unterricht"],"e":""},{"id":"f|Welche zwei Möglichkeiten für die Wahl der Schülersprecher sieht der SV-Erlass NRW vor?","ab":12,"s":52,"f":"Welche zwei Möglichkeiten für die Wahl der Schülersprecher sieht der SV-Erlass NRW vor?","r":"Wahl durch den Schülerrat oder Wahl durch alle Schüler","x":["Wahl durch die Lehrkräfte oder Wahl durch die Eltern","Wahl durch die Schulleitung oder Wahl durch den Stadtrat","Wahl durch die Schulkonferenz oder durch ein Los"],"e":"Möglichkeit A: Schülerrat – Möglichkeit B: alle Schülerinnen und Schüler."},{"id":"f|Wie viele Schüler müssen es beantragen, damit alle Schüler die Schülersprecher wählen können?","ab":12,"s":52,"f":"Wie viele Schüler müssen es beantragen, damit alle Schüler die Schülersprecher wählen können?","r":"20 Prozent aller Schülerinnen und Schüler","x":["10 Prozent aller Schülerinnen und Schüler","50 Prozent aller Schülerinnen und Schüler","alle Schülerinnen und Schüler der Schule"],"e":"So steht es im SV-Erlass NRW, 3.5.2."},{"id":"f|Mit welchem Argument ist Canan für die Wahl durch den Schülerrat?","ab":12,"s":52,"f":"Mit welchem Argument ist Canan für die Wahl durch den Schülerrat?","r":"Die Klassensprecher kennen die Bewerber und können sie besser beurteilen.","x":["Dann kann jede Schülerin und jeder Schüler mitentscheiden.","Dann muss gar keine Wahl mehr stattfinden.","Dann entscheidet die Schulleitung über die Bewerber."],"e":"Canan meint: Wenn alle wählen, gewinnen nur die, die die beste Show abziehen."},{"id":"f|Mit welchem Argument ist Thomas für die Wahl durch alle Schüler?","ab":12,"s":52,"f":"Mit welchem Argument ist Thomas für die Wahl durch alle Schüler?","r":"Jeder kann mitentscheiden – das ist am demokratischsten.","x":["Der Schülerrat kennt die Bewerber am besten.","So gewinnt immer der beliebteste Schüler.","So geht die Wahl am schnellsten vorbei."],"e":""},{"id":"f|Was ist eine Diskussion?","ab":12,"s":53,"f":"Was ist eine Diskussion?","r":"ein Gespräch, in dem unterschiedliche Meinungen zu einem Thema ausgetauscht werden","x":["ein Vortrag, bei dem eine Person allein über ein Thema spricht","ein Streit, bei dem am Ende immer der Lauteste gewinnt","eine Abstimmung, bei der man seine Meinung nicht begründet"],"e":"Man lernt dabei, seine Meinung zu formulieren und zu vertreten."},{"id":"f|Was braucht man für eine Diskussion im Unterricht?","ab":12,"s":53,"f":"Was braucht man für eine Diskussion im Unterricht?","r":"ein klares Thema und eine Diskussionsleitung","x":["eine Tafel und einen Stimmzettel","einen Schiedsrichter und eine Uhr","eine Lehrkraft und ein Protokoll"],"e":"Die Leitung achtet darauf, dass die Regeln eingehalten werden."},{"id":"f|Was ist laut Buch ein Erkennungsmerkmal von Demokratie?","ab":12,"s":53,"f":"Was ist laut Buch ein Erkennungsmerkmal von Demokratie?","r":"dass Menschen miteinander diskutieren","x":["dass immer alle derselben Meinung sind","dass einer allein für alle entscheidet","dass über Streitthemen nicht gesprochen wird"],"e":""},{"id":"f|Was ist die Voraussetzung für faire Diskussionen?","ab":12,"s":53,"f":"Was ist die Voraussetzung für faire Diskussionen?","r":"Respekt","x":["Lautstärke","Schnelligkeit","Strenge"],"e":"Wer Wert auf die eigene Meinung legt, muss das auch anderen zugestehen."},{"id":"f|Was sollte in einer Demokratie völlig ausgeschlossen sein?","ab":12,"s":53,"f":"Was sollte in einer Demokratie völlig ausgeschlossen sein?","r":"dass jemand wegen seiner Ansichten ausgegrenzt oder bestraft wird","x":["dass Menschen über umstrittene Themen miteinander diskutieren","dass jemand seine Meinung nach einer Diskussion ändert","dass die Mehrheit bei einer Abstimmung entscheidet"],"e":"Das passt nicht zum friedlichen Miteinander in einer Demokratie."},{"id":"f|Welche Regel gehört NICHT zu den „7 unverzichtbaren Diskussionsregeln“?","ab":12,"s":53,"f":"Welche Regel gehört NICHT zu den „7 unverzichtbaren Diskussionsregeln“?","r":"Setze deine Meinung immer durch.","x":["Lass andere ausreden.","Begründe deine Meinung.","Höre gut zu."],"e":"Regel 7 lautet sogar: Sei nicht übertrieben rechthaberisch."},{"id":"f|Tim ruft in der Diskussion ständig dazwischen. Gegen welche Diskussionsregel verstößt er?","ab":12,"s":53,"f":"Tim ruft in der Diskussion ständig dazwischen. Gegen welche Diskussionsregel verstößt er?","r":"Melde dich! Rufe nicht dazwischen.","x":["Streite nur mit fairen Mitteln.","Beteilige dich aktiv.","Begründe deine Meinung."],"e":""},{"id":"f|Was steht unter den 7 Diskussionsregeln?","ab":12,"s":53,"f":"Was steht unter den 7 Diskussionsregeln?","r":"Eine Meinung zu überdenken oder zu ändern muss keine Schwäche sein.","x":["Wer seine Meinung ändert, hat die Diskussion verloren.","Wer am längsten redet, hat am Ende immer recht.","Eine Meinung darf man nach der Diskussion nicht ändern."],"e":""},{"id":"f|Wer sollte bei den ersten Diskussionsübungen die Leitung übernehmen?","ab":12,"s":53,"f":"Wer sollte bei den ersten Diskussionsübungen die Leitung übernehmen?","r":"die Lehrerin oder der Lehrer","x":["die Klassensprecherin oder der Klassensprecher","die Schülerin oder der Schüler mit der besten Note","die Schulleiterin oder der Schulleiter"],"e":"Die Leitung einer Diskussion ist eine schwierige Aufgabe."},{"id":"f|Wie oft steht Schülerinnen und Schülern ab Klasse 5 in NRW eine SV-Stunde zu?","ab":13,"s":54,"f":"Wie oft steht Schülerinnen und Schülern ab Klasse 5 in NRW eine SV-Stunde zu?","r":"einmal im Monat","x":["einmal in der Woche","einmal im Halbjahr","einmal im Schuljahr"],"e":"Das sieht der SV-Erlass vor. Die Stunde findet während der Unterrichtszeit statt."},{"id":"f|Was soll in der SV-Stunde besprochen werden?","ab":13,"s":54,"f":"Was soll in der SV-Stunde besprochen werden?","r":"alles, was für die Klassengemeinschaft wichtig ist","x":["nur der Stoff für die nächste Klassenarbeit","nur Beschwerden über einzelne Lehrkräfte","nur die Planung von Klassenfahrten"],"e":""},{"id":"f|Welche Aufgabe hat der Regel-Coach in der SV-Stunde der 6c?","ab":13,"s":54,"f":"Welche Aufgabe hat der Regel-Coach in der SV-Stunde der 6c?","r":"Er achtet darauf, dass alle drankommen und die Regeln eingehalten werden.","x":["Er schreibt das Protokoll und verteilt es an die Eltern.","Er leert vor der Sitzung den Kummer-Briefkasten.","Er entscheidet allein, welche Themen besprochen werden."],"e":"In der 6c ist der stellvertretende Klassensprecher Nazar der Regel-Coach."},{"id":"f|Was können die Schüler der 6c in den Kummer-Briefkasten werfen?","ab":13,"s":54,"f":"Was können die Schüler der 6c in den Kummer-Briefkasten werfen?","r":"Zettel mit Themen und Wünschen – mit oder ohne Namen","x":["nur Zettel, auf denen der eigene Name stehen muss","nur Entschuldigungen für versäumte Hausaufgaben","nur Wahlzettel für die nächste Klassensprecherwahl"],"e":"Die Zettel werden in der nächsten Sitzung besprochen."},{"id":"f|Warum verlässt Herr Mader die Klasse, als es um den Ärger mit Tom und Joshua geht?","ab":13,"s":54,"f":"Warum verlässt Herr Mader die Klasse, als es um den Ärger mit Tom und Joshua geht?","r":"Damit die Klassengemeinschaft möglichst selbstständig eine Lösung findet.","x":["Weil er mit Herrn Schröter über die Hausaufgaben reden muss.","Weil Lehrkräfte bei SV-Stunden nie dabei sein dürfen.","Weil er Tom und Joshua bei der Schulleitung melden will."],"e":""},{"id":"f|Wie wurde das Problem mit Tom und Joshua in der 6c gelöst?","ab":13,"s":54,"f":"Wie wurde das Problem mit Tom und Joshua in der 6c gelöst?","r":"Die beiden schlugen selbst vor, nicht mehr nebeneinander zu sitzen.","x":["Die beiden mussten zur Strafe in eine andere Klasse wechseln.","Die Klassenlehrerin hat ihre Eltern in die Schule bestellt.","Die Klasse hat beschlossen, nicht mehr mit ihnen zu reden."],"e":"Die Mitschüler hatten ihnen gesagt, dass sie sich durch die Störungen genervt fühlen."},{"id":"f|Welche Regel gehört NICHT zu den Gesprächsregeln in den SV-Sitzungen?","ab":13,"s":55,"f":"Welche Regel gehört NICHT zu den Gesprächsregeln in den SV-Sitzungen?","r":"Ich sage, was die anderen denken.","x":["Ich beleidige niemanden.","Ich halte mich an das, was beschlossen wurde.","Ich höre aufmerksam zu, wenn andere reden."],"e":"Regel 3 lautet: Ich rede von mir und sage, was ich denke."},{"id":"f|Was sollten die Regelcoaches zu Beginn jeder Sitzung tun?","ab":13,"s":55,"f":"Was sollten die Regelcoaches zu Beginn jeder Sitzung tun?","r":"die fünf Gesprächsregeln laut vorlesen","x":["den Kummer-Briefkasten an die Lehrkraft geben","alle Anwesenden in einer Liste eintragen","die Klassensprecher neu wählen lassen"],"e":""},{"id":"f|Warum darf die 6b nicht zum Wild-West-Park fahren?","ab":14,"s":56,"f":"Warum darf die 6b nicht zum Wild-West-Park fahren?","r":"Wandertage müssen einen deutlichen Bezug zum Unterricht haben.","x":["Der Eintritt in den Park ist für die Klasse zu teuer.","Der Park liegt zu weit weg von der Schule.","Die Mehrheit der Klasse wollte nicht dorthin."],"e":"Diese Regel gilt für alle Schulklassen im Bundesland."},{"id":"f|Welches Ziel gewinnt bei der Abstimmung der 6b?","ab":14,"s":56,"f":"Welches Ziel gewinnt bei der Abstimmung der 6b?","r":"der Biobauernhof","x":["das Wolfs- und Vogelgehege","das Besucherbergwerk","der Wild-West-Park"],"e":"Der Biohof bekommt 11 Stimmen, das Bergwerk 9 und das Wolfsgehege 8."},{"id":"f|Wer hat laut Frau Nosbers das Recht, über Klassenwanderungen zu beschließen?","ab":14,"s":56,"f":"Wer hat laut Frau Nosbers das Recht, über Klassenwanderungen zu beschließen?","r":"die Elternversammlung","x":["die Klassensprecherin allein","der Schülerrat","die Klassenlehrerin allein"],"e":"Die Lehrerin stellt das Abstimmungsergebnis der Klasse am Elternabend vor."},{"id":"f|Warum bekommen Kinder das Recht, selbst zu entscheiden, erst nach und nach?","ab":14,"s":56,"f":"Warum bekommen Kinder das Recht, selbst zu entscheiden, erst nach und nach?","r":"Man will sie an die Demokratie heranführen, ohne sie zu überfordern.","x":["Kinder dürfen in einer Demokratie gar nicht mitreden.","Erwachsene wollen nicht, dass Kinder Vorschläge machen.","Kinder interessieren sich nicht für demokratische Fragen."],"e":"In der Demokratie sollen Kinder mitreden, mitberaten und Vorschläge machen."},{"id":"f|Wann sagt man „Das ist aber undemokratisch!“?","ab":14,"s":57,"f":"Wann sagt man „Das ist aber undemokratisch!“?","r":"wenn jemand alleine bestimmen will, was gemacht wird","x":["wenn die Mehrheit nach einer Diskussion entscheidet","wenn alle gemeinsam über eine Frage beraten","wenn jemand seine Meinung frei äußern darf"],"e":""},{"id":"f|Was gilt in einer Demokratie für Menschen, deren Meinung in der Minderheit geblieben ist?","ab":14,"s":57,"f":"Was gilt in einer Demokratie für Menschen, deren Meinung in der Minderheit geblieben ist?","r":"Sie sind genauso viel wert wie alle anderen.","x":["Sie dürfen bei der nächsten Abstimmung nicht mitmachen.","Sie müssen ihre Meinung in Zukunft für sich behalten.","Sie sind weniger wert als die Mehrheit."],"e":"Alle Menschen sind gleich viel wert in einer Demokratie."},{"id":"f|Darf die Freiheit in einer Demokratie grenzenlos sein?","ab":14,"s":57,"f":"Darf die Freiheit in einer Demokratie grenzenlos sein?","r":"Nein, sie darf nicht dazu missbraucht werden, Gesetze und die Freiheit anderer zu missachten.","x":["Ja, in einer Demokratie darf jeder immer machen, was er will.","Ja, aber nur für Erwachsene und nicht für Kinder.","Nein, in einer Demokratie gibt es überhaupt keine Freiheit."],"e":""},{"id":"f|Woran erkennt man in der Politik eine Demokratie?","ab":14,"s":57,"f":"Woran erkennt man in der Politik eine Demokratie?","r":"In regelmäßigen Abständen werden freie Wahlen durchgeführt.","x":["Die Regierung bleibt so lange im Amt, wie sie möchte.","Ein einzelner Machthaber bestimmt über alle Gesetze.","Die Bürger dürfen nur alle 50 Jahre einmal wählen."],"e":"Das Volk bestimmt, welche Personen und Parteien die Regierung bilden."},{"id":"f|Was kann das Volk in einer Demokratie tun, wenn die Mehrheit dafür stimmt?","ab":14,"s":57,"f":"Was kann das Volk in einer Demokratie tun, wenn die Mehrheit dafür stimmt?","r":"die Regierung abwählen","x":["die Gesetze für einzelne Personen aufheben","die Wahlen für immer abschaffen","die Gerichte schließen"],"e":""},{"id":"f|Welche Rechte darf der Staat den Menschen in einer Demokratie NICHT wegnehmen?","ab":14,"s":57,"f":"Welche Rechte darf der Staat den Menschen in einer Demokratie NICHT wegnehmen?","r":"zum Beispiel die Meinungs- und die Glaubensfreiheit","x":["zum Beispiel das Recht, Gesetze nicht zu beachten","zum Beispiel das Recht, andere zu beleidigen","zum Beispiel das Recht, nicht zur Schule zu gehen"],"e":"Außerdem haben Frauen und Männer gleiche Rechte."},{"id":"f|Was kann man tun, wenn man sich in seinen Rechten verletzt fühlt?","ab":14,"s":57,"f":"Was kann man tun, wenn man sich in seinen Rechten verletzt fühlt?","r":"vor einem Gericht dagegen klagen","x":["selbst eine Strafe für den anderen festlegen","bei der nächsten Wahl die Polizei wählen","sich nicht mehr an die Gesetze halten"],"e":"In der Demokratie herrschen die Gesetze – für Bürger und Staat."},{"id":"f|Wer schützt im Auftrag des Staates die Menschen nach innen und wer nach außen?","ab":14,"s":57,"f":"Wer schützt im Auftrag des Staates die Menschen nach innen und wer nach außen?","r":"die Polizei nach innen, die Soldaten nach außen","x":["die Soldaten nach innen, die Polizei nach außen","die Gerichte nach innen, die Polizei nach außen","die Bürgermeister nach innen, die Gerichte nach außen"],"e":"Die grundlegenden Rechte der Bürger zu schützen, ist eine wichtige Aufgabe des Staates."},{"id":"f|Was ist laut Buch die wichtigste Pflicht der Menschen in einer Demokratie?","ab":14,"s":57,"f":"Was ist laut Buch die wichtigste Pflicht der Menschen in einer Demokratie?","r":"sich an die Gesetze zu halten","x":["immer die Meinung der Mehrheit zu vertreten","bei jeder Wahl dieselbe Partei zu wählen","sich nicht in die Politik einzumischen"],"e":"Außerdem ist man verpflichtet, die Rechte anderer Menschen zu respektieren."},{"id":"f|Merksatz: Die wichtigste Aufgabe einer Klassensprecherin oder eines Klassensprechers ist, …","ab":15,"s":59,"f":"Merksatz: Die wichtigste Aufgabe einer Klassensprecherin oder eines Klassensprechers ist, …","r":"die Interessen der Klasse gegenüber Lehrkräften und im Schülerrat zu vertreten.","x":["den Lehrkräften beim Einsammeln von Geld oder Formularen zu helfen.","für Ruhe in der Klasse zu sorgen, wenn keine Lehrkraft da ist.","die eigene Meinung gegenüber Mitschülern überzeugend zu begründen."],"e":""},{"id":"f|Merksatz: Die Möglichkeit, wählen zu können, …","ab":15,"s":59,"f":"Merksatz: Die Möglichkeit, wählen zu können, …","r":"gehört zu den grundlegenden Merkmalen einer Demokratie.","x":["hat mit dem Zusammenleben in der Schule nichts zu tun.","ist ein Recht, das uns erst ab 21 Jahren zusteht.","ist für Kinder und Jugendliche meist eine Überforderung."],"e":""},{"id":"f|Merksatz: Für Wahlen in der Schule und in der Politik gelten fünf Wahlgrundsätze, nämlich …","ab":15,"s":59,"f":"Merksatz: Für Wahlen in der Schule und in der Politik gelten fünf Wahlgrundsätze, nämlich …","r":"allgemein, unmittelbar, frei, gleich und geheim.","x":["allgemein, angenehm, frei, besonders und geheim.","klug, informiert, freiwillig, öffentlich und von Zeit zu Zeit.","allgemein, indirekt, frei, gleichzeitig und geheim."],"e":""},{"id":"f|Merksatz: Das wichtigste gesetzlich garantierte Recht aller Schülerinnen und Schüler ist …","ab":15,"s":59,"f":"Merksatz: Das wichtigste gesetzlich garantierte Recht aller Schülerinnen und Schüler ist …","r":"das Recht auf schulische Bildung.","x":["das Recht auf Belehrung.","die Möglichkeit, dem Unterricht fernzubleiben.","das Recht, nur freiwillig im Unterricht mitzuarbeiten."],"e":""},{"id":"f|Merksatz: Die wichtigste Aufgabe der Schülervertretung besteht darin, …","ab":15,"s":59,"f":"Merksatz: Die wichtigste Aufgabe der Schülervertretung besteht darin, …","r":"die Rechte der Schüler wahrzunehmen und ihre Interessen zu vertreten.","x":["an schulischen Veranstaltungen aktiv teilzunehmen.","die Schüler über ihre Rechte und Pflichten aufzuklären.","dafür zu sorgen, dass das Schulleben störungsfrei abläuft."],"e":""},{"id":"f|Merksatz: Für das Zusammenleben in der Demokratie müssen alle Menschen lernen, …","ab":15,"s":59,"f":"Merksatz: Für das Zusammenleben in der Demokratie müssen alle Menschen lernen, …","r":"zu respektieren, dass andere eine andere Meinung haben dürfen.","x":["immer die Meinung zu vertreten, die die Mehrheit hat.","sich den Meinungen der Stärkeren unterzuordnen.","dass eine eigene Meinung zu Problemen wenig Sinn macht."],"e":""},{"id":"f|Was interessierte Kaiser Friedrich II. bei seinem Experiment mit Säuglingen ganz besonders?","ab":17,"s":62,"f":"Was interessierte Kaiser Friedrich II. bei seinem Experiment mit Säuglingen ganz besonders?","r":"Welche Sprache die Kinder von selbst sprechen würden","x":["Wie schnell die Kinder ohne Eltern laufen lernen würden","Welches Essen die Kinder am liebsten mögen würden","Wie groß die Kinder ohne Eltern werden würden"],"e":"Er wollte wissen, wie sich Kinder verhalten, die möglichst wenig von außen beeinflusst werden – vor allem, welche Sprache sie verwenden."},{"id":"f|Was durften die Ammen im Experiment von Kaiser Friedrich II. NICHT tun?","ab":17,"s":62,"f":"Was durften die Ammen im Experiment von Kaiser Friedrich II. NICHT tun?","r":"Mit den Kindern sprechen","x":["Die Kinder säubern","Die Kinder ernähren","Die Kinder versorgen"],"e":"Die Ammen sollten die Kinder nur säubern und ernähren, aber nicht mit ihnen sprechen oder ihnen Zuwendung zeigen."},{"id":"f|Wie ging das Experiment von Kaiser Friedrich II. aus?","ab":17,"s":62,"f":"Wie ging das Experiment von Kaiser Friedrich II. aus?","r":"Kein Kind überlebte die ersten Lebensjahre.","x":["Alle Kinder sprachen dieselbe alte Sprache.","Die Kinder erfanden eine eigene Sprache.","Die Kinder wuchsen gesund und fröhlich auf."],"e":"Keines der Kinder fing an zu sprechen, und alle starben in ihren ersten Lebensjahren. Ihnen fehlte die Zuwendung."},{"id":"f|Was braucht ein Baby außer Nahrung unbedingt?","ab":17,"s":62,"f":"Was braucht ein Baby außer Nahrung unbedingt?","r":"Spürbaren Kontakt und Zuwendung von Menschen","x":["Viel Ruhe und möglichst wenig Kontakt","Ein eigenes Zimmer mit vielen Spielsachen","Möglichst früh einen Platz in der Schule"],"e":"Mit Babys muss man sprechen, sie in den Arm nehmen und sie trösten, wenn sie weinen."},{"id":"f|Was kann passieren, wenn Kinder in den ersten Lebensjahren nicht genug Zuwendung bekommen?","ab":17,"s":62,"f":"Was kann passieren, wenn Kinder in den ersten Lebensjahren nicht genug Zuwendung bekommen?","r":"Sie können krank werden und in ihrer Entwicklung verkümmern.","x":["Sie werden besonders schnell selbstständig und stark.","Sie lernen viel früher sprechen als andere Kinder.","Sie werden später besonders mutig und fröhlich."],"e":""},{"id":"f|Was ist laut Buch die wichtigste Aufgabe einer Familie?","ab":17,"s":62,"f":"Was ist laut Buch die wichtigste Aufgabe einer Familie?","r":"Die Erziehung der Kinder","x":["Ein großes Haus zu kaufen","Möglichst viel Geld zu sparen","Oft gemeinsam zu verreisen"],"e":"Auch bei den Kompetenzstationen heißt es: Das wichtigste Recht und die wichtigste Pflicht der Eltern ist die Erziehung der Kinder."},{"id":"f|Wofür ist das Urvertrauen eines Kindes die Grundlage?","ab":17,"s":62,"f":"Wofür ist das Urvertrauen eines Kindes die Grundlage?","r":"Für eine positive Einstellung zum Leben","x":["Für sehr gute Noten in der Schule","Für einen gut bezahlten Beruf","Für ein besonders gutes Gedächtnis"],"e":"Urvertrauen bedeutet, dass Kinder Vertrauen zu anderen Menschen entwickeln können."},{"id":"f|Welche Aussage über Familien stimmt laut Buch?","ab":17,"s":62,"f":"Welche Aussage über Familien stimmt laut Buch?","r":"Auch Alleinerziehende mit Kind bilden eine Familie.","x":["Nur verheiratete Eltern bilden eine Familie.","Eine Familie muss mindestens zwei Kinder haben.","Nur große Familien sind richtige Familien."],"e":"Es spielt keine Rolle, ob eine Familie groß oder klein ist oder ob die Eltern verheiratet sind."},{"id":"f|Wer kann für ein kleines Kind eine Bezugsperson sein?","ab":17,"s":62,"f":"Wer kann für ein kleines Kind eine Bezugsperson sein?","r":"Jeder, der es liebevoll umsorgt und dem es vertraut","x":["Nur die leiblichen Eltern, die es bekommen haben","Nur Verwandte, die im selben Haus wohnen","Nur Erwachsene mit einer Ausbildung als Erzieher"],"e":"Besonders häufig sind es die leiblichen Eltern. Aber auch andere Personen kommen infrage, wenn sie wie Eltern mit den Kindern zusammenleben."},{"id":"f|Was bietet eine Familie einem Kind laut Text D?","ab":17,"s":63,"f":"Was bietet eine Familie einem Kind laut Text D?","r":"Geborgenheit, Schutz und Zusammenhalt","x":["Reichtum, Ruhm und Bequemlichkeit","Strenge, Ordnung und Gehorsam","Freiheit, Abenteuer und Ruhe"],"e":"In der Familie fühlt sich das Kind zu Hause, wird umsorgt und kann gut aufwachsen."},{"id":"f|Wer kann laut Text D manchmal auch zu einer Familie gehören?","ab":17,"s":63,"f":"Wer kann laut Text D manchmal auch zu einer Familie gehören?","r":"Nicht verwandte Menschen und sogar Haustiere","x":["Nur Eltern und ihre leiblichen Kinder","Nur Menschen, die miteinander verheiratet sind","Nur Verwandte, die im selben Haus wohnen"],"e":"Eine Familie besteht nicht immer aus Vater, Mutter und Kind."},{"id":"f|Welche Familienform ist in Deutschland die häufigste?","ab":18,"s":64,"f":"Welche Familienform ist in Deutschland die häufigste?","r":"Die Familie mit einem Kind","x":["Die Familie mit zwei Kindern","Die Familie mit drei und mehr Kindern","Die Familie mit vier und mehr Kindern"],"e":"Die „Ein-Kind-Familie“ ist am häufigsten. Familien mit zwei Kindern (etwa 4,5 Millionen) sind die zweithäufigste Form."},{"id":"f|Wie viele Familien gibt es ungefähr in Deutschland?","ab":18,"s":64,"f":"Wie viele Familien gibt es ungefähr in Deutschland?","r":"Etwas mehr als 12 Millionen","x":["Etwa 1,5 Millionen","Etwa 4,5 Millionen","Etwas mehr als 80 Millionen"],"e":"Davon haben etwa 8 Millionen einen Trauschein, etwa 4 Millionen nicht (Statistisches Bundesamt 2023)."},{"id":"f|Wie viele alleinerziehende Mütter gibt es etwa in Deutschland?","ab":18,"s":64,"f":"Wie viele alleinerziehende Mütter gibt es etwa in Deutschland?","r":"Etwa 2,5 Millionen","x":["Etwa 500 000","Etwa 10 000","Etwa 12 Millionen"],"e":"Dazu kommen etwa 500 000 alleinerziehende Väter."},{"id":"f|Wer wird in Deutschland NICHT als Familie gezählt?","ab":18,"s":65,"f":"Wer wird in Deutschland NICHT als Familie gezählt?","r":"Ein älteres Ehepaar, dessen Kinder ausgezogen sind","x":["Eine alleinerziehende Mutter mit ihrem Sohn","Ein unverheiratetes Paar mit einem adoptierten Kind","Ein Ehepaar mit drei eigenen Kindern"],"e":"Paare ohne Kinder und ältere Ehepaare, deren Kinder ausgezogen sind, gelten als Lebensgemeinschaft."},{"id":"f|Was war in früheren Zeiten selbstverständlich?","ab":18,"s":65,"f":"Was war in früheren Zeiten selbstverständlich?","r":"Man heiratete, bekam Kinder und blieb ein Leben lang zusammen.","x":["Man lebte ohne Trauschein zusammen und bekam keine Kinder.","Man zog als Mutter oder Vater ein Kind ganz allein groß.","Man heiratete mehrmals und gründete viele neue Familien."],"e":"Heute gibt es viel mehr Möglichkeiten, wie man als Familie zusammenleben kann."},{"id":"f|Was ist laut Buch KEIN Grund dafür, dass es heute so viele Familienformen gibt?","ab":18,"s":65,"f":"Was ist laut Buch KEIN Grund dafür, dass es heute so viele Familienformen gibt?","r":"Es gibt heute viel weniger Wohnungen als früher.","x":["Es gibt heute viel mehr Scheidungen als früher.","Frauen und Männer sind heute gleichberechtigter.","Es gibt heute mehr Möglichkeiten, zusammenzuleben."],"e":"Das Buch nennt drei Gründe: mehr Möglichkeiten des Zusammenlebens, mehr Scheidungen und mehr Gleichberechtigung."},{"id":"f|Wie viele von zehn Kindern in Deutschland leben in einer Familie mit zwei Eltern?","ab":18,"s":65,"f":"Wie viele von zehn Kindern in Deutschland leben in einer Familie mit zwei Eltern?","r":"Acht","x":["Fünf","Drei","Zehn"],"e":"Viele Geschiedene heiraten wieder, und die Kinder wachsen dann in einer Fortsetzungsfamilie auf."},{"id":"f|Warum können viele Frauen heute auch ohne Partner leben?","ab":18,"s":65,"f":"Warum können viele Frauen heute auch ohne Partner leben?","r":"Sie haben oft eine gute Ausbildung und eigenes Geld.","x":["Sie bekommen vom Staat ein eigenes Haus geschenkt.","Sie müssen heute keine Steuern mehr bezahlen.","Sie wohnen heute meistens wieder bei ihren Eltern."],"e":"Früher waren Frauen oft vom Geld ihres Ehepartners abhängig. Die Zunahme der Gleichberechtigung hat das verändert."},{"id":"f|Woran erkennt man eine erfolgreich arbeitende Gruppe?","ab":18,"s":66,"f":"Woran erkennt man eine erfolgreich arbeitende Gruppe?","r":"Alle sind beteiligt und niemand wird ausgeschlossen.","x":["Ein oder zwei Mitglieder erledigen die ganze Arbeit.","Bei jeder Schwierigkeit ruft man die Lehrkraft.","Alle reden durcheinander und streiten viel."],"e":"In einer guten Gruppe teilen die Mitglieder die Arbeit so auf, dass jeder passende Aufgaben übernimmt."},{"id":"f|Was passiert in einer erfolgreichen Gruppe, wenn ein Mitglied zeitweise ausfällt?","ab":18,"s":66,"f":"Was passiert in einer erfolgreichen Gruppe, wenn ein Mitglied zeitweise ausfällt?","r":"Andere springen ein und übernehmen seine Arbeit.","x":["Die ganze Gruppe hört mit der Arbeit auf.","Das Mitglied wird aus der Gruppe ausgeschlossen.","Die Lehrerin erledigt dann seine Arbeit."],"e":"In einer erfolgreichen Gruppe hilft man sich gegenseitig."},{"id":"f|Was ist laut Methodenkarte das Vorbild für gute Gruppenarbeit?","ab":18,"s":66,"f":"Was ist laut Methodenkarte das Vorbild für gute Gruppenarbeit?","r":"Der Mannschaftssport","x":["Ein Wettrennen gegeneinander","Ein Einzelspiel am Computer","Ein Vortrag vor der Klasse"],"e":"Wie im Mannschaftssport entsteht Erfolg, wenn die Gruppe zum Team wird."},{"id":"f|Fallbeispiel: Was ist das Besondere an Judiths Familie?","ab":18,"s":68,"f":"Fallbeispiel: Was ist das Besondere an Judiths Familie?","r":"Nicht alle fünf Kinder haben dieselben Eltern.","x":["Judith ist ein Einzelkind und lebt bei den Großeltern.","Die Familie ist vor einigen Jahren aus Syrien geflohen.","Die Familie wohnt in einem großen Zwei-Familien-Haus."],"e":"Judith lebt in einer Patchworkfamilie: Ihre Eltern haben beide Kinder aus einer früheren Ehe."},{"id":"f|Womit haben die Unterschiede im Familienleben zwischen den Ländern zu tun?","ab":19,"s":69,"f":"Womit haben die Unterschiede im Familienleben zwischen den Ländern zu tun?","r":"Mit Traditionen und unterschiedlichen Lebensverhältnissen","x":["Mit dem Wetter und den verschiedenen Jahreszeiten","Mit der Größe der Häuser und der Gärten","Mit der Zahl der Schulen und Spielplätze"],"e":"Familien haben überall eine große Bedeutung, aber von Land zu Land gibt es Unterschiede und Besonderheiten."},{"id":"f|Was fiel Josef Bach an den Familien in den USA besonders auf?","ab":19,"s":69,"f":"Was fiel Josef Bach an den Familien in den USA besonders auf?","r":"Die große Zahl von Patchworkfamilien","x":["Die große Zahl von Großfamilien","Die große Zahl von Einzelkindern","Die große Zahl von Bauernfamilien"],"e":"Man heiratet oft ein zweites Mal und gründet eine neue Familie. Mit den früheren Familien bleibt man häufig in Kontakt."},{"id":"f|Warum spenden viele Familien in den USA Geld für die Schulen?","ab":19,"s":69,"f":"Warum spenden viele Familien in den USA Geld für die Schulen?","r":"Damit die Schulen möglichst gut ausgestattet sind","x":["Damit ihre Kinder bessere Noten bekommen","Weil der Staat sie dazu verpflichtet","Damit die Schulen früher Ferien machen"],"e":"Die Schulen werden in den USA von den örtlichen Gemeinden finanziert."},{"id":"f|Was gibt es in den USA im Unterschied zu Deutschland NICHT?","ab":19,"s":69,"f":"Was gibt es in den USA im Unterschied zu Deutschland NICHT?","r":"Staatliches Kindergeld","x":["Patchworkfamilien","Sport- und Theatergruppen an Schulen","Familienbesuche mit dem Flugzeug"],"e":"In den USA erwartet man nicht, dass der Staat die Familien unterstützt. Eher helfen wohlhabende Familien freiwillig anderen Familien."},{"id":"f|Was schrieb der Staat in China bis zum Jahr 2015 vor?","ab":19,"s":70,"f":"Was schrieb der Staat in China bis zum Jahr 2015 vor?","r":"Familien durften nur ein Kind haben.","x":["Familien mussten mindestens drei Kinder haben.","Kinder mussten bei ihren Großeltern wohnen.","Familien durften nicht in die Städte ziehen."],"e":"Obwohl die Regel nicht mehr gilt, werden die Familien in den Städten immer kleiner."},{"id":"f|Was ist in China ein besonders wichtiges Erziehungsziel?","ab":19,"s":70,"f":"Was ist in China ein besonders wichtiges Erziehungsziel?","r":"Respekt vor allen älteren Menschen","x":["Freiheit von allen Regeln","Erfolg in möglichst vielen Sportarten","Freude am Spielen draußen"],"e":"Außerdem wird großer Wert darauf gelegt, dass Kinder früh mit dem Lernen beginnen und fleißig sind."},{"id":"f|Was schreibt das Gesetz in China den Kindern für später vor?","ab":19,"s":70,"f":"Was schreibt das Gesetz in China den Kindern für später vor?","r":"Sie müssen ihre Eltern pflegen und finanziell unterstützen.","x":["Sie müssen ihren Eltern ein Haus auf dem Land kaufen.","Sie müssen ihr ganzes Leben in derselben Stadt wohnen.","Sie müssen mindestens drei eigene Kinder bekommen."],"e":"Wer das nicht tut, macht sich in China strafbar."},{"id":"f|Wie leben Familien in China auf dem Land oft noch?","ab":19,"s":70,"f":"Wie leben Familien in China auf dem Land oft noch?","r":"Als Großfamilie mit mehreren Generationen in einem Haus","x":["Als Kleinfamilie in einer kleinen Stadtwohnung","Als Paar ganz ohne Kinder in einem Hochhaus","Als Einzelkind-Familie weit weg von den Großeltern"],"e":"In den Städten überwiegt dagegen mittlerweile die Kleinfamilie."},{"id":"f|Wie viele Kinder bekommt eine Frau in Burkina Faso im Durchschnitt?","ab":19,"s":70,"f":"Wie viele Kinder bekommt eine Frau in Burkina Faso im Durchschnitt?","r":"Mehr als vier","x":["Genau eins","Etwa zwei","Mehr als zwölf"],"e":"Die Familien in Burkina Faso sind groß. Mehr als die Hälfte der Bevölkerung ist unter 18 Jahre alt."},{"id":"f|Welche Aufgaben übernehmen Mädchen in Burkina Faso schon früh?","ab":19,"s":70,"f":"Welche Aufgaben übernehmen Mädchen in Burkina Faso schon früh?","r":"Sie helfen der Mutter im Haushalt und passen auf Geschwister auf.","x":["Sie unterrichten die jüngeren Kinder in der Dorfschule.","Sie verkaufen Spielzeug auf dem Markt in der Hauptstadt.","Sie bauen zusammen mit den Vätern die Häuser aus Stein."],"e":"Sie kochen, waschen Geschirr und Wäsche, holen Wasser vom Brunnen oder sammeln Brennholz."},{"id":"f|Welche Tradition gibt es in Bolivien bei der Geburt eines Kindes?","ab":19,"s":71,"f":"Welche Tradition gibt es in Bolivien bei der Geburt eines Kindes?","r":"Das Kind bekommt sein erstes Tier geschenkt.","x":["Das Kind bekommt ein eigenes Stück Land.","Das Kind bekommt einen eigenen Baum gepflanzt.","Das Kind bekommt ein eigenes kleines Haus."],"e":"Zum Beispiel ein Schaf, ein Lama oder ein Schwein. Auch die Jungtiere darf das Kind behalten."},{"id":"f|Welches Problem betrifft laut Buch einen Großteil der Familien in Lateinamerika direkt?","ab":19,"s":71,"f":"Welches Problem betrifft laut Buch einen Großteil der Familien in Lateinamerika direkt?","r":"Die Armut","x":["Das schlechte Wetter","Der Mangel an Tieren","Die vielen Feiertage"],"e":"Deshalb müssen oft beide Eltern und auch einige Kinder zum Familieneinkommen beitragen."},{"id":"f|Warum nehmen Eltern in Bolivien ihre Kinder oft mit zum „Arbeitsplatz“?","ab":19,"s":71,"f":"Warum nehmen Eltern in Bolivien ihre Kinder oft mit zum „Arbeitsplatz“?","r":"Weil die Kinder sonst nicht richtig betreut werden können","x":["Weil die Kinder dort ihren Schulunterricht bekommen","Weil die Kinder dort mit anderen Kindern Fußball spielen","Weil es dort ein kostenloses Mittagessen für Kinder gibt"],"e":"Zum Beispiel in den kleinen Laden oder zum Verkaufsstand auf dem Markt. So wachsen die Kinder von klein auf in die Arbeitswelt hinein."},{"id":"f|Welche Vorstellung empfindet heute eine Mehrheit als altmodische Rollenerwartung?","ab":20,"s":72,"f":"Welche Vorstellung empfindet heute eine Mehrheit als altmodische Rollenerwartung?","r":"Väter kümmern sich nicht um die Erziehung, Mütter erledigen den Haushalt allein.","x":["Väter und Mütter e möglichst schonend bearbeitet.","… nachliefern kann, sobald die Rohstoffe verbraucht sind.","… genügend große Vorräte an Rohstoffen bereitstellt."],"e":""}];

const SPEICHER = "politikbuch.v1";
const APP = "politikbuch";
// Tage bis zur nächsten Abfrage je Fach (Index = Fach 1..5)
const FACH_TAGE = [0, 0, 1, 3, 7, 14];

// ---------- Speicher ----------

function leererStand() {
  return {
    karten: {},
    tests: [],
    einstellungen: { modus: "fragen", gruppierung: "kapitel", auswahl: null, seiteVon: 0, seiteBis: 0, richtung: "beide", anzahlB: 15, testart: "ueben", anzahlF: 10 },
  };
}

function ladeStand() {
  try {
    const roh = JSON.parse(localStorage.getItem(SPEICHER));
    if (roh && roh.karten && roh.einstellungen) {
      return { karten: roh.karten, tests: roh.tests || [], einstellungen: { ...leererStand().einstellungen, ...roh.einstellungen } };
    }
  } catch (e) { /* kaputter Stand -> neu anfangen */ }
  return leererStand();
}

let stand = ladeStand();

function speichere() {
  try { localStorage.setItem(SPEICHER, JSON.stringify(stand)); } catch (e) { /* z. B. privater Modus */ }
}

function heute() {
  const d = new Date();
  return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

// ---------- Hilfen ----------

const $ = id => document.getElementById(id);

function mische(liste) {
  const a = liste.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function seitenText(von, bis) { return von === bis ? "S. " + von : `S. ${von}–${bis}`; }

// Kapitel mit ihren Abschnitten in Buchreihenfolge
function kapitelListe() {
  const kapitel = [];
  KAPITEL.forEach((ab, i) => {
    let k = kapitel.find(x => x.nr === ab.nr);
    if (!k) kapitel.push(k = { nr: ab.nr, name: ab.k, von: ab.von, bis: ab.bis, abschnitte: [] });
    k.bis = ab.bis;
    k.abschnitte.push({ name: ab.a, key: ab.nr + "|" + ab.a, von: ab.von, bis: ab.bis,
      begriffe: BEGRIFFE.filter(v => v.ab === i), fragen: FRAGEN.filter(v => v.ab === i) });
  });
  return kapitel;
}

const KAPITELLISTE = kapitelListe();
const ALLE_SEITEN = [...BEGRIFFE, ...FRAGEN].map(v => v.s);
const ERSTE_SEITE = Math.min(...ALLE_SEITEN);
const LETZTE_SEITE = Math.max(...ALLE_SEITEN);

function abschnittKey(v) { const ab = KAPITEL[v.ab]; return ab.nr + "|" + ab.a; }
function kapitelName(nr) { return nr === 0 ? "Einführung" : "Kap. " + nr; }
function herkunftVon(v) {
  const ab = KAPITEL[v.ab];
  return ab.nr === 0 ? ab.k : `${kapitelName(ab.nr)} ${ab.k} · ${ab.a}`;
}

// aufgeklappte Kapitel (nur für diesen Besuch, anfangs alle zu)
const OFFENE_THEMEN = new Set();

function nachSeiten() { return stand.einstellungen.gruppierung === "seiten"; }

function istBegriffe() { return stand.einstellungen.modus === "begriffe"; }
function eintraegeVon(a) { return istBegriffe() ? a.begriffe : a.fragen; }

// ---------- Begriff prüfen ----------

function norm(s) {
  return s.normalize("NFC").toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[.,;:!?"„“”()]/g, " ")
    .replace(/-/g, " ")
    .replace(/^(der|die|das|ein|eine) /, "")
    .replace(/\s+/g, " ")
    .trim();
}

function falte(s) {
  return norm(s).replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/ /g, "");
}

function abstand(a, b) {
  if (Math.abs(a.length - b.length) > 2) return 3;
  const z = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let vorher = z[0];
    z[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = z[j];
      z[j] = Math.min(z[j] + 1, z[j - 1] + 1, vorher + (a[i - 1] === b[j - 1] ? 0 : 1));
      vorher = tmp;
    }
  }
  return z[b.length];
}

// „Fachausschuss|Ausschuss“: erste Schreibweise wird gezeigt, alle zählen als richtig
function begriffAnzeige(b) { return b.b.split("|")[0]; }
function begriffVarianten(b) { return b.b.split("|").map(s => s.trim()).filter(Boolean); }

function pruefeBegriff(b, eingabe) {
  const loesung = begriffAnzeige(b);
  const a = norm(eingabe);
  if (!a) return { status: "falsch", loesung };
  const ziele = begriffVarianten(b);
  const passend = ziele.find(z => norm(z) === a);
  if (passend) {
    const tipp = passend !== loesung ? "Auch richtig! Im Buch steht: " + loesung : "";
    return { status: "richtig", loesung, tipp };
  }
  const f = falte(eingabe);
  if (ziele.some(z => falte(z) === f)) {
    return { status: "richtig", loesung, tipp: "Achte auf die Schreibweise: " + loesung };
  }
  const grenze = f.length >= 8 ? 2 : f.length >= 4 ? 1 : 0;
  if (grenze && ziele.some(z => abstand(f, falte(z)) <= grenze)) {
    return { status: "fast", loesung };
  }
  return { status: "falsch", loesung };
}

// ---------- Karteikasten ----------

function fachVon(key) {
  const k = stand.karten[key];
  return k ? k.fach : 0;
}

function ausgewaehlt(liste) {
  const e = stand.einstellungen;
  return nachSeiten()
    ? liste.filter(v => v.s >= e.seiteVon && v.s <= e.seiteBis)
    : liste.filter(v => e.auswahl.includes(abschnittKey(v)));
}

function richtungen() {
  const r = stand.einstellungen.richtung;
  return r === "beide" ? ["e-b", "b-e"] : [r];
}

// Eine Karte = ein Eintrag in einer Abfrageart
function alleKarten() {
  if (istBegriffe()) {
    const karten = [];
    for (const v of ausgewaehlt(BEGRIFFE)) for (const r of richtungen()) karten.push({ v, art: r, key: v.id + "|" + r });
    return karten;
  }
  return ausgewaehlt(FRAGEN).map(v => ({ v, art: "mc", key: v.id }));
}

function istFaellig(karte) {
  const k = stand.karten[karte.key];
  return !k || k.faellig <= heute();
}

function baueRunde(karten, anzahl) {
  const sortiert = mische(karten).sort((a, b) => fachVon(a.key) - fachVon(b.key));
  const gesehen = new Set();
  const runde = [];
  for (const k of sortiert) {
    if (gesehen.has(k.v.id)) continue;   // bei „Gemischt“ jeder Begriff nur einmal pro Runde
    gesehen.add(k.v.id);
    runde.push(k);
    if (anzahl && runde.length >= anzahl) break;
  }
  return mische(runde);
}

// ---------- Startseite ----------

function zeichneStart() {
  const e = stand.einstellungen;
  const begriffe = istBegriffe();
  const probe = !begriffe && e.testart === "probe";

  for (const b of $("modi").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.wert === e.modus));
  $("infoBegriffe").textContent = BEGRIFFE.length + " Begriffe";
  $("infoFragen").textContent = FRAGEN.length + " Fragen";

  for (const b of $("gruppierung").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.wert === e.gruppierung));
  const liste = $("kapitelliste");
  liste.innerHTML = "";
  liste.hidden = nachSeiten();
  $("seitenliste").hidden = !nachSeiten();
  if (nachSeiten()) zeichneSeiten();
  else for (const t of KAPITELLISTE) {
    const abschnitte = t.abschnitte.filter(a => eintraegeVon(a).length);
    if (!abschnitte.length) continue;
    const block = document.createElement("div");
    block.className = "kapitel";
    const alle = abschnitte.every(a => e.auswahl.includes(a.key));
    const einige = abschnitte.some(a => e.auswahl.includes(a.key));
    const offen = OFFENE_THEMEN.has(t.nr);
    const kopf = document.createElement("div");
    kopf.className = "zeile";
    kopf.innerHTML = `<input type="checkbox"><button type="button" class="klapp"><span class="pfeil"></span><span class="name"></span><span class="seiten"></span></button><span class="anzahl"></span>`;
    const kb = kopf.querySelector("input");
    kb.checked = alle;
    kb.indeterminate = einige && !alle;
    const titel = t.nr === 0 ? t.name : `${t.nr} · ${t.name}`;
    kb.setAttribute("aria-label", titel + " auswählen");
    const klapp = kopf.querySelector(".klapp");
    klapp.setAttribute("aria-expanded", String(offen));
    kopf.querySelector(".pfeil").textContent = offen ? "▾" : "▸";
    klapp.addEventListener("click", () => {
      if (offen) OFFENE_THEMEN.delete(t.nr); else OFFENE_THEMEN.add(t.nr);
      zeichneStart();
    });
    kopf.querySelector(".name").textContent = titel;
    kopf.querySelector(".seiten").textContent = seitenText(t.von, t.bis);
    kopf.querySelector(".anzahl").textContent = abschnitte.reduce((n, a) => n + eintraegeVon(a).length, 0) + (begriffe ? " Begriffe" : " Fragen");
    kb.addEventListener("change", () => {
      for (const a of t.abschnitte) setzeAuswahl(a.key, kb.checked);
      zeichneStart();
    });
    block.appendChild(kopf);

    const unter = document.createElement("div");
    unter.className = "abschnitte";
    unter.hidden = !offen;
    for (const a of abschnitte) {
      const z = document.createElement("label");
      z.className = "zeile";
      z.innerHTML = `<input type="checkbox"><span class="name"><span></span> <span class="seiten"></span></span><span class="balken" title="Anteil in Fach 3 bis 5"><span></span></span><span class="anzahl"></span>`;
      const cb = z.querySelector("input");
      cb.checked = e.auswahl.includes(a.key);
      cb.addEventListener("change", () => { setzeAuswahl(a.key, cb.checked); zeichneStart(); });
      z.querySelector(".name > span").textContent = a.name;
      z.querySelector(".name .seiten").textContent = seitenText(a.von, a.bis);
      z.querySelector(".anzahl").textContent = eintraegeVon(a).length;
      z.querySelector(".balken > span").style.width = Math.round(gelerntAnteil(eintraegeVon(a)) * 100) + "%";
      unter.appendChild(z);
    }
    block.appendChild(unter);
    liste.appendChild(block);
  }

  $("optBegriffe").hidden = !begriffe;
  $("optFragen").hidden = begriffe;
  for (const b of $("richtung").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.wert === e.richtung));
  for (const b of $("testart").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.wert === e.testart));
  $("richtungsHilfe").textContent = {
    "e-b": "Die Erklärung steht da – du tippst den Begriff ein.",
    "b-e": "Der Begriff steht da – du überlegst die Erklärung, deckst auf und sagst selbst, ob du es wusstest.",
    "beide": "Mal so, mal so.",
  }[e.richtung];
  $("testartHilfe").textContent = probe
    ? "Wie eine Klassenarbeit: Du siehst erst am Ende, was richtig war. Der Karteikasten bleibt unverändert."
    : "Nach jeder Frage siehst du sofort, ob es stimmt. Falsche Fragen kommen in der Runde nochmal.";
  $("anzahlB").value = String(e.anzahlB);
  $("anzahlF").value = String(e.anzahlF);

  const karten = alleKarten();
  $("kastenBox").hidden = probe;
  const zaehler = [0, 0, 0, 0, 0, 0];
  for (const k of karten) zaehler[fachVon(k.key)]++;
  $("faecher").innerHTML = zaehler.map((n, i) =>
    `<div class="fach f${i}"><b>${n}</b><small>${i === 0 ? "neu" : "Fach " + i}</small></div>`).join("");

  zeichneVerlauf(!begriffe);

  const faellig = karten.filter(istFaellig).length;
  const wort = begriffe ? "Begriffe" : "Fragen";
  const anzahl = begriffe ? e.anzahlB : e.anzahlF;
  const los = $("los");
  if (!karten.length) {
    los.textContent = nachSeiten() ? "Auf diesen Seiten gibt es nichts" : "Wähle mindestens einen Abschnitt";
    los.disabled = true;
  } else if (probe) {
    los.textContent = `Probetest starten (${anzahl ? Math.min(anzahl, karten.length) : karten.length} Fragen)`;
    los.disabled = false;
  } else if (faellig) {
    los.textContent = `Los geht's (${anzahl ? Math.min(faellig, anzahl) : faellig} ${wort})`;
    los.disabled = false;
  } else {
    los.textContent = "Heute ist nichts fällig – trotzdem üben";
    los.disabled = false;
  }
}

// „nach Buchseiten“: z. B. für eine Arbeit über S. 40–59
function zeichneSeiten() {
  const e = stand.einstellungen;
  if (document.activeElement !== $("seiteVon")) $("seiteVon").value = e.seiteVon;
  if (document.activeElement !== $("seiteBis")) $("seiteBis").value = e.seiteBis;
  const n = ausgewaehlt(istBegriffe() ? BEGRIFFE : FRAGEN).length;
  const kap = [...new Set(KAPITEL.filter(a => a.bis >= e.seiteVon && a.von <= e.seiteBis).map(a => kapitelName(a.nr)))];
  $("seitenTreffer").textContent = `${n} ${istBegriffe() ? "Begriffe" : "Fragen"} auf ${seitenText(e.seiteVon, e.seiteBis)}`
    + (kap.length ? " · " + kap.join(", ") : "");
  const schnell = $("seitenSchnell");
  if (!schnell.children.length) {
    for (const t of KAPITELLISTE) {
      if (![...BEGRIFFE, ...FRAGEN].some(v => v.s >= t.von && v.s <= t.bis)) continue;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "klein";
      b.textContent = t.nr === 0 ? "Einf." : "Kap. " + t.nr;
      b.title = `${t.name} (${seitenText(t.von, t.bis)})`;
      b.addEventListener("click", () => { setzeSeiten(t.von, t.bis); });
      schnell.appendChild(b);
    }
  }
}

function setzeSeiten(von, bis) {
  const e = stand.einstellungen;
  von = Number(von) || ERSTE_SEITE;
  bis = Number(bis) || LETZTE_SEITE;
  if (von > bis) [von, bis] = [bis, von];
  e.seiteVon = von;
  e.seiteBis = bis;
  speichere();
  zeichneStart();
}
$("seiteVon").addEventListener("change", () => setzeSeiten($("seiteVon").value, $("seiteBis").value));
$("seiteBis").addEventListener("change", () => setzeSeiten($("seiteVon").value, $("seiteBis").value));

function zeichneVerlauf(zeigen) {
  const tests = stand.tests.slice(-5).reverse();
  $("verlaufBox").hidden = !zeigen || !tests.length;
  $("verlauf").innerHTML = "";
  for (const t of tests) {
    const li = document.createElement("li");
    li.innerHTML = `<span class="datum"></span><span class="themen"></span><span class="pkt"></span>`;
    li.querySelector(".datum").textContent = t.datum;
    li.querySelector(".themen").textContent = t.themen;
    li.querySelector(".pkt").textContent = `${t.richtig}/${t.gesamt} (${Math.round(t.richtig / t.gesamt * 100)} %)`;
    $("verlauf").appendChild(li);
  }
}

function gelerntAnteil(eintraege) {
  let gelernt = 0, gesamt = 0;
  for (const v of eintraege) {
    const keys = v.f ? [v.id] : richtungen().map(r => v.id + "|" + r);
    for (const k of keys) { gesamt++; if (fachVon(k) >= 3) gelernt++; }
  }
  return gesamt ? gelernt / gesamt : 0;
}

function setzeAuswahl(key, an) {
  const a = stand.einstellungen.auswahl.filter(x => x !== key);
  if (an) a.push(key);
  stand.einstellungen.auswahl = a;
  speichere();
}

function umschalter(id, feld) {
  $(id).addEventListener("click", ev => {
    const b = ev.target.closest("button");
    if (!b) return;
    stand.einstellungen[feld] = b.dataset.wert;
    speichere();
    zeichneStart();
  });
}
umschalter("modi", "modus");
umschalter("gruppierung", "gruppierung");
umschalter("richtung", "richtung");
umschalter("testart", "testart");
$("anzahlB").addEventListener("change", ev => { stand.einstellungen.anzahlB = Number(ev.target.value); speichere(); zeichneStart(); });
$("anzahlF").addEventListener("change", ev => { stand.einstellungen.anzahlF = Number(ev.target.value); speichere(); zeichneStart(); });

$("los").addEventListener("click", () => {
  const e = stand.einstellungen;
  const karten = alleKarten();
  if (!istBegriffe() && e.testart === "probe") return starteRunde(baueRunde(mische(karten), e.anzahlF), true);
  const faellig = karten.filter(istFaellig);
  starteRunde(baueRunde(faellig.length ? faellig : karten, istBegriffe() ? e.anzahlB : e.anzahlF), false);
});

// ---------- Abfrage ----------

let runde = null;

function zeige(bereich) {
  for (const id of ["start", "abfrage", "ende"]) $(id).hidden = id !== bereich;
  window.scrollTo(0, 0);
}

function starteRunde(karten, probe) {
  if (!karten.length) return;
  runde = {
    probe,
    schlange: karten.slice(),
    gesamt: karten.length,
    fertig: 0,
    ersterVersuch: new Map(),   // key -> true/false
    antworten: [],              // nur Probetest: { karte, gewaehlt }
    aktuell: null,
    ergebnis: null,
    optionen: [],
  };
  zeige("abfrage");
  naechsteKarte();
}

function naechsteKarte() {
  if (!runde.schlange.length) return zeigeEnde();
  const karte = runde.schlange.shift();
  runde.aktuell = karte;
  runde.ergebnis = null;
  const v = karte.v;

  $("bereichTippen").hidden = karte.art !== "e-b";
  $("bereichAufdecken").hidden = karte.art !== "b-e";
  $("bereichAuswahl").hidden = karte.art !== "mc";
  $("rueckmeldung").hidden = true;

  const frage = $("frage");
  frage.classList.toggle("gross", karte.art === "b-e");
  if (karte.art === "e-b") {
    $("richtungstext").textContent = "Wie heißt der Begriff?";
    frage.textContent = v.e;
  } else if (karte.art === "b-e") {
    $("richtungstext").textContent = "Was bedeutet …";
    frage.textContent = begriffAnzeige(v);
  } else {
    $("richtungstext").textContent = runde.probe ? "Probetest" : "Wissensfrage";
    frage.textContent = v.f;
  }
  $("herkunft").textContent = herkunftVon(v);
  $("buchseite").textContent = "📖 Buch S. " + v.s;
  const fach = fachVon(karte.key);
  $("fachmarke").hidden = runde.probe;
  $("fachmarke").textContent = runde.ersterVersuch.has(karte.key) ? "Wiederholung" : fach ? "Fach " + fach : "neu";

  if (karte.art === "e-b") {
    const feld = $("antwort");
    feld.value = "";
    feld.disabled = false;
    $("pruefen").disabled = false;
    $("weissNicht").hidden = false;
    feld.focus();
  } else if (karte.art === "b-e") {
    $("aufdecken").focus();
  } else {
    zeichneAuswahl(v);
  }
  zeichneFortschritt();
}

const BUCHSTABEN = ["A", "B", "C", "D"];

function zeichneAuswahl(v) {
  runde.optionen = mische([v.r, ...v.x]);
  const box = $("bereichAuswahl");
  box.innerHTML = "";
  runde.optionen.forEach((text, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = `<span class="bst">${BUCHSTABEN[i]}</span><span></span>`;
    b.lastChild.textContent = text;
    b.addEventListener("click", () => waehle(i));
    box.appendChild(b);
  });
}

function waehle(i) {
  if (runde.ergebnis || runde.aktuell.art !== "mc") return;
  const karte = runde.aktuell;
  const text = runde.optionen[i];
  const richtig = text === karte.v.r;
  const knoepfe = [...$("bereichAuswahl").children];
  knoepfe.forEach(b => { b.disabled = true; });

  if (runde.probe) {
    // keine Rückmeldung – kurz markieren, dann weiter
    knoepfe[i].classList.add("gewaehlt");
    runde.ergebnis = { status: richtig ? "richtig" : "falsch" };
    runde.antworten.push({ karte, gewaehlt: text });
    runde.ersterVersuch.set(karte.key, richtig);
    runde.fertig++;
    setTimeout(naechsteKarte, 350);
    return;
  }

  knoepfe.forEach((b, j) => {
    if (runde.optionen[j] === karte.v.r) b.classList.add("ist-richtig");
    else if (j === i) b.classList.add("ist-falsch");
  });
  runde.ergebnis = { status: richtig ? "richtig" : "falsch", loesung: karte.v.r };
  zeigeRueckmeldung();
}

function zeichneFortschritt() {
  $("fortschrittsbalken").style.width = Math.round(runde.fertig / runde.gesamt * 100) + "%";
  $("zaehler").textContent = `${runde.fertig} / ${runde.gesamt}`;
}

function werteAusTippen(eingabe) {
  if (runde.ergebnis) return;
  runde.ergebnis = pruefeBegriff(runde.aktuell.v, eingabe);
  $("antwort").disabled = true;
  $("pruefen").disabled = true;
  $("weissNicht").hidden = true;
  zeigeRueckmeldung();
}

const LOB = ["Richtig!", "Super!", "Klasse!", "Genau!", "Stark!", "Perfekt!"];

function zeigeRueckmeldung() {
  const karte = runde.aktuell;
  const v = karte.v;
  const e = runde.ergebnis;
  const rm = $("rueckmeldung");
  const selbst = karte.art === "b-e";

  rm.className = "rueckmeldung " + (selbst ? "neutral" : e.status);
  if (selbst) {
    $("rmTitel").textContent = "Bedeutung:";
    $("rmLoesung").textContent = v.e;
  } else if (karte.art === "mc") {
    $("rmTitel").textContent = e.status === "richtig" ? LOB[Math.floor(Math.random() * LOB.length)] : "Leider nicht. Richtig ist:";
    $("rmLoesung").textContent = e.status === "richtig" ? "" : v.r;
  } else {
    $("rmTitel").textContent = e.status === "richtig" ? LOB[Math.floor(Math.random() * LOB.length)]
      : e.status === "fast" ? "Fast! Schau dir die Schreibweise an:" : "Leider nicht. Gesucht war:";
    $("rmLoesung").textContent = e.loesung;
  }
  $("rmLoesung").hidden = !$("rmLoesung").textContent;
  $("rmTipp").hidden = !e || !e.tipp;
  $("rmTipp").textContent = (e && e.tipp) || "";

  const zusatz = karte.art === "mc" ? v.e : v.bsp;
  $("rmErkl").hidden = !zusatz;
  $("rmErklEtikett").textContent = karte.art === "mc" ? "Erklärung" : "Beispiel";
  $("rmErklText").textContent = zusatz || "";
  $("rmSeite").textContent = "📖 Nachlesen: Buch S. " + v.s;

  $("reiheWeiter").hidden = selbst;
  $("reiheSelbst").hidden = !selbst;
  $("dochRichtig").hidden = karte.art !== "e-b" || e.status === "richtig" || !norm($("antwort").value);
  rm.hidden = false;
  (selbst ? $("gewusst") : $("weiter")).focus();
}

function buche(richtig) {
  const karte = runde.aktuell;
  if (!runde.ersterVersuch.has(karte.key)) {
    runde.ersterVersuch.set(karte.key, richtig);
    const alt = stand.karten[karte.key] || { fach: 0, richtig: 0, falsch: 0 };
    // neue Karten, die auf Anhieb sitzen, rücken gleich in Fach 2
    const fach = richtig ? Math.min(5, Math.max(alt.fach, 1) + 1) : 1;
    stand.karten[karte.key] = {
      fach,
      faellig: heute() + FACH_TAGE[fach],
      richtig: alt.richtig + (richtig ? 1 : 0),
      falsch: alt.falsch + (richtig ? 0 : 1),
    };
    speichere();
  }
  if (richtig) {
    runde.fertig++;
  } else {
    // falsch beantwortete Karten kommen in dieser Runde noch einmal
    runde.schlange.splice(Math.min(3, runde.schlange.length), 0, karte);
  }
}

$("formular").addEventListener("submit", ev => { ev.preventDefault(); werteAusTippen($("antwort").value); });
$("weissNicht").addEventListener("click", () => werteAusTippen(""));
$("aufdecken").addEventListener("click", () => { runde.ergebnis = { status: "neutral" }; zeigeRueckmeldung(); });
$("weiter").addEventListener("click", () => { buche(runde.ergebnis.status === "richtig"); naechsteKarte(); });
$("gewusst").addEventListener("click", () => { buche(true); naechsteKarte(); });
$("nichtGewusst").addEventListener("click", () => { buche(false); naechsteKarte(); });
$("dochRichtig").addEventListener("click", () => {
  runde.ergebnis = { ...runde.ergebnis, status: "richtig", tipp: "" };
  zeigeRueckmeldung();
});
$("beenden").addEventListener("click", () => {
  const frage = runde.probe
    ? "Probetest abbrechen? Das Ergebnis wird nicht gespeichert."
    : "Runde beenden? Was du schon beantwortet hast, bleibt gespeichert.";
  if (runde.fertig === 0 || confirm(frage)) {
    if (runde.probe) { zeichneStart(); zeige("start"); } else zeigeEnde();
  }
});

// Tastatur: 1–4 bzw. A–D für Multiple Choice, Enter für „Weiter“
document.addEventListener("keydown", ev => {
  if ($("abfrage").hidden || !runde || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (runde.aktuell && runde.aktuell.art === "mc" && !runde.ergebnis) {
    const i = "1234".indexOf(ev.key) >= 0 ? "1234".indexOf(ev.key) : "abcd".indexOf(ev.key.toLowerCase());
    if (i >= 0 && i < runde.optionen.length) { ev.preventDefault(); waehle(i); }
  }
});

// ---------- Ende ----------

function zeigeEnde() {
  const versuche = [...runde.ersterVersuch.values()];
  const richtig = versuche.filter(Boolean).length;
  const gesamt = versuche.length;
  const quote = gesamt ? richtig / gesamt : 0;
  $("endeBild").textContent = !gesamt ? "👋" : quote === 1 ? "🏆" : quote >= 0.8 ? "🎉" : quote >= 0.5 ? "👍" : "💪";
  $("endeZahl").textContent = !gesamt ? "Nichts beantwortet"
    : runde.probe ? `${richtig} von ${gesamt} Punkten (${Math.round(quote * 100)} %)`
    : `${richtig} von ${gesamt} beim ersten Versuch richtig`;
  $("endeText").textContent = !gesamt ? "" : quote === 1 ? "Alles gewusst – großartig!"
    : quote >= 0.8 ? "Sehr gut gemacht!" : quote >= 0.5 ? "Gut! Den Rest schaffst du auch noch."
    : "Dranbleiben – mit jeder Runde bleibt mehr hängen.";

  const ul = $("endeListe");
  ul.innerHTML = "";
  runde.falsche = [];
  if (runde.probe) {
    // Probetest: alle Fragen mit Auflösung
    if (gesamt) {
      stand.tests.push({ datum: new Date().toLocaleDateString("de-DE"), themen: themenText(runde.antworten), richtig, gesamt });
      stand.tests = stand.tests.slice(-20);
      speichere();
    }
    for (const { karte, gewaehlt } of runde.antworten) {
      const ok = gewaehlt === karte.v.r;
      if (!ok) runde.falsche.push(karte);
      ul.appendChild(eintrag(karte.v.f, ok, karte.v.r, ok ? "" : gewaehlt, karte.v.e, karte.v.s));
    }
    $("endeListeTitel").textContent = "Auflösung";
  } else {
    for (const [key, ok] of runde.ersterVersuch) {
      if (ok) continue;
      const karte = kartenNachKey(key);
      if (!karte) continue;
      runde.falsche.push(karte);
      const v = karte.v;
      if (karte.art === "mc") ul.appendChild(eintrag(v.f, null, v.r, "", "", v.s));
      else ul.appendChild(eintrag(begriffAnzeige(v), null, v.e, "", "", v.s));
    }
    $("endeListeTitel").textContent = "Das üben wir nochmal";
  }
  $("endeListeBox").hidden = !ul.children.length;
  $("nurFehler").hidden = !runde.falsche.length;
  zeige("ende");
  $("zumStart").focus();
}

function eintrag(frage, ok, richtig, falsch, erkl, seite) {
  const li = document.createElement("li");
  const s = document.createElement("div"); s.className = "s"; s.textContent = "📖 S. " + seite; li.appendChild(s);
  const f = document.createElement("div");
  f.className = "f" + (ok === true ? " ok" : ok === false ? " nok" : "");
  f.textContent = frage;
  li.appendChild(f);
  if (falsch) { const d = document.createElement("div"); d.className = "d"; d.textContent = falsch; li.appendChild(d); }
  const r = document.createElement("div"); r.className = "r"; r.textContent = richtig; li.appendChild(r);
  if (erkl) { const e = document.createElement("div"); e.className = "e"; e.textContent = erkl; li.appendChild(e); }
  return li;
}

function themenText(antworten) {
  if (nachSeiten()) return seitenText(stand.einstellungen.seiteVon, stand.einstellungen.seiteBis);
  const nr = [...new Set(antworten.map(a => KAPITEL[a.karte.v.ab].nr))].sort((a, b) => a - b);
  return nr.map(kapitelName).join(", ");
}

function kartenNachKey(key) {
  const f = FRAGEN.find(x => x.id === key);
  if (f) return { v: f, art: "mc", key };
  const trenner = key.lastIndexOf("|");
  const v = BEGRIFFE.find(x => x.id === key.slice(0, trenner));
  return v ? { v, art: key.slice(trenner + 1), key } : null;
}

// „Fehler nochmal üben“ ist immer eine Übungsrunde, auch nach einem Probetest
$("nurFehler").addEventListener("click", () => starteRunde(mische(runde.falsche), false));
$("zumStart").addEventListener("click", () => { zeichneStart(); zeige("start"); });

// ---------- Fortschritt sichern / laden ----------

$("sichern").addEventListener("click", () => {
  const d = new Date();
  const datum = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const inhalt = JSON.stringify({ app: APP, version: 1, gesichert: datum, stand }, null, 1);
  const url = URL.createObjectURL(new Blob([inhalt], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = `politikbuch-fortschritt-${datum}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

$("laden").addEventListener("click", () => $("datei").click());
$("datei").addEventListener("change", async ev => {
  const datei = ev.target.files[0];
  ev.target.value = "";
  if (!datei) return;
  try {
    const d = JSON.parse(await datei.text());
    if (d.app !== APP || !d.stand || !d.stand.karten) throw new Error();
    if (!confirm(`Fortschritt vom ${d.gesichert || "?"} laden? Der jetzige Stand wird ersetzt.`)) return;
    stand = { karten: d.stand.karten, tests: d.stand.tests || [], einstellungen: { ...leererStand().einstellungen, ...d.stand.einstellungen } };
    speichere();
    zeichneStart();
  } catch (e) {
    alert("Diese Datei ist keine Fortschritts-Sicherung vom Politik-Buch Trainer.");
  }
});

$("zuruecksetzen").addEventListener("click", () => {
  if (!confirm("Wirklich den ganzen Fortschritt löschen? Karteikasten und Probetest-Ergebnisse fangen wieder bei null an.")) return;
  stand = { ...leererStand(), einstellungen: stand.einstellungen };
  speichere();
  zeichneStart();
});

// ---------- Start ----------

{
  const e = stand.einstellungen;
  // anfangs ist alles ausgewählt
  if (!Array.isArray(e.auswahl)) e.auswahl = KAPITELLISTE.flatMap(t => t.abschnitte.map(a => a.key));
  if (!e.seiteVon || !e.seiteBis) { e.seiteVon = ERSTE_SEITE; e.seiteBis = LETZTE_SEITE; }
  if (!["kapitel", "seiten"].includes(e.gruppierung)) e.gruppierung = "kapitel";
}
zeichneStart();
</script>
