an wählt die Person direkt, indem man ihren Namen angibt.","bsp":"Ihr schreibt den Namen eures Klassensprechers selbst auf den Zettel."},{"id":"b|2|freie wahl","ab":9,"s":43,"b":"freie Wahl|frei","e":"Man darf selbst entscheiden, wen man wählt, und niemand darf zur Stimmabgabe gezwungen werden.","bsp":""},{"id":"b|2|gleiche wahl","ab":9,"s":43,"b":"gleiche Wahl|gleich","e":"Jede Stimme zählt genauso viel wie jede andere.","bsp":""},{"id":"b|2|geheime wahl","ab":9,"s":43,"b":"geheime Wahl|geheim","e":"Niemand darf gezwungen werden, seine Wahlentscheidung offenzulegen.","bsp":"Man faltet den Stimmzettel, damit keiner sieht, wen man gewählt hat."},{"id":"b|2|recht","ab":10,"s":45,"b":"Recht|Rechte","e":"Eine garantierte Freiheit, die man hat.","bsp":"Schülerinnen und Schüler dürfen eine Schülerzeitung herausgeben."},{"id":"b|2|pflicht","ab":10,"s":45,"b":"Pflicht|Pflichten","e":"Sie setzt der Freiheit Grenzen, sorgt aber auch dafür, dass die Freiheiten aller geschützt sind.","bsp":"Man muss regelmäßig am Unterricht teilnehmen."},{"id":"b|2|schulgesetz","ab":10,"s":45,"b":"Schulgesetz","e":"Gesetz eines Bundeslandes, in dem die Rechte und Pflichten von Schülern, Lehrkräften und Eltern grundsätzlich geregelt sind. Es wird im Landesparlament beschlossen.","bsp":"Das Schulgesetz für Nordrhein-Westfalen"},{"id":"b|2|erlass","ab":10,"s":45,"b":"Erlass|Erlasse","e":"Regelung, die sich auf das Schulgesetz bezieht und genauer ausführt, wie einzelne Regeln in der Praxis umgesetzt werden (ähnlich wie Verordnungen).","bsp":"Der SV-Erlass regelt, wie Schüler bei der Schule mitwirken können."},{"id":"b|2|schulordnung","ab":10,"s":45,"b":"Schulordnung|Hausordnung","e":"Regeln speziell für die eigene Schule, die von der Schulkonferenz beschlossen werden.","bsp":""},{"id":"b|2|klassenregeln","ab":10,"s":45,"b":"Klassenregeln","e":"Regeln, die Lehrkräfte und Schüler einer einzelnen Klasse selbst vereinbaren. Sie dürfen der Schulordnung und dem Schulgesetz nicht widersprechen.","bsp":""},{"id":"b|2|schulpflicht","ab":10,"s":45,"b":"Schulpflicht","e":"Im Schulgesetz festgelegte Pflicht, regelmäßig am Unterricht teilzunehmen.","bsp":"Eine Klasse darf nicht beschließen, dass der Unterricht freiwillig ist."},{"id":"b|2|tagesordnungspunkt","ab":11,"s":48,"b":"Tagesordnungspunkt|TOP|Top","e":"Ein einzelnes Thema, das in einer Sitzung nach einer festen Reihenfolge besprochen wird.","bsp":"Top 1: Rückblick auf die Aktivitäten im vergangenen Schuljahr"},{"id":"b|2|schülervertretung","ab":11,"s":50,"b":"Schülervertretung|SV","e":"Sie nimmt die Rechte der Schülerinnen und Schüler wahr und vertritt ihre Interessen. Sie ist Aufgabe aller Schüler.","bsp":"Sie organisiert z. B. ein Schulfest oder eine Pflanzaktion."},{"id":"b|2|klassensprecher","ab":11,"s":50,"b":"Klassensprecher|Klassensprecherin|Klassensprecherinnen","e":"Gewählte Vertretung einer Klasse: kümmert sich um Wünsche und Sorgen der Klasse und vertritt sie im Schülerrat.","bsp":""},{"id":"b|2|schülersprecher","ab":11,"s":50,"b":"Schülersprecher|Schülersprecherin","e":"Vertritt die Interessen aller Schülerinnen und Schüler einer Schule, beruft den Schülerrat ein und leitet seine Sitzungen.","bsp":""},{"id":"b|2|schülerrat","ab":11,"s":50,"b":"Schülerrat","e":"Gremium aus allen Klassensprecherinnen und Klassensprechern einer Schule. Es ist für alle Fragen der SV zuständig.","bsp":""},{"id":"b|2|schulkonferenz","ab":11,"s":50,"b":"Schulkonferenz","e":"Oberstes Mitwirkungsgremium der Schule, in dem Schüler, Eltern und Lehrkräfte gleich viele Vertreter haben.","bsp":"Sie beschließt die Schulordnung."},{"id":"b|2|sv-erlass","ab":11,"s":50,"b":"SV-Erlass","e":"Regelung des Schulministeriums, die beschreibt, wie die Mitwirkungsrechte der Schüler in den Schulen ausgeübt werden.","bsp":"Er regelt auch die Wahl der Schülersprecher und die SV-Stunden."},{"id":"b|2|diskussion","ab":12,"s":53,"b":"Diskussion","e":"Ein Gespräch, in dem unterschiedliche Meinungen und Ideen zu einem Thema ausgetauscht werden.","bsp":"Die Klasse spricht darüber, wie die Schülersprecher gewählt werden sollen."},{"id":"b|2|diskussionsleitung","ab":12,"s":53,"b":"Diskussionsleitung","e":"Person, die eine Diskussion leitet und darauf achtet, dass die Regeln eingehalten werden.","bsp":"Bei den ersten Übungen übernimmt das die Lehrkraft."},{"id":"b|2|respekt","ab":12,"s":53,"b":"Respekt","e":"Haltung, die anderen ihre eigene Meinung zugesteht; Voraussetzung für faire Diskussionen.","bsp":""},{"id":"b|2|sv-stunde","ab":13,"s":54,"b":"SV-Stunde|SV-Verfügungsstunde","e":"Eine Stunde im Monat während der Unterrichtszeit, in der die Klasse alles bespricht, was für die Klassengemeinschaft wichtig ist.","bsp":"Die 6c bespricht dort zu viele Hausaufgaben und Störungen im Unterricht."},{"id":"b|2|regel-coach","ab":13,"s":54,"b":"Regel-Coach|Regelcoach","e":"Person, die in der Sitzung darauf achtet, dass alle drankommen, die sich melden, und dass die vereinbarten Regeln eingehalten werden.","bsp":"In der 6c ist das der stellvertretende Klassensprecher Nazar."},{"id":"b|2|kummer-briefkasten","ab":13,"s":54,"b":"Kummer-Briefkasten|Kummerkasten|Kummerbriefkasten","e":"Kiste, in die alle Zettel mit Themen und Wünschen werfen können – mit oder ohne Namen. Sie werden in der nächsten Sitzung besprochen.","bsp":"Eine Kiste auf der Fensterbank der 6c"},{"id":"b|2|mehrheit","ab":14,"s":57,"b":"Mehrheit","e":"Der größere Teil einer Gruppe; in der Demokratie entscheidet er nach einer Abstimmung.","bsp":"Elf Kinder der 6b stimmen für den Biohof – so wird es entschieden."},{"id":"b|2|minderheit","ab":14,"s":57,"b":"Minderheit","e":"Der kleinere Teil einer Gruppe, der bei einer Abstimmung unterlegen ist. Diese Menschen sind trotzdem genauso viel wert.","bsp":""},{"id":"b|2|meinungsfreiheit","ab":14,"s":57,"b":"Meinungsfreiheit","e":"Das Recht aller Menschen, sich eine eigene Meinung zu bilden und diese frei zu äußern.","bsp":"In der Schule darf man seine Meinung in Wort, Schrift und Bild äußern."},{"id":"b|2|glaubensfreiheit","ab":14,"s":57,"b":"Glaubensfreiheit","e":"Das Recht, selbst zu entscheiden, woran man glaubt. Der Staat darf es nicht wegnehmen.","bsp":""},{"id":"b|3|urvertrauen","ab":17,"s":62,"b":"Urvertrauen","e":"Grundgefühl eines Kindes, geborgen, geliebt und willkommen zu sein. Dadurch kann es Vertrauen zu anderen Menschen entwickeln und eine positive Einstellung zum Leben bekommen.","bsp":"Eine Familie gibt einem Baby Liebe und Zuwendung."},{"id":"b|3|bezugsperson","ab":17,"s":62,"b":"Bezugsperson|Bezugspersonen","e":"Mensch, der ein kleines Kind liebevoll umsorgt und dem das Kind vertraut. Meist sind es die leiblichen Eltern, es können aber auch andere sein.","bsp":"Eine Pflegemutter, die mit dem Kind zusammenlebt"},{"id":"b|3|amme","ab":17,"s":62,"b":"Amme|Ammen","e":"Frau, die früher fremde Säuglinge versorgt, gesäubert und ernährt hat.","bsp":"Kaiser Friedrich II. ließ Säuglinge von solchen Pflegerinnen versorgen."},{"id":"b|3|zuwendung","ab":17,"s":62,"b":"Zuwendung","e":"Liebe und Aufmerksamkeit, die man einem Menschen schenkt: mit ihm sprechen, ihn in den Arm nehmen, ihn trösten.","bsp":"Ohne sie können Babys krank werden und verkümmern."},{"id":"b|3|regenbogenfamilie","ab":18,"s":64,"b":"Regenbogenfamilie","e":"Familie mit Kindern, in der zwei Frauen oder zwei Männer als Paar zusammenleben.","bsp":"Ein Baby wächst bei zwei Müttern auf."},{"id":"b|3|alleinerziehende","ab":18,"s":64,"b":"Alleinerziehende|alleinerziehend|Alleinerziehender","e":"Mutter oder Vater, die ohne Partner mit ihrem Kind oder ihren Kindern zusammenleben.","bsp":"Simon lebt seit der Scheidung bei seiner Mutter."},{"id":"b|3|familie","ab":18,"s":65,"b":"Familie","e":"Eltern und Kinder, die gemeinsam in einem Haushalt leben. Aus Sicht von Eltern und Kindern: eine Gemeinschaft, in der man Glück und Geborgenheit sucht, den Alltag gemeinsam organisiert und füreinander einsteht.","bsp":"Ein Ehepaar mit zwei Kindern oder eine alleinerziehende Mutter mit Kind"},{"id":"b|3|lebensgemeinschaft","ab":18,"s":65,"b":"Lebensgemeinschaft","e":"So nennt man Paare ohne Kinder und ältere Ehepaare, deren Kinder schon ausgezogen sind. Sie werden nicht als Familie gezählt.","bsp":"Ein Ehepaar, dessen Kinder in eine eigene Wohnung gezogen sind"},{"id":"b|3|patchworkfamilie","ab":18,"s":65,"b":"Patchworkfamilie|Patchwork-Familie|Fortsetzungsfamilie|Stieffamilie","e":"Familie, in der Kinder aus früheren Ehen oder Partnerschaften mit einem neuen Partner von Mutter oder Vater zusammenleben.","bsp":"Judith lebt mit ihrem Halbbruder Marc zusammen, der einen anderen Vater hat."},{"id":"b|3|adoptiertes kind","ab":18,"s":65,"b":"adoptiertes Kind|Adoptivkind|Adoption","e":"Ein fremdes Kind, das von einer Familie aufgenommen wurde und dort wie ein eigenes Kind aufwächst.","bsp":"Familie Steffens hat zwei eigene Kinder und ein aufgenommenes Kind."},{"id":"b|3|gleichberechtigung","ab":18,"s":65,"b":"Gleichberechtigung","e":"Frauen und Männer haben die gleichen Rechte. Viele Frauen haben heute eine gute Ausbildung und sind nicht mehr vom Geld ihres Ehepartners abhängig.","bsp":""},{"id":"b|3|großfamilie","ab":19,"s":70,"b":"Großfamilie","e":"Familie, in der Kinder, Eltern, Großeltern und manchmal sogar Urgroßeltern zusammen in einem Haus leben.","bsp":"Auf dem Land in China"},{"id":"b|3|kleinfamilie","ab":19,"s":70,"b":"Kleinfamilie","e":"Familie, die nur aus Eltern und ihren Kindern besteht, meist mit wenigen Personen.","bsp":"In chinesischen Städten bestehen sechs von zehn Familien nur aus drei bis vier Personen."},{"id":"b|3|binnenland","ab":19,"s":70,"b":"Binnenland","e":"Land, das ringsum von anderen Ländern umgeben ist und keine Küste am Meer hat.","bsp":"Burkina Faso in Afrika"},{"id":"b|3|rolle","ab":20,"s":72,"b":"Rolle","e":"Ein Verhalten, das den allgemeinen Vorstellungen davon entspricht, wie sich ein Mensch gegenüber anderen verhalten soll.","bsp":"Die Mutterrolle, die Vaterrolle oder die Rolle als Tochter oder Sohn"},{"id":"b|3|rollenerwartung","ab":20,"s":72,"b":"Rollenerwartung|Rollenerwartungen","e":"Vorstellung davon, wie sich zum Beispiel Mütter, Väter oder Kinder verhalten sollen. Sie hat oft eine lange Tradition, kann sich aber ändern.","bsp":"Früher dachte man: Väter kümmern sich nicht um die Erziehung, Mütter machen den Haushalt allein."},{"id":"b|3|hausmann","ab":20,"s":72,"b":"Hausmann","e":"Mann, der zu Hause den Haushalt erledigt und sich um die Kinder kümmert, während die Frau arbeiten geht.","bsp":"Arno Schaminski kauft ein, kocht, bügelt und putzt."},{"id":"b|3|konflikt","ab":20,"s":72,"b":"Konflikt","e":"Das Wort bedeutet „Zusammenstoß“. Es bezeichnet eine Auseinandersetzung, die entsteht, wenn Menschen oder Gruppen aufeinander treffen, die unterschiedliche Interessen vertreten. Die streitenden Parteien versuchen dann, mit Argumenten und mit Macht den Streit siegreich zu beenden. Oft gelten solche Auseinandersetzungen als unvermeidlich, zum Beispiel wenn alljährlich die Vertreter der Arbeitgeber und Arbeitnehmer über die Höhe der Löhne streiten. In der Demokratie gilt so ein Streit nicht als etwas Schlechtes. Wichtig ist, dass er mit friedlichen und fairen Mitteln zu einem vernünftigen Ausgleich gebracht wird.","bsp":""},{"id":"b|3|rollenspiel","ab":20,"s":74,"b":"Rollenspiel","e":"Spiel, bei dem man in die Haut einer anderen Person schlüpft. Anders als beim Theater ist nichts fest vorgeschrieben – man überlegt selbst, wie sich die Person verhalten würde.","bsp":"Familie Schaminski streitet über die Verteilung der Hausarbeit."},{"id":"b|3|kindergeld","ab":21,"s":77,"b":"Kindergeld","e":"Geld, das alle Familien unabhängig vom Einkommen jeden Monat für jedes Kind vom Staat bekommen.","bsp":""},{"id":"b|3|kindergrundsicherung","ab":21,"s":77,"b":"Kindergrundsicherung","e":"Name für alle Geldleistungen, die Familien mit geringem Einkommen zusätzlich bekommen, z. B. Zuschüsse für Lernmittel und Nachhilfe.","bsp":""},{"id":"b|3|elterngeld","ab":21,"s":77,"b":"Elterngeld","e":"Geld vom Staat, damit berufstätige Eltern nach der Geburt eines Kindes ein Jahr und länger zu Hause bleiben können.","bsp":"Meret konnte im ersten Jahr beim Kind bleiben."},{"id":"b|3|mutterschutz","ab":21,"s":77,"b":"Mutterschutz","e":"Besondere Schutzvorschriften für berufstätige Frauen in der Schwangerschaft: Sechs Wochen vor bis acht Wochen nach der Geburt dürfen sie nicht arbeiten und bekommen ihren Lohn trotzdem weiter.","bsp":""},{"id":"b|3|krippenplatz","ab":21,"s":77,"b":"Krippenplatz|Kitaplatz","e":"Platz in einer Kita für ein kleines Kind. Ab dem ersten Geburtstag haben Eltern ein Recht darauf und können sonst klagen.","bsp":"Emilian geht seit seinem ersten Geburtstag in eine städtische Kita."},{"id":"b|3|kindertagesstätte","ab":21,"s":78,"b":"Kindertagesstätte|Kita|Kindertagesstätten","e":"Einrichtung, in der kleine Kinder tagsüber betreut werden, während die Eltern arbeiten. Dort lernen sie wichtige soziale Verhaltensweisen.","bsp":"Partei A will mehr Geld für Bau und Ausstattung."},{"id":"b|3|meinungsfreiheit","ab":21,"s":79,"b":"Meinungsfreiheit","e":"Grundrecht, dass jeder seine Meinung in Wort, Schrift und Bild frei äußern und verbreiten darf. Ohne dieses Recht gibt es keine Demokratie.","bsp":"Artikel 5 des Grundgesetzes"},{"id":"b|3|grundgesetz","ab":21,"s":79,"b":"Grundgesetz","e":"Das wichtigste Gesetzbuch in Deutschland. Ganz vorne stehen die Grundrechte.","bsp":"Artikel 5: die Meinungsfreiheit"},{"id":"b|4|unicef","ab":24,"s":85,"b":"UNICEF","e":"Kinderhilfswerk der Vereinten Nationen; es will die Situation von Kindern weltweit verbessern, vor allem in Ländern mit Krieg und Armut.","bsp":"Eröffnet Kinderzentren und Schulen und schützt vor Hunger und Krankheit."},{"id":"b|4|vereinte nationen","ab":24,"s":85,"b":"Vereinte Nationen|UNO","e":"Staatengemeinschaft, zu der nahezu alle Staaten der Welt gehören (englisch: United Nations Organization).","bsp":"Sitz in New York; zu ihr gehört das Kinderhilfswerk UNICEF."},{"id":"b|4|filmanalyse","ab":24,"s":87,"b":"Filmanalyse","e":"Methode, bei der man einen Filmbeitrag systematisch untersucht und auswertet – mit Blick auf Bild, Ton, Sprache und Schnitt.","bsp":"Schritte: Was wird gesagt? Was wird gezeigt? Wie gut sind Inhalt und Form?"},{"id":"b|4|arbeit","ab":25,"s":88,"b":"Arbeit","e":"Alle Tätigkeiten, die man verrichtet, um damit Geld zu verdienen.","bsp":""},{"id":"b|4|kinderarbeit","ab":25,"s":89,"b":"Kinderarbeit","e":"Arbeit von Kindern; schädlich ist sie, wenn sie gefährlich ist, die Gesundheit schädigt oder den Schulbesuch verhindert.","bsp":"Kinder sammeln Kakaofrüchte mit scharfen Macheten und schleppen schwere Säcke."},{"id":"b|4|jugendarbeitsschutzgesetz","ab":25,"s":89,"b":"Jugendarbeitsschutzgesetz","e":"Gesetz, das in Deutschland Kinderarbeit für alle unter 15 Jahren verbietet (mit einigen Ausnahmen).","bsp":"Ab 13 erlaubt: z. B. Zeitungen austragen, ca. zwei Stunden am Tag."},{"id":"b|4|internationale arbeitsorganisation","ab":25,"s":90,"b":"Internationale Arbeitsorganisation|ILO","e":"Organisation der Vereinten Nationen; sie verlangt als Mindestanforderung, dass kein Kind unter 13 Jahren regelmäßig arbeiten muss.","bsp":"Sie schätzt, dass über 87 Millionen Kinder in Afrika südlich der Sahara betroffen sind."},{"id":"b|4|kinderarmut","ab":26,"s":92,"b":"Kinderarmut","e":"Wenn Kinder in Familien aufwachsen, denen es vor allem an Geld fehlt – sie ist in der Regel Familienarmut.","bsp":"Etwa jedes fünfte Kind in Deutschland ist betroffen."},{"id":"b|4|armutsgefährdet","ab":26,"s":93,"b":"armutsgefährdet","e":"So nennt man Familien, bei denen das Geld sehr knapp ist, die aber nicht völlig ohne alles sind und auf Besserung hoffen können.","bsp":""},{"id":"b|4|ausgrenzung","ab":26,"s":93,"b":"Ausgrenzung","e":"Wenn andere auf jemanden herabblicken und ihn spüren lassen, dass er nicht dazugehört.","bsp":"Ein Kind wird ausgelacht, weil es keine teure Kleidung trägt."},{"id":"b|4|kinderrechte","ab":27,"s":94,"b":"Kinderrechte","e":"Besondere Rechte, die alle Menschen unter 18 Jahren haben, einfach weil sie Kinder sind.","bsp":"Recht auf Schutz vor Gewalt, Recht auf Bildung, Recht auf Mitbestimmung."},{"id":"b|4|schutzrechte","ab":27,"s":94,"b":"Schutzrechte","e":"Kinderrechte, die Kinder vor körperlicher und seelischer Gewalt oder vor Ausbeutung schützen sollen.","bsp":""},{"id":"b|4|förderrechte","ab":27,"s":94,"b":"Förderrechte","e":"Kinderrechte, die sicherstellen, dass Kinder gesund aufwachsen – mit Blick auf Gesundheit, Ernährung, Bildung und Lebensstandard.","bsp":""},{"id":"b|4|beteiligungsrechte","ab":27,"s":94,"b":"Beteiligungsrechte","e":"Kinderrechte, nach denen Kinder angehört und ihre Meinung und Vorstellungen beachtet werden müssen.","bsp":""},{"id":"b|4|kindersterblichkeit","ab":27,"s":94,"b":"Kindersterblichkeit","e":"Wie viele Kinder vor ihrem fünften Geburtstag sterben.","bsp":"2022 waren es weltweit etwa 4,9 Millionen – halb so viele wie im Jahr 2000."},{"id":"b|4|sustainable development goals","ab":28,"s":96,"b":"Sustainable Development Goals|SDGs|Ziele für nachhaltige Entwicklung","e":"Programm der Vereinten Nationen von 2015 mit 17 Zielen für eine bessere Welt, die bis 2030 erreicht sein sollten.","bsp":"Keine Armut, Kein Hunger, Hochwertige Bildung …"},{"id":"b|4|bildung","ab":28,"s":97,"b":"Bildung","e":"Sie vermittelt Grundfertigkeiten wie Lesen, Schreiben und Rechnen und gilt als Schlüssel zur Überwindung von Armut.","bsp":"Abu Fullah würde lieber in die Schule gehen, statt auf dem Markt zu helfen."},{"id":"b|4|mündig","ab":28,"s":97,"b":"mündig","e":"selbstbestimmt, selbstständig","bsp":"Bildung schafft solche Bürgerinnen und Bürger, die für ihre Rechte eintreten."},{"id":"b|4|zukunftswerkstatt","ab":28,"s":98,"b":"Zukunftswerkstatt","e":"Methode, mit der eine Gruppe gemeinsam eine Vorstellung von einer besseren Zukunft entwickelt und plant – in fünf Schritten.","bsp":"Thema: Wie kann eine bessere Welt für Kinder aussehen?"},{"id":"b|4|fantasie","ab":28,"s":98,"b":"Fantasie","e":"Die Vorstellungskraft von etwas, was es noch nicht wirklich gibt.","bsp":"Kinder haben davon oft mehr als Erwachsene."},{"id":"b|5|vorurteil","ab":31,"s":105,"b":"Vorurteil","e":"Eine Meinung, die man sich bildet, ohne die Sache wirklich zu kennen.","bsp":"Du isst keinen Spinat, nur weil deine Schwester sagt, er sei eklig."},{"id":"b|5|stereotyp","ab":31,"s":105,"b":"Stereotyp|Stereotype","e":"Ein festes und sehr einfaches Urteil über eine ganze Gruppe von Menschen – wie eine Schublade im Gehirn.","bsp":"„Erstklässler können das noch nicht.“"},{"id":"b|5|schubladendenken","ab":31,"s":106,"b":"Schubladendenken","e":"Wenn man Menschen wegen Vorurteilen in feste Gruppen einsortiert, statt sie als einzigartige Persönlichkeit zu sehen.","bsp":"Ein Bewerber mit lila Haaren und Piercings wird trotz guter Qualifikation nicht eingestellt."},{"id":"b|5|kompromiss","ab":32,"s":108,"b":"Kompromiss","e":"Eine Entscheidung, die die Interessen aller Beteiligten berücksichtigt.","bsp":""},{"id":"b|5|schreibgespräch","ab":32,"s":109,"b":"Schreibgespräch","e":"Methode, bei der man sich nur schriftlich auf einem gemeinsamen Blatt über ein Thema austauscht – ohne zu sprechen.","bsp":"Thema: Jonathans Traum"},{"id":"b|5|kognitiv","ab":33,"s":110,"b":"kognitiv","e":"Beschreibt geistige Fähigkeiten, die mit Denken, Wissen und Wahrnehmen zu tun haben.","bsp":"Lukas hat eine solche Behinderung nach einer Hirnhautentzündung."},{"id":"b|5|behinderung","ab":33,"s":111,"b":"Behinderung","e":"Eine körperliche oder geistige Beeinträchtigung, durch die Menschen oft auf Hilfe angewiesen sind; sie betrifft nie den ganzen Menschen.","bsp":"Rund 8 Millionen Menschen in Deutschland sind betroffen."},{"id":"b|5|barriere","ab":33,"s":112,"b":"Barriere|Barrieren","e":"Hindernisse, die es Menschen mit Behinderung schwer oder unmöglich machen, überall dabei zu sein.","bsp":"Eine Bordsteinkante für einen Rollstuhlfahrer."},{"id":"b|5|inklusive klasse","ab":34,"s":114,"b":"inklusive Klasse","e":"Klassengemeinschaft, in der Kinder mit und ohne Behinderung gemeinsam unterrichtet werden.","bsp":"Marie-Kahle-Gesamtschule in Bonn"},{"id":"b|5|inklusion","ab":34,"s":115,"b":"Inklusion","e":"Wörtlich „Einbeziehung aller“: Alle Menschen haben das gleiche Recht, am Leben der Gesellschaft teilzunehmen.","bsp":"Menschen mit und ohne Behinderung leben, arbeiten und wohnen gleichberechtigt zusammen."},{"id":"b|5|förderschule","ab":34,"s":115,"b":"Förderschule","e":"Eine Schule nur für Kinder mit Behinderung, an der sie getrennt von anderen Kindern lernen.","bsp":"Lukas besuchte eine solche Schule für geistige Entwicklung."},{"id":"b|5|vielfalt","ab":35,"s":116,"b":"Vielfalt","e":"Wenn Menschen mit ganz unterschiedlicher Herkunft und Religion, mit und ohne Behinderung, junge und ältere Menschen zusammenleben.","bsp":"Unsere Gesellschaft ist sehr vielfältig – das bereichert uns."},{"id":"b|5|diskriminierung","ab":35,"s":116,"b":"Diskriminierung|diskriminieren","e":"Wenn Menschen benachteiligt, herabgesetzt und nicht selten auch beleidigt werden.","bsp":""},{"id":"b|5|allgemeines gleichbehandlungsgesetz","ab":35,"s":116,"b":"Allgemeines Gleichbehandlungsgesetz","e":"Gesetz, das seit 2006 die Gleichbehandlung aller Menschen vorschreibt.","bsp":""},{"id":"b|5|homogen","ab":35,"s":117,"b":"homogen","e":"einheitlich, gleichartig","bsp":"Gemischte Teams lösen Probleme besser als solche Gruppen."},{"id":"b|6|internet","ab":38,"s":122,"b":"Internet","e":"Auf Deutsch kann man es mit Verbundnetz übersetzen. Es ist ein weltweiter elektronischer Verbund von vielen Millionen Computern. Vergleicht man es mit einem Netz, so ist jeder einzelne PC ein Knoten in diesem Netz. Das Verbundsystem ermöglicht es, Daten weltweit zu versenden und auszutauschen.","bsp":""},{"id":"b|6|medium","ab":38,"s":124,"b":"Medium|Medien","e":"Vermittler, mit dem man Informationen, Bilder oder Filme von einer Person zu einer anderen übertragen kann. Die Mehrzahl ist ein Sammelbegriff für all diese Möglichkeiten.","bsp":"Fernsehen, Buch, Radio, Internet"},{"id":"b|6|massenmedien","ab":38,"s":124,"b":"Massenmedien","e":"Vermittler, über die sehr viele Menschen auf dieselben Informationen zugreifen können. Sie wenden sich mit technischen Übertragungsmitteln an ein breites Publikum.","bsp":"Fernsehen, Radio, Zeitung"},{"id":"b|6|analoge medien","ab":38,"s":124,"b":"analoge Medien","e":"Vermittler, die man anfassen und an- oder ausschalten kann. Ihre Inhalte kann man nicht verändern, nur konsumieren. Es gibt sie schon sehr lange.","bsp":"Bücher, Zeitungen, Zeitschriften, Hörbücher"},{"id":"b|6|digitale medien","ab":38,"s":124,"b":"digitale Medien|neue Medien","e":"Vermittler, die mithilfe von Computern und dem Internet funktionieren. Mit ihnen kann man auch selbst Inhalte produzieren.","bsp":"PC, Tablet, Smartphone, Spielkonsole"},{"id":"b|6|soziale medien","ab":38,"s":124,"b":"soziale Medien","e":"Digitale Plattformen, auf denen man mit vielen Menschen Kontakt aufnimmt, Beiträge liest und kommentiert und selbst Texte, Fotos oder Videos teilt. Man ist dort Produzent und Konsument zugleich.","bsp":"Instagram, TikTok"},{"id":"b|6|digitalisierung","ab":38,"s":124,"b":"Digitalisierung","e":"Vereinfacht ausgedrückt bedeutet … die Umwandlung aller Informationen in eine Sprache, die alle Computer in gleicher Weise verstehen. Wörtlich übersetzt heißt der lateinische Begriff digitus Finger oder auch Zahl. Um den Computer zu füttern, werden alle Daten in Zahlenkombinationen, bestehend aus der 0 und der 1, umgewandelt. Fotografiert man zum Beispiel einen Baum und speichert das Foto auf dem Computer, entsteht ein digitales Abbild. Der Baum existiert in der analogen Welt, das Foto davon in der digitalen. Die Erfindung der … war die Voraussetzung für die Entwicklung von Computern.","bsp":""},{"id":"b|6|handysucht","ab":38,"s":125,"b":"Handysucht","e":"Wenn Smartphone oder Computer wichtiger werden als alles andere: Man wird unruhig ohne das Gerät, vernachlässigt Freunde, Hobbys und Schule.","bsp":"Kira trifft ihre Freundinnen nur noch online und ihre Noten werden schlechter."},{"id":"b|6|nutzungskreis","ab":39,"s":126,"b":"Nutzungskreis","e":"Kreis, in dem man zeigt, wofür man Medien nutzt: Wichtiges wird groß gezeichnet, Unwichtiges klein.","bsp":"Felder wie Spielen, Lernen, Unterhaltung, Information"},{"id":"b|6|öffentlich-rechtliche sender","ab":39,"s":127,"b":"öffentlich-rechtliche Sender|öffentlich-rechtliches Fernsehen","e":"Fernsehanstalten mit gesetzlichem Auftrag: Sie sollen informieren, bilden, unterhalten, zur Meinungsbildung beitragen und die Demokratie schützen. Sie werden zu 80 % aus Gebühren und zu 20 % aus Werbung bezahlt.","bsp":"ARD und ZDF"},{"id":"b|6|private sender","ab":39,"s":127,"b":"private Sender|Privatsender","e":"Fernsehsender, die Wirtschaftsunternehmen sind und Gewinne machen wollen. Sie finanzieren sich ausschließlich durch Werbung.","bsp":"RTL, SAT 1, Pro 7"},{"id":"b|6|cybergrooming","ab":39,"s":128,"b":"Cybergrooming|Cyber-Grooming","e":"Wenn Erwachsene online Kontakt zu Kindern und Jugendlichen aus sexuellem Interesse aufnehmen. Das ist strafbar.","bsp":"Ein Fremder macht einem Mädchen im Messenger Komplimente und fordert immer mehr Fotos."},{"id":"b|6|cybermobbing","ab":39,"s":129,"b":"Cybermobbing|Cyber-Mobbing","e":"Wenn jemand über Internet oder Handy immer wieder gehänselt, bloßgestellt oder fertiggemacht wird. Das ist kein harmloser Spaß, sondern strafbar.","bsp":"Peinliche Fotos und ein Video von Carlos werden in der Klassengruppe geteilt."},{"id":"b|6|daten","ab":39,"s":129,"b":"Daten","e":"Das sind Tatsachen, die unabänderlich gegeben sind. Dazu gehören zum Beispiel dein Geburtsdatum, deine Adresse und die Anzahl deiner Familienmitglieder. Auch Zeugnisnoten oder Krankheiten gehören dazu. Solche persönlichen Angaben müssen geschützt werden, weil damit Missbrauch getrieben werden kann, wenn sie in falsche Hände geraten. Ihr Schutz ist ein wichtiges Grundrecht. Im Zeitalter des Internets solltest du genau darauf achten, so wenige persönliche Angaben im Netz zu verbreiten wie möglich.","bsp":""},{"id":"b|6|recherchieren","ab":40,"s":131,"b":"recherchieren","e":"Gezielt nach Informationen suchen, zum Beispiel im Internet.","bsp":"Mit einer Suchmaschine Infos für ein Referat suchen"},{"id":"b|6|suchmaschine","ab":40,"s":131,"b":"Suchmaschine","e":"Programm im Internet, das einem hilft, unter Milliarden Websites die passenden Informationen zu finden.","bsp":"Google, fragFINN"},{"id":"b|6|2-quellen-prinzip","ab":40,"s":131,"b":"2-Quellen-Prinzip|Zwei-Quellen-Prinzip","e":"Regel von Journalisten: Wichtige Informationen aus dem Netz sollte man auf mindestens zwei verschiedenen Seiten finden.","bsp":""},{"id":"b|6|portal","ab":40,"s":132,"b":"Portal|Portale","e":"Einstiegsseite für Nutzer, die zu weiteren Websites führt.","bsp":"fragFINN gibt Linktipps zu solchen Seiten."},{"id":"b|6|chatbot","ab":40,"s":133,"b":"Chatbot","e":"Text- oder Sprachroboter, mit dem man sich unterhalten kann. Er nutzt meist Künstliche Intelligenz. Das Wort kommt von „Unterhaltung“ und „Roboter“.","bsp":"ChatGPT, Bing Copilot, Alexa"},{"id":"b|6|künstliche intelligenz","ab":41,"s":135,"b":"Künstliche Intelligenz|KI|AI|Artificial Intelligence","e":"Technologie, mit der Computer Dinge tun können, für die man sonst menschliche Intelligenz braucht. Der Computer folgt dabei Programmen und Regeln, die Menschen erstellt haben.","bsp":"Suchmaschinen, Chatbots, Spielfiguren in Videospielen"},{"id":"b|6|präsentation","ab":41,"s":137,"b":"Präsentation","e":"Vortrag, mit dem man andere über das informiert, was man sich selbst erarbeitet hat.","bsp":"Vortrag über KI beim Elternabend"},{"id":"b|6|präsentationskompetenz","ab":41,"s":137,"b":"Präsentationskompetenz","e":"Fähigkeit, einen Vortrag gut vorbereitet, verständlich und lebendig zu halten. Sie ist in der Schule und im späteren Leben von großem Vorteil.","bsp":""},{"id":"b|6|lesekompetenz","ab":42,"s":138,"b":"Lesekompetenz","e":"Fähigkeit, Texte zu verstehen, die uns durch die Medien übermittelt werden.","bsp":"YouTube-Film, WhatsApp-Nachricht, Faktencheck oder Mail verstehen"},{"id":"b|6|nachrichtentext","ab":42,"s":139,"b":"Nachrichtentext|Nachricht","e":"Kurzer Text (meist 10 bis 20 Zeilen) mit Neuigkeiten, die für viele Menschen interessant sind. Er enthält nur Informationen und keine persönliche Meinung.","bsp":"„Brüllaffen fallen tot von den Bäumen“"},{"id":"b|6|presseagentur","ab":42,"s":139,"b":"Presseagentur","e":"Unternehmen, das Nachrichtentexte schreibt, die dann in verschiedenen Medien veröffentlicht werden.","bsp":"dpa"},{"id":"b|6|analysieren","ab":42,"s":139,"b":"analysieren","e":"Etwas unter einer bestimmten Fragestellung sehr genau untersuchen.","bsp":"Eine Nachricht mit den W-Fragen genau untersuchen"},{"id":"b|6|w-fragen-methode","ab":42,"s":139,"b":"W-Fragen-Methode","e":"Methode, mit der man Nachrichten untersucht, indem man fragt: Was? Wann? Wo? Wie? Wer? Warum?","bsp":""},{"id":"b|6|pressefreiheit","ab":43,"s":143,"b":"Pressefreiheit","e":"Recht, in Zeitungen und anderen Medien frei zu berichten und die eigene Meinung in Wort, Schrift und Bild zu äußern – mit Grenzen wie dem Schutz der persönlichen Ehre.","bsp":"Schülerinnen und Schüler dürfen eine Schülerzeitung gestalten und verbreiten (§ 45 Schulgesetz NRW)."},{"id":"b|6|presse","ab":43,"s":143,"b":"Presse","e":"Früher die Bezeichnung für alle gedruckten Medien. Heute zählen auch Online-Medien dazu.","bsp":"Zeitungen, Zeitschriften, Online-Nachrichtenseiten"},{"id":"b|6|recht am eigenen bild","ab":43,"s":143,"b":"Recht am eigenen Bild","e":"Fotos von Personen dürfen nur veröffentlicht werden, wenn die Abgebildeten es ausdrücklich erlauben. Unter 18 Jahren müssen die Erziehungsberechtigten schriftlich zustimmen.","bsp":"Bogdan darf das Foto von Nina und Oskar nicht ohne ihre Erlaubnis drucken."},{"id":"b|6|urheberrecht","ab":43,"s":143,"b":"Urheberrecht","e":"Regel, die die Interessen der Menschen schützt, die ein Werk geschaffen haben. Fremde Texte, Fotos oder Schaubilder darf man nur mit deren Zustimmung veröffentlichen.","bsp":"Kim darf den Artikel aus der Computerzeitschrift nicht einfach abdrucken."},{"id":"b|6|urheber","ab":43,"s":143,"b":"Urheber|Urheberin","e":"Verfasser, Erfinder, Künstler oder Hersteller eines Werkes.","bsp":""},{"id":"b|6|persönliche daten","ab":44,"s":145,"b":"persönliche Daten","e":"Angaben zu Namen, Anschrift, E-Mail-Adresse und Geburtsdaten.","bsp":"Bei Gewinnspielen im Internet besser nicht angeben."},{"id":"b|7|gemeinde","ab":46,"s":148,"b":"Gemeinde","e":"Sammelbegriff für Dörfer, Dorfgemeinschaften und Städte – der Ort, an dem man zu Hause ist.","bsp":"Sie sorgt z. B. für Freibäder, Bibliotheken und die Feuerwehr."},{"id":"b|7|politik","ab":46,"s":149,"b":"Politik","e":"Handeln für die Gemeinschaft mit dem Ziel, Konflikte zu lösen und Regeln zu finden, an die sich alle halten müssen.","bsp":"Streit darüber, ob die städtische Turnhalle modernisiert werden soll."},{"id":"b|7|fotodokumentation","ab":46,"s":150,"b":"Fotodokumentation","e":"Methode, bei der man Eindrücke mit selbst gemachten Fotos und kurzen erklärenden Texten festhält und präsentiert.","bsp":"Thema „Meine Stadt, mein Dorf“: Lieblingsorte, Schulweg, Spielplätze."},{"id":"b|7|umweltschutz","ab":46,"s":150,"b":"Umweltschutz","e":"Damit sind alle Maßnahmen gemeint, die dem Schutz des Bodens, des Wassers und der Luft dienen. Der Staat arbeitet an dieser Aufgabe, indem er schützende Gesetze beschließt. Fabriken müssen darauf achten, dass kein Dreck, keine Abgase und keine verschmutzten Abwässer in die Umwelt gelangen. Familien und einzelne Personen können ebenfalls ihren Beitrag dazu leisten, dass dieses wichtige Ziel erreicht wird.","bsp":""},{"id":"b|7|kinderstadt","ab":47,"s":153,"b":"Kinderstadt","e":"Projekt, bei dem Kinder eine Woche lang gemeinsam einen eigenen Ort aufbauen und gestalten und darüber diskutieren, wie sich alle wohlfühlen.","bsp":"80 Kinder im Bürgerzentrum Köln-Ehrenfeld."},{"id":"b|7|kinder- und jugendfördergesetz","ab":47,"s":154,"b":"Kinder- und Jugendfördergesetz|KJFP","e":"Gesetz in NRW, in dem steht, dass Kinder ab sechs Jahren ihrem Alter entsprechend das Recht zum Mitreden und Mitgestalten haben.","bsp":""},{"id":"b|7|kommune","ab":47,"s":155,"b":"Kommune","e":"Anderer Begriff für Gemeinde oder Stadt.","bsp":"Der Bau eines Theaters oder einer Konzerthalle ist eine kommunalpolitische Entscheidung."},{"id":"b|7|kommunalpolitik","ab":47,"s":155,"b":"Kommunalpolitik","e":"Das ist die Politik, die in den Gemeinden gemacht wird, also in den Stadt- und Landgemeinden. Der erste Wortteil heißt „die Gemeinde betreffend“. Alle wahlberechtigten Bürgerinnen und Bürger können mitbestimmen, was politisch in ihrer Gemeinde geschehen soll, zum Beispiel, indem sie an den Wahlen zur Gemeindevertretung teilnehmen oder sich als Kandidat aufstellen lassen. Kinder und Jugendliche haben auch Mitwirkungsmöglichkeiten – zum Beispiel durch Kinder- und Jugendparlamente.","bsp":""},{"id":"b|7|kinder- und jugendparlament","ab":48,"s":156,"b":"Kinder- und Jugendparlament|KiJuPa|Jugendparlament|Kinderparlament","e":"Gewählte Vertretung von Kindern und Jugendlichen in einer Stadt; sie können Vorschläge machen, an den Stadtrat weiterleiten und eigene Projekte verwirklichen.","bsp":"In Recklinghausen seit 2001 mit 59 Mitgliedern von 10 bis 19 Jahren."},{"id":"b|7|arbeitsgruppe","ab":48,"s":156,"b":"Arbeitsgruppe|AG","e":"Kleine Gruppe, die zu einem bestimmten Thema arbeitet – im KiJuPa kann man hier auch mitmachen, ohne gewählt worden zu sein.","bsp":"Eine AG Kinderrechte."},{"id":"b|7|wahlordnung","ab":48,"s":157,"b":"Wahlordnung","e":"Regelt den Ablauf einer Wahl von der Aufstellung der Kandidaten bis zur Bekanntgabe des Ergebnisses; beim KiJuPa beschließt sie der Rat der Stadt.","bsp":""},{"id":"b|7|wahlausschuss","ab":48,"s":157,"b":"Wahlausschuss","e":"Gruppe, die bei der KiJuPa-Wahl die Stimmen auszählt; sie besteht aus Mitgliedern des alten KiJuPas, die nicht mehr kandidieren.","bsp":""},{"id":"b|7|haushaltsplan","ab":49,"s":158,"b":"Haushaltsplan","e":"Darin legt eine Stadt fest, mit welchen Einnahmen sie rechnet und wofür sie das Geld ausgibt; jede Stadt muss ihn per Gesetz erstellen.","bsp":"Neuborn hat für neue Vorhaben nur acht Millionen Euro."},{"id":"b|7|effizient","ab":49,"s":158,"b":"effizient","e":"Wirksam und mit möglichst geringem Aufwand.","bsp":"Die Gemeinde soll ihre Haushaltswirtschaft wirtschaftlich, … und sparsam führen (§ 75 GO NRW)."},{"id":"b|7|ausschuss","ab":49,"s":159,"b":"Ausschuss|Ausschüsse","e":"Kleinere Gruppe, die die Sitzung des Stadtrates vorbereitet.","bsp":"Im Rollenspiel Neuborn einigen sich die Gruppen auf Streichungen von ca. acht Millionen Euro."},{"id":"b|7|urheber","ab":50,"s":160,"b":"Urheber|Urheberin","e":"Der Schöpfer oder die Schöpferin eines Werkes; er oder sie muss zustimmen, bevor das Werk veröffentlicht wird.","bsp":"Bei einem Foto ist das der Fotograf oder die Fotografin."},{"id":"b|7|persönlichkeitsrecht","ab":50,"s":160,"b":"Persönlichkeitsrecht|Persönlichkeitsrechte","e":"Gibt Menschen, die auf einem Foto abgebildet sind, ein Recht am eigenen Bild.","bsp":"Abgebildete Personen müssen zustimmen, wenn ein Foto auf die Schulwebsite kommt."},{"id":"b|7|bürgermeister","ab":50,"s":161,"b":"Bürgermeister|Bürgermeisterin","e":"Wird von den Bürgerinnen und Bürgern für fünf Jahre direkt gewählt, repräsentiert die Gemeinde, hat den Vorsitz im Rat und leitet die Verwaltung.","bsp":"Trägt bei Empfängen im Rathaus die Amtskette."},{"id":"b|7|oberbürgermeister","ab":50,"s":161,"b":"Oberbürgermeister|Oberbürgermeisterin","e":"Offizieller Titel des direkt gewählten Stadtoberhaupts einer kreisfreien Stadt.","bsp":"Henriette Reker war Stadtoberhaupt der Stadt Köln."},{"id":"b|7|kreisfrei","ab":50,"s":161,"b":"kreisfrei|kreisfreie Stadt","e":"Größere selbstständige Stadt, die keinem Landkreis angehört.","bsp":"Köln"},{"id":"b|7|gemeindeordnung","ab":50,"s":161,"b":"Gemeindeordnung","e":"Gesetz, das die Rechte und Pflichten der Gemeinden regelt.","bsp":"§ 65 regelt die Wahl des Bürgermeisters, § 75 den Haushalt."},{"id":"b|7|gemeinderat","ab":50,"s":162,"b":"Gemeinderat|Stadtrat|Rat der Stadt|Rat","e":"Politische Vertretung der Bürgerinnen und Bürger einer Gemeinde; die für fünf Jahre gewählten Mitglieder entscheiden über die Entwicklung des Ortes.","bsp":"Entscheidung über den Bau eines Schwimmbades oder einer Bibliothek."},{"id":"b|7|gemeindeverwaltung","ab":50,"s":163,"b":"Gemeindeverwaltung|Stadtverwaltung|Verwaltung","e":"Sorgt dafür, dass alles, was der Stadtrat beschließt, ordnungsgemäß ausgeführt wird, und hilft den Einwohnern bei Behördengängen; Chef ist der Oberbürgermeister.","bsp":"Einwohnermeldeamt, Standesamt, Jugendamt."},{"id":"b|7|bürgeramt","ab":50,"s":163,"b":"Bürgeramt|Bürgerberatung","e":"Ansprechpartner für die Menschen in der Stadt, wo man an einem Schreibtisch viele Dinge erledigen kann.","bsp":"Einen neuen Ausweis beantragen oder die Geburt eines Kindes anzeigen."},{"id":"b|7|ordnungsamt","ab":50,"s":163,"b":"Ordnungsamt","e":"Teil der Stadtverwaltung, der mit der örtlichen Polizei zusammenarbeitet und einschreitet, wenn Gesetze verletzt werden.","bsp":"Bußgelder bis zu 40 Euro für weggeworfene Kaugummis oder Zigarettenkippen."},{"id":"b|7|erkundung","ab":50,"s":164,"b":"Erkundung","e":"Man wählt Orte aus, um etwas herauszufinden, was einem bis dahin unbekannt war – online oder bei einem echten Besuch.","bsp":"Das örtliche Rathaus über die Homepage oder vor Ort kennenlernen."},{"id":"b|7|bürgerbegehren","ab":51,"s":167,"b":"Bürgerbegehren","e":"Damit fordern Einwohnerinnen und Einwohner den Rat der Stadt auf, eine bestimmte Entscheidung zu treffen; der Rat muss sich dann damit befassen.","bsp":"In Schönhausen unterschrieben 2700 Personen für die Schließung zweier Parkplätze."},{"id":"b|7|bürgerentscheid","ab":51,"s":167,"b":"Bürgerentscheid","e":"Abstimmung, bei der nicht der Rat, sondern die wahlberechtigten Menschen der Gemeinde selbst geheim über eine Angelegenheit entscheiden.","bsp":"Kommt in NRW zustande, wenn der Rat ein Bürgerbegehren ablehnt."},{"id":"b|7|planspiel","ab":51,"s":167,"b":"Planspiel","e":"Methode, bei der alle eine Rolle einnehmen, sich an ihre Rolle halten und gemeinsam beraten und entscheiden.","bsp":"Die Klasse spielt den Stadtrat von Schönhausen."},{"id":"b|7|stadtvorstand","ab":51,"s":167,"b":"Stadtvorstand","e":"Der Bürgermeister oder die Bürgermeisterin zusammen mit den Stellvertreterinnen und Stellvertretern.","bsp":"Gruppe 5 im Planspiel Schönhausen."},{"id":"b|7|freies mandat","ab":51,"s":169,"b":"freies Mandat","e":"Gewählte Ratsmitglieder dürfen frei entscheiden und sind nicht an die Vorgaben ihrer Gruppe gebunden.","bsp":""},{"id":"b|7|fünf-finger-methode","ab":51,"s":170,"b":"Fünf-Finger-Methode","e":"Methode für eine Rückmeldung: Jeder Finger der Hand steht für eine Frage, z. B. Daumen = „Das fand ich super!“.","bsp":"Kleiner Finger: „Darüber möchte ich gerne mehr wissen.“"},{"id":"b|7|bürgerinitiative","ab":51,"s":171,"b":"Bürgerinitiative","e":"Zusammenschluss von Einwohnerinnen und Einwohnern, die gemeinsam ein ganz bestimmtes Ziel in ihrem Ort erreichen wollen.","bsp":"„Autos raus aus der Stadt“ in Schönhausen."},{"id":"b|7|einwohnerantrag","ab":51,"s":171,"b":"Einwohnerantrag","e":"Ab 14 Jahren kann man damit den Stadtrat schriftlich auffordern, sich mit einem bestimmten Thema zu beschäftigen.","bsp":""},{"id":"b|8|ökonomie","ab":54,"s":177,"b":"Ökonomie","e":"Anderes Wort für Wirtschaft; es kommt vom griechischen Wort „Oikos“ für Haushalt.","bsp":""},{"id":"b|8|oikos","ab":54,"s":177,"b":"Oikos","e":"Griechisches Wort für Haushalt, von dem sich ein anderes Wort für Wirtschaft ableitet.","bsp":""},{"id":"b|8|carsharing","ab":54,"s":178,"b":"Carsharing","e":"Man besitzt kein eigenes Auto, sondern nutzt bei Bedarf eines, das man sich mit mehreren Leuten teilt.","bsp":"Manuel hat sein Auto abgeschafft und leiht sich nur bei Bedarf eines."},{"id":"b|8|wirtschaft","ab":54,"s":179,"b":"Wirtschaft","e":"Alle Tätigkeiten, die sich mit der Herstellung, der Verteilung und dem Verbrauch der Dinge beschäftigen, die wir zum täglichen Leben brauchen.","bsp":""},{"id":"b|8|knappheit","ab":55,"s":180,"b":"Knappheit","e":"Die Wünsche der Menschen sind größer als die Mittel, die ihnen zur Verfügung stehen.","bsp":"Luca bräuchte für alle seine Hobbys doppelt so viel Zeit und viel mehr Geld."},{"id":"b|8|bildschirmlesen","ab":55,"s":181,"b":"Bildschirmlesen","e":"Texte am Tablet oder PC lesen – schnell verfügbar, aber man liest leicht oberflächlich.","bsp":""},{"id":"b|8|sparsamkeit","ab":55,"s":183,"b":"Sparsamkeit","e":"Weder Geld noch Zeit noch Materialien verschwenden und dafür eine möglichst hohe Gegenleistung bekommen.","bsp":""},{"id":"b|8|minimalprinzip","ab":55,"s":183,"b":"Minimalprinzip","e":"Ein festes Ziel mit möglichst geringen Mitteln erreichen.","bsp":"Einen bestimmten Fahrradhelm so billig wie möglich kaufen."},{"id":"b|8|maximalprinzip","ab":55,"s":183,"b":"Maximalprinzip","e":"Mit festen Mitteln ein möglichst großes Ziel erreichen.","bsp":"Für höchstens 60 Euro den besten Fahrradhelm kaufen."},{"id":"b|8|ökonomisches prinzip","ab":55,"s":183,"b":"Ökonomisches Prinzip|Prinzip der Wirtschaftlichkeit","e":"Oberbegriff für Minimalprinzip und Maximalprinzip zusammen.","bsp":""},{"id":"b|8|bedürfnis","ab":56,"s":184,"b":"Bedürfnis","e":"Man hat einen Mangel an etwas und will ihn unbedingt beseitigen.","bsp":"Wer Durst hat, möchte etwas trinken."},{"id":"b|8|grundbedürfnisse","ab":56,"s":186,"b":"Grundbedürfnisse|Existenzbedürfnisse|Grundbedürfnis","e":"Bedürfnisse, die überlebenswichtig sind.","bsp":"Essen, Trinken, Kleidung, ein Dach über dem Kopf"},{"id":"b|8|luxusbedürfnisse","ab":56,"s":186,"b":"Luxusbedürfnisse|Konsumbedürfnisse|Luxusbedürfnis","e":"Bedürfnisse nach Dingen, die man nicht zum Überleben braucht, die das Leben aber angenehmer und leichter machen.","bsp":"Autos, Schmuck, Fernseher, Parfüm, Reisen"},{"id":"b|8|kulturelle bedürfnisse","ab":56,"s":186,"b":"Kulturelle Bedürfnisse|kulturelles Bedürfnis","e":"Bedürfnisse nach Unterhaltung und Bildung.","bsp":"Musik hören, einen Film im Kino anschauen"},{"id":"b|8|soziale bedürfnisse","ab":56,"s":186,"b":"Soziale Bedürfnisse|soziales Bedürfnis","e":"Bedürfnisse nach Zuwendung und Freundschaft – man kann sie nicht im Kaufhaus kaufen.","bsp":""},{"id":"b|8|bedarf","ab":56,"s":186,"b":"Bedarf","e":"Ein Bedürfnis, für dessen Befriedigung man bereit ist, Geld auszugeben.","bsp":"Du hast Hunger und Appetit auf Pizza, also bestellst und bezahlst du eine."},{"id":"b|8|güter","ab":57,"s":188,"b":"Güter|Gut","e":"Mittel, die man braucht, um Bedürfnisse zu befriedigen.","bsp":""},{"id":"b|8|freie güter","ab":57,"s":188,"b":"Freie Güter|freies Gut","e":"Güter, die im Überfluss vorhanden sind und nichts kosten.","bsp":"Sand und Wasser am Strand, Sonne, frische Luft"},{"id":"b|8|wirtschaftsgüter","ab":57,"s":188,"b":"Wirtschaftsgüter|Wirtschaftsgut","e":"Güter, die Geld kosten.","bsp":"Eine Portion Pommes frites"},{"id":"b|8|rohstoff","ab":57,"s":188,"b":"Rohstoff","e":"Ein Stoff aus der Natur, der meist verarbeitet wird, um daraus ein nützliches Gut zu machen.","bsp":"Kartoffeln für Pommes frites"},{"id":"b|8|konsumgüter","ab":57,"s":188,"b":"Konsumgüter|Konsumgut","e":"Sachgüter, die man benutzt oder verbraucht, um ein Bedürfnis zu befriedigen.","bsp":"Pommes frites, Messer und Gabel"},{"id":"b|8|produktionsgüter","ab":57,"s":188,"b":"Produktionsgüter|Produktionsgut","e":"Sachgüter, mit denen andere Dinge hergestellt werden.","bsp":"Die Maschinen in der Pommes-Fabrik"},{"id":"b|8|dienstleistungen","ab":57,"s":189,"b":"Dienstleistungen|Dienstleistung","e":"Güter, die keine Sachen sind: Menschen erweisen anderen gegen Bezahlung einen Dienst.","bsp":"Fahrer, Köche, Kellner, Friseure, Ärzte, Lehrer"},{"id":"b|8|selbstkosten","ab":58,"s":191,"b":"Selbstkosten","e":"Alle Kosten, die bei der Herstellung einer Ware entstehen.","bsp":"Setzlinge, Pacht, Erntehelfer und Marktstand für ein Kilo Erdbeeren"},{"id":"b|8|gewinn","ab":58,"s":191,"b":"Gewinn","e":"Der Verdienst, der übrig bleibt, wenn alle Kosten bezahlt sind.","bsp":""},{"id":"b|8|markt","ab":58,"s":192,"b":"Markt","e":"Ein Treffpunkt von Verkäufern und Käufern.","bsp":"Wochenmarkt, Kaufhaus, Autokauf über das Internet"},{"id":"b|8|angebot","ab":58,"s":192,"b":"Angebot","e":"Alle Waren, die auf einem Markt verkauft werden sollen.","bsp":"Im September sind in Deutschland viele Trauben reif."},{"id":"b|8|nachfrage","ab":58,"s":192,"b":"Nachfrage","e":"Alle Kunden eines Marktes, die Waren kaufen wollen.","bsp":"Eine Kleidermarke ist in Mode, viele wollen sie kaufen."},{"id":"b|8|kalkulieren","ab":58,"s":193,"b":"Kalkulieren","e":"Die Preise für Waren berechnen.","bsp":"Die Geschäftsleitung eines Kaufhauses legt neue Preise fest."},{"id":"b|8|wettbewerb","ab":59,"s":194,"b":"Wettbewerb|freier Wettbewerb","e":"Händler kämpfen um Kunden und müssen ihre Produkte deshalb zu günstigen Preisen anbieten.","bsp":""},{"id":"b|8|mindestlohn","ab":59,"s":194,"b":"Mindestlohn","e":"Gesetzlich garantierter Betrag, den Beschäftigte pro Arbeitsstunde mindestens verdienen müssen.","bsp":"Seit 2015 in Deutschland, ab 2025: 12,82 Euro"},{"id":"b|8|wirtschaftspolitik","ab":59,"s":195,"b":"Wirtschaftspolitik","e":"Gesetze und Maßnahmen des Staates für die Wirtschaft, zum Beispiel zum Schutz der Schwachen, für Arbeitsplätze und für die Umwelt.","bsp":"Verbot von Preisabsprachen, Mindestlohn"},{"id":"b|8|zuckersteuer","ab":59,"s":196,"b":"Zuckersteuer","e":"Eine Steuer auf stark zuckerhaltige Getränke, die sie teurer und für Kinder weniger attraktiv machen soll.","bsp":"In Norwegen seit 1981, in Mexiko seit 2014"},{"id":"b|9|dauerauftrag","ab":62,"s":203,"b":"Dauerauftrag","e":"Die Bank bezahlt regelmäßig, zum Beispiel jeden Monat, automatisch denselben Betrag vom Konto.","bsp":"Die Monatskarte für den Schulbus"},{"id":"b|9|überweisung","ab":62,"s":203,"b":"Überweisung","e":"Geld wird vom eigenen Bankkonto auf das Bankkonto des Empfängers geschickt.","bsp":"Die Eltern zahlen 395 Euro für die Englandreise an die Schule."},{"id":"b|9|geldkarte","ab":62,"s":203,"b":"Geldkarte","e":"Eine Plastikkarte, die man mit einem Geldbetrag auflädt und mit der man dann ohne Bargeld bezahlt.","bsp":"Mias Karte für die Mensa"},{"id":"b|9|girocard","ab":62,"s":203,"b":"Girocard","e":"Eine Karte zum Bankkonto, mit der man an der Kasse direkt vom Konto bezahlt.","bsp":""},{"id":"b|9|bargeld","ab":62,"s":204,"b":"Bargeld","e":"Münzen und Geldscheine, mit denen man bezahlt.","bsp":""},{"id":"b|9|buchgeld","ab":62,"s":204,"b":"Buchgeld","e":"Unsichtbares Geld auf einem Konto oder Sparbuch, das die Bank in ihren Büchern notiert.","bsp":"Das Gehalt, das der Arbeitgeber aufs Konto überweist"},{"id":"b|9|währung","ab":62,"s":204,"b":"Währung","e":"Das Geld, das in einem Land oder in mehreren Ländern von allen benutzt wird.","bsp":"Der Euro, früher in Deutschland die D-Mark"},{"id":"b|9|europäische zentralbank","ab":62,"s":204,"b":"Europäische Zentralbank|EZB","e":"Bank mit Sitz in Frankfurt, die darauf achtet, dass der Wert des Euro stabil bleibt.","bsp":""},{"id":"b|9|finanzen","ab":63,"s":207,"b":"Finanzen","e":"Sammelbezeichnung für alle Geldmittel und Geldanlagen einer Person, einer Firma oder eines Staates.","bsp":""},{"id":"b|9|taschengeldplan","ab":63,"s":207,"b":"Taschengeldplan","e":"Ein Plan, in dem man festlegt, wie viel Geld man für seine Wünsche ausgibt und wie viel man spart.","bsp":""},{"id":"b|9|taschengeld","ab":63,"s":208,"b":"Taschengeld","e":"Freiwillige Geldleistung der Eltern – für Kinder die einzige Geldquelle für persönliche Wünsche.","bsp":"Andi bekommt 22 Euro im Monat von seinen Eltern."},{"id":"b|9|befragung","ab":63,"s":210,"b":"Befragung|Umfrage","e":"Eine Methode, mit der man herausfindet, was andere Menschen über ein Thema denken.","bsp":"Ein Fragebogen zum Umgang mit Taschengeld"},{"id":"b|9|anonym","ab":63,"s":210,"b":"anonym","e":"Ohne Nennung des Namens.","bsp":"Einen Fragebogen ausfüllen, ohne den eigenen Namen daraufzuschreiben"},{"id":"b|9|bruttogehalt","ab":64,"s":212,"b":"Bruttogehalt|Brutto","e":"Der gesamte Verdienst, bevor Steuern und andere Abzüge abgezogen werden.","bsp":"Familie Steinke: 6600 Euro im Monat"},{"id":"b|9|nettogehalt","ab":64,"s":212,"b":"Nettogehalt|Netto","e":"Das Geld, das nach Abzug von Steuern und Sozialabgaben übrig bleibt und ausgezahlt wird.","bsp":""},{"id":"b|9|steuern","ab":64,"s":212,"b":"Steuern","e":"Abgaben an den Staat, die er braucht, um seine Aufgaben zu erledigen.","bsp":"Davon werden Schulen, Lehrer und Straßen bezahlt."},{"id":"b|9|brutto- und nettogehalt","ab":64,"s":212,"b":"Brutto- und Nettogehalt|Bruttogehalt und Nettogehalt","e":"Stelle dir vor, du bekommst später einmal ein Monatsgehalt von 3000 Euro. Das ist dann dein Gehalt vor Abzügen. Du bekommst aber nicht diese Gesamtsumme ausbezahlt. Es werden davon die Steuern und die Sozialversicherungsbeiträge abgezogen (z. B. Krankenversicherung und Rentenversicherung). So verbleiben dir dann noch etwa 2000 Euro. Das ist dann dein Gehalt nach Abzügen. Merke: Gehalt vor Abzügen minus Abzüge = Gehalt nach Abzügen.","bsp":""},{"id":"b|9|sozialversicherungen","ab":64,"s":213,"b":"Sozialversicherungen|Sozialversicherung","e":"Zusammenfassung von Kranken-, Pflege-, Renten- und Arbeitslosenversicherung; das Geld geht direkt vom Bruttolohn an die Kassen.","bsp":""},{"id":"b|9|kindergeld","ab":64,"s":213,"b":"Kindergeld","e":"Geld, das Familien zusätzlich vom Staat für jedes Kind bekommen.","bsp":"259 Euro pro Kind und Monat (ab 2026)"},{"id":"b|9|einkommen","ab":64,"s":214,"b":"Einkommen","e":"Das Geld, das eine Familie regelmäßig zur Verfügung hat.","bsp":"Lohn, Rente, Mieteinnahmen, Kindergeld"},{"id":"b|9|zinsen","ab":64,"s":214,"b":"Zinsen","e":"Geldbetrag, den man als Gegenleistung bekommt, wenn man der Bank Geld für eine bestimmte Zeit zur Verfügung stellt.","bsp":""},{"id":"b|9|sozialleistungen","ab":64,"s":214,"b":"Sozialleistungen|Sozialleistung","e":"Geld vom Staat, für das man keine Gegenleistung erbringen muss.","bsp":"Kindergeld, Sozialhilfe, Wohngeld, BAföG"},{"id":"b|9|haushaltsplan","ab":64,"s":215,"b":"Haushaltsplan","e":"Ein Plan, in dem eine Familie festlegt, wie viel Geld sie im Monat für die einzelnen Dinge ausgeben will.","bsp":"Familie Böger plant 900 Euro für die Miete und 500 Euro für Essen ein."},{"id":"b|10|geschäftsfähigkeit","ab":67,"s":224,"b":"Geschäftsfähigkeit|geschäftsfähig","e":"Sie hängt vom Alter ab und regelt, ob man selbst gültig einkaufen darf. Kinder bis zum 7. Geburtstag haben sie noch nicht.","bsp":"Kauft eine Sechsjährige allein Süßigkeiten, ist der Kauf ungültig."},{"id":"b|10|beschränkt geschäftsfähig","ab":67,"s":224,"b":"beschränkt geschäftsfähig","e":"So nennt man Kinder und Jugendliche vom 7. bis zum 18. Geburtstag: Sie dürfen von Taschengeld oder geschenktem Geld kaufen, was sie bezahlen können – mit einigen Einschränkungen.","bsp":"Ein Haustier dürfen sie bis 14 Jahre nur mit Erlaubnis der Eltern kaufen."},{"id":"b|10|reklamation","ab":67,"s":224,"b":"Reklamation|reklamieren","e":"Man beschwert sich beim Händler über eine fehlerhafte Ware. Er muss sie dann kostenlos reparieren oder eine neue, einwandfreie liefern.","bsp":"Nach der ersten Wäsche gehen die Nähte einer neuen Jeans auf."},{"id":"b|10|preisnachlass","ab":67,"s":224,"b":"Preisnachlass","e":"Der Händler senkt den Preis, zum Beispiel wenn eine fehlerhafte Ware nicht ersetzt werden kann.","bsp":"Das Modell der kaputten Jeans gibt es nicht mehr."},{"id":"b|10|supermarktfalle","ab":68,"s":227,"b":"Supermarktfalle|Supermarktfallen","e":"Ein Trick im Supermarkt, der Kunden dazu verleitet, mehr zu kaufen, als sie brauchen.","bsp":"Teure Waren stehen in Augenhöhe, Süßigkeiten direkt an der Kasse."},{"id":"b|10|plakat","ab":68,"s":228,"b":"Plakat","e":"Ein großer, bedruckter Papierbogen an öffentlichen Plätzen, der mit wenig Text, einem Bild und einem guten Spruch schnell Aufmerksamkeit gewinnen will.","bsp":"„Zu großer Einkaufswagen = zu leere Geldbörse!“"},{"id":"b|10|mindesthaltbarkeitsdatum","ab":68,"s":229,"b":"Mindesthaltbarkeitsdatum|MHD","e":"Empfehlung des Herstellers auf der Verpackung: Bis zu diesem Tag behält ein Lebensmittel auf jeden Fall seine gute Qualität. Meist ist es auch danach noch genießbar.","bsp":"Ein Joghurt kann oft noch nach diesem Datum gegessen werden."},{"id":"b|10|verbrauchsdatum","ab":68,"s":229,"b":"Verbrauchsdatum","e":"Datum auf sehr leicht verderblichen Waren, bis zu dem man sie unbedingt verbrauchen muss, weil man sonst krank werden könnte.","bsp":""},{"id":"b|10|tafel","ab":68,"s":229,"b":"Tafel|Tafeln","e":"Einrichtung von Ehrenamtlichen, die noch gut erhaltene Waren von Supermärkten an bedürftige Menschen abgibt.","bsp":""},{"id":"b|10|werbung","ab":69,"s":232,"b":"Werbung","e":"Alle Maßnahmen, die den Verkauf eines Produkts steigern sollen. Sie will bei den Käufern den Wunsch wecken, eine Ware zu kaufen.","bsp":"Anzeigen in Zeitungen, Spots im Radio, Prospekte im Briefkasten"},{"id":"b|10|sponsoring","ab":69,"s":232,"b":"Sponsoring","e":"Unternehmen unterstützen Sport-Teams, Organisationen oder Schulen mit Geld und erwarten, dass man dadurch positiv über sie denkt.","bsp":"Ein Softwareunternehmen bezahlt die Trikots eines Handballvereins."},{"id":"b|10|product-placement","ab":69,"s":232,"b":"Product-Placement|Product Placement|Produktplatzierung","e":"Produkte eines Unternehmens werden geschickt in beliebte Fernsehsendungen, Videos oder Blogs eingebaut, ohne dass man es sofort als Werbung bemerkt.","bsp":"Der Hauptdarsteller einer Serie trägt Kleidung eines bekannten Herstellers."},{"id":"b|10|strategie","ab":69,"s":233,"b":"Strategie|Verkaufsstrategie","e":"Ein Plan, wie man ein bestimmtes Ziel erreichen möchte.","bsp":"Die Schülerfirma Fans4Sport überlegt, ob sie über einen Webshop, einen Promotion-Stand oder Zeitungsanzeigen verkauft."},{"id":"b|10|influencer","ab":70,"s":234,"b":"Influencer|Influencerin|Influencerinnen","e":"Person, die über soziale Netzwerke wie TikTok, Instagram oder YouTube ihre Follower beeinflusst und dabei Produkte vermarktet.","bsp":"Younes Zarou hatte 2024 über 50 Millionen Follower."},{"id":"b|10|follower","ab":70,"s":234,"b":"Follower|Followerin|Followerinnen","e":"Menschen, die einer Person in sozialen Netzwerken folgen und ihre Beiträge anschauen.","bsp":""},{"id":"b|10|versteckte werbung","ab":70,"s":234,"b":"versteckte Werbung|Schleichwerbung","e":"Werbung, die unauffällig in Posts oder Videos eingebaut wird, sodass besonders Kinder sie oft nicht erkennen.","bsp":""},{"id":"b|10|redekette","ab":70,"s":234,"b":"Redekette","e":"Methode, bei der ein Ball weitergeworfen wird: Wer ihn fängt, nennt einen Gedanken zum Thema oder gibt ihn weiter.","bsp":"Die Übung endet, wenn der Ball dreimal ohne Kommentar weitergereicht wurde."},{"id":"b|10|kriterien","ab":71,"s":237,"b":"Kriterien|Kriterium","e":"Wertmaßstäbe, die man bei Entscheidungen – zum Beispiel beim Einkaufen – beachten sollte.","bsp":"Preis, Qualität, bio oder regional"},{"id":"b|10|gütesiegel","ab":71,"s":237,"b":"Gütesiegel","e":"Eine Art Abzeichen auf einer Ware, an dem man auf einen Blick ihre besonderen Eigenschaften erkennen kann.","bsp":"Das Fairtrade-Siegel oder das Biosiegel"},{"id":"b|10|biosiegel","ab":71,"s":237,"b":"Biosiegel","e":"Staatliches Zeichen für Lebensmittel, die unter strengen Bedingungen umweltschonend hergestellt wurden: nur bestimmte Dünger und Futtermittel, artgerechte Tierhaltung.","bsp":"„Bio nach EG-Öko-Verordnung“"},{"id":"b|10|hungerlohn","ab":71,"s":237,"b":"Hungerlohn","e":"Ein so niedriger Lohn für Arbeit, dass man kaum davon leben kann.","bsp":"Beschäftigte, die in armen Ländern Billigwaren herstellen"},{"id":"b|10|plantage","ab":72,"s":238,"b":"Plantage|Bananenplantage","e":"Großes Anbaugebiet, auf dem vor allem eine einzige Pflanze angebaut wird.","bsp":"Frederico arbeitet in Ecuador auf einer solchen Anlage für Bananen."},{"id":"b|10|spritzmittel","ab":72,"s":238,"b":"Spritzmittel|Schädlingsbekämpfungsmittel","e":"Gift, das auf die Felder gesprüht wird, um Schädlinge zu bekämpfen. Es kann die Arbeiter krank machen.","bsp":"Frederico wird beim Sprühen oft übel und schwindlig."},{"id":"b|10|fairer handel","ab":72,"s":239,"b":"fairer Handel","e":"Handel, bei dem die Hersteller – meist Bauern in armen Ländern – einen gerechten Preis für ihre Ware bekommen.","bsp":"Ursprünglich ging es vor allem um Bananen, Kaffee und Kakao."},{"id":"b|11|umwelt-ag","ab":75,"s":245,"b":"Umwelt-AG","e":"Eine Arbeitsgemeinschaft an der Schule, in der sich Schülerinnen und Schüler gemeinsam für den Umweltschutz einsetzen.","bsp":"Aktion zur Müllvermeidung, Sammelboxen für Altbatterien"},{"id":"b|11|vereinte nationen","ab":75,"s":246,"b":"Vereinte Nationen|UNO|UN","e":"Die größte internationale Organisation der Welt. Fast alle Nationen der Erde sind Mitglied. Ziele: Frieden fördern, gegen Klimaerwärmung kämpfen, Natur schützen.","bsp":"Aufruf an Kinder, Umwelt- und Klimahelden zu werden"},{"id":"b|11|recycling","ab":75,"s":246,"b":"Recycling","e":"Rückgewinnung und Wiederverwendung von Abfällen.","bsp":"Mit jeder Tonne Recyclingpapier kann man 17 Bäume retten."},{"id":"b|11|emission","ab":75,"s":246,"b":"Emission|Emissionen","e":"Anderes Wort für Ausstoß, zum Beispiel von Treibhausgasen.","bsp":"Die Nutzung von Energie verursacht etwa 35 Prozent davon weltweit."},{"id":"b|11|treibhausgase","ab":75,"s":246,"b":"Treibhausgase|Treibhausgas","e":"Gase, die vor allem beim Verbrennen von Kohle, Öl und Gas entstehen und dem Klima schaden.","bsp":"CO₂"},{"id":"b|11|wegwerfgesellschaft","ab":75,"s":247,"b":"Wegwerfgesellschaft","e":"So nennt man unsere Lebensweise, bei der Abfall oft auf Müllhalden oder in Meeren, Seen und Flüssen landet, statt wiederverwendet zu werden.","bsp":"Ein Drittel aller Nahrung geht verloren oder wird verschwendet."},{"id":"b|11|energie","ab":76,"s":249,"b":"Energie","e":"Etwas wie eine Fähigkeit, etwas bewirken zu können. Man kann sie nicht herstellen oder vernichten, aber speichern, transportieren und umwandeln.","bsp":"In der Lampe wird Strom zu Licht, im Mixer zu Bewegung."},{"id":"b|11|fossile brennstoffe","ab":76,"s":249,"b":"fossile Brennstoffe|fossile Energien|fossil","e":"Kohle, Erdöl und Erdgas: vor Millionen Jahren aus toten Pflanzen entstanden. Es gibt nur eine begrenzte Menge davon. Das Wort bedeutet „urzeitlich“.","bsp":""},{"id":"b|11|energiewende","ab":76,"s":249,"b":"Energiewende","e":"In Zukunft soll unsere Energie, zum Beispiel Strom, aus erneuerbaren Quellen statt aus Kohle, Öl und Gas gewonnen werden.","bsp":""},{"id":"b|11|erneuerbare energien","ab":76,"s":249,"b":"erneuerbare Energien|erneuerbare Energie","e":"Energiequellen, die unendlich nutzbar sind und „grünen“ Strom liefern.","bsp":"Wind- und Sonnenenergie, Biomasse, Wasserkraft"},{"id":"b|11|strommix","ab":76,"s":249,"b":"Strommix","e":"Strom aus unterschiedlichen erneuerbaren Quellen fließt im Stromnetz zusammen, damit die Versorgung auch bei wenig Wind oder Sonne sicher ist.","bsp":""},{"id":"b|11|sachtext","ab":76,"s":250,"b":"Sachtext|Sachtexte","e":"Ein Text, der über ein Thema informiert und aus dem man etwas lernen kann.","bsp":"Ein Lexikontext über Energie"},{"id":"b|11|nachhaltigkeit","ab":76,"s":251,"b":"Nachhaltigkeit|nachhaltig","e":"Nur so viel von einer Sache verbrauchen, wie in der Natur neu entsteht, damit man auch in Zukunft so weitermachen kann.","bsp":"Jedes Jahr nur so viel Holz fällen, wie nachwachsen kann"},{"id":"b|11|soziale nachhaltigkeit","ab":76,"s":251,"b":"soziale Nachhaltigkeit","e":"Nachhaltigkeit für die Gesellschaft: Wir sollen die Welt unseren Nachfahren so übergeben, wie unsere Vorfahren sie uns überlassen haben.","bsp":"Auch künftige Menschen sollen nicht in Armut leben müssen."},{"id":"b|11|ziele für nachhaltige entwicklung","ab":76,"s":251,"b":"Ziele für nachhaltige Entwicklung","e":"17 Ziele, die sich die UNO seit 2015 gesteckt hat und die bis 2030 erreicht werden sollen.","bsp":"Klima und Ökosysteme schützen, genug zu essen für alle, bessere Bildung"},{"id":"b|11|ressourcenschonung","ab":76,"s":252,"b":"Ressourcenschonung","e":"Verantwortungsvoll und sparsam mit unseren natürlichen Ressourcen umgehen, damit sie auch künftigen Generationen zur Verfügung stehen.","bsp":"Stofftaschen statt Plastiktüten, Mehrweg-Kaffeebecher"},{"id":"b|11|natürliche ressourcen","ab":76,"s":252,"b":"natürliche Ressourcen|Ressourcen","e":"Dinge, die man braucht und die in der Natur vorhanden sind.","bsp":"Kohle, Öl und andere Bodenschätze, aber auch Flüsse, Seen und Wälder"},{"id":"b|11|biodiversität","ab":76,"s":252,"b":"Biodiversität|Artenvielfalt","e":"Die Vielfalt der verschiedenen Tier- und Pflanzenarten.","bsp":"Sie geht durch übermäßigen Ressourcenverbrauch verloren."},{"id":"b|11|schaubild","ab":76,"s":253,"b":"Schaubild|Diagramm","e":"Eine bildhafte Darstellung von Sachverhalten, bei denen Zahlenangaben eine Rolle spielen.","bsp":"Ein Kreisdiagramm zur Umfrage über erneuerbare Energien"},{"id":"b|11|meeresschildkröte","ab":77,"s":254,"b":"Meeresschildkröte|Meeresschildkröten","e":"Ein Reptil, das im Meer lebt, an Stränden aus Eiern schlüpft und locker 80 Jahre alt werden kann.","bsp":"Carla wurde in Thailand geboren und von einem Taucher gerettet."},{"id":"b|11|klimawandel","ab":77,"s":254,"b":"Klimawandel","e":"Die Veränderung des Klimas auf der Erde, durch die es zum Beispiel wärmer wird.","bsp":"Es schlüpfen mehr weibliche Meeresschildkröten, weil die Nester wärmer sind."},{"id":"b|11|plastikmüll","ab":77,"s":255,"b":"Plastikmüll","e":"Abfall aus Kunststoff, der oft in den Meeren landet und für viele Meerestiere eine Gefahr ist.","bsp":"Plastiktüten, Teile von Fischernetzen, Flaschenverschlüsse"},{"id":"b|11|problemstudie","ab":78,"s":256,"b":"Problemstudie","e":"Eine Vorgehensweise, bei der man ein Problem Schritt für Schritt nach Plan untersucht: Wie groß ist es? Welche Ursachen hat es? Wer kann zur Lösung beitragen? Was können wir selbst tun?","bsp":"Untersuchung des Plastikmülls in den Meeren"},{"id":"b|11|wwf","ab":78,"s":257,"b":"WWF|World Wide Fund for Nature","e":"Eine der größten Naturschutzorganisationen weltweit.","bsp":"Infografik „Wie gelangt der Müll ins Meer?“"},{"id":"b|11|geisternetze","ab":78,"s":257,"b":"Geisternetze|Geisternetz","e":"Fischernetze, die im Meer verloren gehen oder entsorgt werden und in denen sich Tiere verfangen und sterben.","bsp":""},{"id":"b|11|mikroplastik","ab":78,"s":258,"b":"Mikroplastik","e":"Feste, wasserunlösliche Plastikteilchen, die kleiner als 5 mm sind.","bsp":"Feine Teilchen zwischen den Sandkörnern am Strand, Reifenabrieb, Fasern aus der Wäsche"},{"id":"b|11|partikel","ab":78,"s":258,"b":"Partikel","e":"Anderes Wort für Teilchen.","bsp":"Plastik zerfällt in immer kleinere solche Stücke."},{"id":"b|11|müllstrudel","ab":78,"s":258,"b":"Müllstrudel","e":"Riesige Ansammlungen von Plastikteilen, die auf den Ozeanen treiben.","bsp":"Plastiktüten, Flaschen, Feuerzeuge, FlipFlops"},{"id":"b|11|europäische union","ab":78,"s":259,"b":"Europäische Union|EU","e":"Ein Zusammenschluss von 27 Mitgliedstaaten in Europa, der gemeinsame Regeln beschließt, an die sich alle halten müssen.","bsp":"Verbot bestimmter Einweg-Plastikverpackungen ab 2030"},{"id":"b|11|schutzgebiet","ab":78,"s":259,"b":"Schutzgebiet|Schutzgebiete","e":"Ein Gebiet, das frei von industrieller Nutzung und menschlichem Eingriff bleiben soll.","bsp":"Mindestens 30 Prozent der Weltmeere sollen dazu werden."},{"id":"b|11|einwegverpackung","ab":78,"s":259,"b":"Einwegverpackung|Einweg-Plastikverpackung|Einwegverpackungen","e":"Verpackung, die nur ein einziges Mal benutzt und dann weggeworfen wird.","bsp":"Plastiktüten für frisches Obst und Gemüse"}];
const FRAGEN = [{"id":"f|Womit hat Wirtschaft laut deinem Schulbuch zu tun?","ab":0,"s":9,"f":"Womit hat Wirtschaft laut deinem Schulbuch zu tun?","r":"Mit dem Herstellen, Kaufen, Verkaufen und Nutzen von Waren","x":["Mit dem Wählen von Klassensprechern und Bürgermeistern","Mit dem Erforschen von Pflanzen, Tieren und Gesteinen","Mit dem Lesen und Schreiben von Gedichten und Geschichten"],"e":"Wirtschaft betrifft fast alle Menschen jeden Tag – auch dich."},{"id":"f|Um welche drei Dinge geht es in der Wirtschaft immer?","ab":0,"s":9,"f":"Um welche drei Dinge geht es in der Wirtschaft immer?","r":"Arbeit, Geld und Zeit","x":["Regeln, Wahlen und Gesetze","Sport, Spiel und Spaß","Familie, Freunde und Schule"],"e":"Man kann klug oder unklug wirtschaften – ein Ziel des Faches ist, klug zu wirtschaften."},{"id":"f|Was gehört NICHT zu den Beispielen für Wirtschaft im Alltag, die das Buch nennt?","ab":0,"s":9,"f":"Was gehört NICHT zu den Beispielen für Wirtschaft im Alltag, die das Buch nennt?","r":"Eine Klassensprecherwahl durchführen","x":["Geschenktes Geld sparen oder ausgeben","Ein Spielzeug zum Tauschen anbieten","Zwischen Aufräumen und Freunde treffen wählen"],"e":"Bei einer Wahl geht es um Politik. Bei Geld, Tauschen und dem Verhältnis von Arbeit und Freizeit geht es um Wirtschaft."},{"id":"f|Worum geht es in der Politik?","ab":0,"s":9,"f":"Worum geht es in der Politik?","r":"Um Entscheidungen, die für größere Gruppen von Menschen wichtig sind","x":["Um das Herstellen und Verkaufen von Waren in Fabriken","Um die Frage, was jeder Einzelne zum Frühstück isst","Um das Erforschen von fremden Ländern und Meeren"],"e":"In einer Demokratie geht es auch darum, fair mit verschiedenen Wünschen, Interessen und Meinungen umzugehen."},{"id":"f|Eine Klasse plant einen Ausflug. Bei welcher Frage geht es um Wirtschaft?","ab":0,"s":9,"f":"Eine Klasse plant einen Ausflug. Bei welcher Frage geht es um Wirtschaft?","r":"Wie viel kostet der Ausflug für jeden Einzelnen?","x":["Wie wird über das Ziel des Ausflugs entschieden?","Welche Regeln gelten bei der Abstimmung?","Wer darf bei der Entscheidung mitreden?"],"e":"Kosten und Transportmittel betreffen die Wirtschaft. Die Art, wie entschieden wird, hat mit Politik zu tun."},{"id":"f|Warum hat das Fach Wirtschaft-Politik zwei Namensteile?","ab":0,"s":9,"f":"Warum hat das Fach Wirtschaft-Politik zwei Namensteile?","r":"Weil Wirtschaft und Politik untrennbar zusammenhängen","x":["Weil es zwei verschiedene Lehrkräfte unterrichten","Weil man es nur zwei Jahre lang in der Schule hat","Weil es für dieses Fach zwei Schulbücher gibt"],"e":"Den Zusammenhang von Wirtschaft und Politik stets zu bedenken, gehört zu den Zielen des Faches."},{"id":"f|Was bedeutet Kompetenz?","ab":0,"s":11,"f":"Was bedeutet Kompetenz?","r":"Dass man etwas gut kann und sich in einem Bereich gut auskennt","x":["Dass man in einem Fach immer die beste Note bekommt","Dass man bei einem Wettbewerb gegen alle anderen gewinnt","Dass man zu einem Thema sehr viele Bücher besitzt"],"e":"Kompetenzen fallen einem nicht in den Schoß – man muss sie sich nach und nach erarbeiten."},{"id":"f|Wofür stehen die Buchstaben S, M, U und H der Kompetenzampel?","ab":0,"s":11,"f":"Wofür stehen die Buchstaben S, M, U und H der Kompetenzampel?","r":"Sach-, Methoden-, Urteils- und Handlungskompetenz","x":["Sprach-, Medien-, Unterrichts- und Hilfekompetenz","Schul-, Mathe-, Umwelt- und Heimatkompetenz","Sach-, Medien-, Umgangs- und Hörkompetenz"],"e":"Merkwort „Smuh“: So merkst du dir die Reihenfolge der vier Kompetenzbereiche."},{"id":"f|Welche Kompetenz trainierst du, wenn du dir eine eigene Meinung bildest und sie gut begründest?","ab":0,"s":11,"f":"Welche Kompetenz trainierst du, wenn du dir eine eigene Meinung bildest und sie gut begründest?","r":"Urteilskompetenz","x":["Sachkompetenz","Methodenkompetenz","Handlungskompetenz"],"e":""},{"id":"f|Zu welcher Kompetenz gehört es, selbst mitzumachen, zum Beispiel beim Umweltschutz?","ab":0,"s":11,"f":"Zu welcher Kompetenz gehört es, selbst mitzumachen, zum Beispiel beim Umweltschutz?","r":"Handlungskompetenz","x":["Sachkompetenz","Methodenkompetenz","Urteilskompetenz"],"e":"Zur Handlungskompetenz gehört auch, gut mit anderen in Gruppen zusammenzuarbeiten."},{"id":"f|Was machst du bei den roten Arbeitsaufträgen mit der Nummer 3?","ab":0,"s":12,"f":"Was machst du bei den roten Arbeitsaufträgen mit der Nummer 3?","r":"Etwas beurteilen und bewerten","x":["Den Inhalt des Materials verstehen","Das Material genau analysieren","Ein Plakat für die Klasse malen"],"e":"Grün (1) = verstehen, Blau (2) = analysieren, Rot (3) = beurteilen und bewerten."},{"id":"f|Welches Ziel haben die Kompetenzstationen im Buch?","ab":0,"s":12,"f":"Welches Ziel haben die Kompetenzstationen im Buch?","r":"„Ich behalte wichtige Sachen!“","x":["„Ich kann Wichtiges!“","„Ich lerne eigenverantwortlich!“","„Ich arbeite schneller als andere!“"],"e":"Mit den Kompetenzstationen wiederholst du das Gelernte am Ende eines Kapitels."},{"id":"f|Was ist das Problem, wenn ein Chatbot deine Aufgaben für dich löst?","ab":0,"s":13,"f":"Was ist das Problem, wenn ein Chatbot deine Aufgaben für dich löst?","r":"Das Programm lernt dazu, aber du selbst lernst nichts","x":["Der Chatbot macht dabei immer viele Rechtschreibfehler","Die Lehrkraft kann die Lösungen dann nicht mehr lesen","Der Chatbot verrät die Lösung allen anderen Kindern"],"e":"Das ist so, als würde man jemand anderen im Sport für sich trainieren lassen."},{"id":"f|Welche Empfehlung gibt das Buch zum Lernen mit Chatbots?","ab":0,"s":13,"f":"Welche Empfehlung gibt das Buch zum Lernen mit Chatbots?","r":"Löse die Aufgaben im Buch selbst, um dich zu verbessern","x":["Lass den Chatbot alle deine Hausaufgaben erledigen","Ersetze deine Intelligenz durch eine künstliche","Lass dir vom Chatbot jedes Urteil abnehmen"],"e":"Bleib die Chefin oder der Chef deines eigenen Lernens."},{"id":"f|Welchen Vorteil hat eine Arbeitsmappe gegenüber einem Heft?","ab":0,"s":14,"f":"Welchen V uf, als die Klasse ein Aquarium haben möchte?","ab":10,"s":44,"f":"Welchen Grundsatz nennt Herr Mallauf, als die Klasse ein Aquarium haben möchte?","r":"Wer Rechte hat, der muss auch Pflichten übernehmen.","x":["Wer zuerst kommt, der darf auch zuerst entscheiden.","Wer die meisten Ideen hat, der darf alles bestimmen.","Wer Pflichten hat, der braucht keine Rechte mehr."],"e":"Ein Aquarium braucht Futter, Pflege und gutes Wasser – auch in den Ferien."},{"id":"f|Was sind Rechte?","ab":10,"s":45,"f":"Was sind Rechte?","r":"garantierte Freiheiten","x":["Aufgaben, die man erledigen muss","Strafen für falsches Verhalten","Wünsche, die man äußern darf"],"e":"In der Demokratie haben alle Menschen Rechte und Pflichten."},{"id":"f|Welche Aufgabe haben Pflichten?","ab":10,"s":45,"f":"Welche Aufgabe haben Pflichten?","r":"Sie begrenzen die Freiheit und schützen so die Freiheiten aller.","x":["Sie sorgen dafür, dass nur Erwachsene Freiheiten haben.","Sie heben alle Freiheiten für Kinder vollständig auf.","Sie sorgen dafür, dass jeder machen kann, was er will."],"e":"Pflichten sorgen auch dafür, dass es gleiche Rechte für alle gibt."},{"id":"f|Wer hat ein eigenes Schulgesetz?","ab":10,"s":45,"f":"Wer hat ein eigenes Schulgesetz?","r":"jedes Bundesland","x":["jede Schule","jede Stadt","jede Klasse"],"e":"Darin sind die Rechte und Pflichten von Schülern, Lehrkräften und Eltern geregelt."},{"id":"f|Wo werden Schulgesetze beraten und verabschiedet?","ab":10,"s":45,"f":"Wo werden Schulgesetze beraten und verabschiedet?","r":"in den Landesparlamenten","x":["in den Schulkonferenzen","im Schülerrat","in den Rathäusern"],"e":"Schulgesetze sind daher das Ergebnis einer demokratischen Entscheidung."},{"id":"f|Was regeln Verordnungen und Erlasse?","ab":10,"s":45,"f":"Was regeln Verordnungen und Erlasse?","r":"wie einzelne Regeln des Schulgesetzes in der Praxis umgesetzt werden","x":["welche Noten die Schüler in den Zeugnissen bekommen","welche Bücher in jeder einzelnen Klasse gelesen werden", h gut gestellten Familien werden aufgenommen. Ist das erlaubt?","ab":10,"s":46,"f":"Im Entwurf einer Schulordnung steht: Nur Kinder aus wirtschaftlich gut gestellten Familien werden aufgenommen. Ist das erlaubt?","r":"Nein, jeder junge Mensch hat ein Recht auf schulische Bildung.","x":["Ja, jede Schule darf sich ihre Schüler frei aussuchen.","Ja, wenn die Schulkonferenz das so beschlossen hat.","Nein, aber nur weil Eltern nicht gefragt wurden."],"e":"§ 1 des Schulgesetzes: Das Recht auf Bildung gilt ohne Rücksicht auf wirtschaftliche Lage, Herkunft und Geschlecht."},{"id":"f|Welche Regel aus dem Entwurf der Schulordnung passt zum Schulgesetz?","ab":10,"s":46,"f":"Welche Regel aus dem Entwurf der Schulordnung passt zum Schulgesetz?","r":"Schüler müssen sich auf den Unterricht vorbereiten und aktiv mitarbeiten.","x":["Schüler sind zu jung, um bei der Unterrichtsgestaltung mitzuwirken.","Schüler sollen sich ausschließlich aufs Lernen für sich allein konzentrieren.","Die Schülerzeitung darf nur außerhalb des Schulgeländes verteilt werden."],"e":"Das steht so in § 42 (3) des Schulgesetzes NRW."},{"id":"f|Was gilt laut Schulgesetz, wenn man sich für eine freiwillige Unterrichtsveranstaltung (z. B. eine AG) anmeldet?","ab":10,"s":47,"f":"Was gilt laut Schulgesetz, wenn man sich für eine freiwillige Unterrichtsveranstaltung (z. B. eine AG) anmeldet?","r":"Man muss mindestens ein Schulhalbjahr regelmäßig teilnehmen.","x":["Man kann jederzeit ohne Grund wieder aufhören.","Man muss bis zum Ende der Schulzeit teilnehmen.","Man darf nur kommen, wenn man gerade Lust hat."],"e":"§ 43 (3) Schulgesetz NRW."},{"id":"f|Welches Recht haben Schülerinnen und Schüler laut § 45 des Schulgesetzes?","ab":10,"s":47,"f":"Welches Recht haben Schülerinnen und Schüler laut § 45 des Schulgesetzes?","r":"Schülerzeitungen herausgeben und auf dem Schulgrundstück verbreiten","x":["Noten für ihre Lehrkräfte vergeben und veröffentlichen","den Stundenplan ihrer Klasse selbst festlegen","dem Unterricht fe
